*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em}
h1{font-size:clamp(21px,3.4vw,30px);line-height:1.2}
h2{font-size:16px}
h3{font-size:14px}
button,input,select{font:inherit;color:inherit}
a{color:var(--marca-vivo)}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0}
.mono{font-family:var(--mono)}

/* --- cabecera ---------------------------------------------------------- */
header{position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap}
.logo{background-image:var(--logo);background-size:contain;background-repeat:no-repeat;
  background-position:left center;width:150px;height:32px;flex:none}
.crece{flex:1 1 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 11px;font-size:12.5px;
  cursor:pointer;color:var(--ink-soft);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--marca-vivo);color:#fff}
.seg button:focus-visible{outline:2px solid var(--marca-vivo);outline-offset:-2px}
.enchufe{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:3px;padding:5px 10px;background:var(--surface-2);
  cursor:pointer}
.punto{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.punto.vivo{background:var(--ata);box-shadow:0 0 0 3px var(--ata-fondo)}

/* --- portada ----------------------------------------------------------- */
.hero{padding-block:28px 20px}
.hero p.lede{margin:10px 0 0;color:var(--ink-soft);max-width:78ch}
.aviso{margin-top:16px;border-left:3px solid var(--marca-vivo);background:var(--surface);
  padding:11px 14px;font-size:13px;color:var(--ink-soft);border-radius:0 3px 3px 0;
  box-shadow:var(--sombra)}

/* --- categorias de producto -------------------------------------------- */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;
  margin-block:18px}
.cat{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:5px;
  padding:14px 15px;cursor:pointer;transition:border-color .12s,transform .12s;
  box-shadow:var(--sombra)}
.cat:hover{border-color:var(--marca-vivo)}
.cat[aria-pressed="true"]{border-color:var(--marca-vivo);
  box-shadow:0 0 0 1px var(--marca-vivo),var(--sombra)}
.cat h3{margin-bottom:4px}
.cat p{margin:0;font-size:12.5px;color:var(--ink-soft)}
.cat .n{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.14em}

/* --- el ciclo ---------------------------------------------------------- */
.ciclo{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden;
  margin-bottom:18px}
.paso{background:var(--surface);padding:12px 14px;min-height:72px;display:flex;
  flex-direction:column;gap:2px}
.paso .v{margin-top:auto}
.paso .n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.paso .t{font-size:12.5px;font-weight:600}
.paso .v{font-family:var(--mono);font-size:22px;line-height:1.1;color:var(--ink)}
.paso .v.gris{color:var(--muted);font-size:12px;font-weight:400;padding-top:4px}

/* --- rejilla ----------------------------------------------------------- */
.rejilla{display:grid;grid-template-columns:308px minmax(0,1fr);gap:18px;align-items:start;
  padding-bottom:56px}
/* `minmax(0,1fr)` y no `1fr`: un elemento de rejilla tiene `min-width:auto`, asi
   que el <pre> del documento crudo empujaba la columna entera mas ancha que la
   pagina y aparecia una barra horizontal en toda la ventana. */
.rejilla>*{min-width:0}
.columna-izquierda{position:sticky;top:72px}
@media (max-width:1000px){.rejilla{grid-template-columns:1fr}
  .columna-izquierda{position:static}}
.tarjeta{background:var(--surface);border:1px solid var(--line);border-radius:5px;
  box-shadow:var(--sombra);overflow:hidden}
.tarjeta>header{position:static;border:0;border-bottom:1px solid var(--line-soft);
  background:var(--surface-2);padding:10px 14px;display:flex;align-items:center;gap:10px;
  flex-wrap:wrap}
.tarjeta>header h2{font-size:13px}
.cuerpo{padding:13px 14px}
.campo{display:block;margin-bottom:11px}
.campo>span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.campo input,.campo select{width:100%;padding:7px 9px;border:1px solid var(--line);
  border-radius:3px;background:var(--ground);font-size:13.5px}
.campo input:focus,.campo select:focus{outline:2px solid var(--marca-vivo);outline-offset:-1px}
.boton{background:var(--marca-vivo);color:#fff;border:0;border-radius:3px;padding:8px 14px;
  font-size:13.5px;cursor:pointer;font-weight:500}
.boton:hover{background:var(--marca-medio)}
.boton:disabled{background:var(--muted);cursor:progress}
.boton.plano{background:transparent;color:var(--marca-vivo);border:1px solid var(--line)}
.boton.plano:hover{border-color:var(--marca-vivo);background:var(--ata-fondo)}
.acciones{display:flex;flex-wrap:wrap;gap:8px}

/* --- recuentos --------------------------------------------------------- */
.recuento{display:flex;flex-wrap:wrap;gap:7px;padding:13px 14px;align-items:center}
.recuento .sub{flex-basis:100%;margin:4px 0 0;font-size:12px;color:var(--muted);
  line-height:1.45}
.pastilla{display:inline-flex;align-items:baseline;gap:7px;border-radius:3px;padding:5px 10px;
  font-size:12px;background:var(--noata-fondo);color:var(--noata)}
.pastilla b{font-family:var(--mono);font-size:15px;font-weight:500}
.pastilla.ata{background:var(--ata-fondo);color:var(--ata)}
.pastilla.futura{background:var(--futura-fondo);color:var(--futura)}
.pastilla.indet{background:var(--indet-fondo);color:var(--indet)}
.pastilla.mal{background:var(--hallazgo-fondo);color:var(--hallazgo)}

/* --- lineas ------------------------------------------------------------ */
.linea{border-bottom:1px solid var(--line-soft);padding:11px 14px;display:grid;
  grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:start;
  transition:background .1s}
.linea:hover{background:var(--surface-2)}
.linea>div{min-width:0}
.linea:last-child{border-bottom:0}
.art{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.linea h3{font-size:13.5px;font-weight:500;line-height:1.4}
.linea .sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
.marca{font-size:10.5px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;
  border-radius:2px;padding:3px 7px;white-space:nowrap;background:var(--noata-fondo);
  color:var(--noata)}
.marca.ata{background:var(--ata-fondo);color:var(--ata)}
.marca.futura{background:var(--futura-fondo);color:var(--futura)}
.marca.indet{background:var(--indet-fondo);color:var(--indet)}
.marca.mal{background:var(--hallazgo-fondo);color:var(--hallazgo)}
details.detalle{margin-top:7px}
details.detalle summary{cursor:pointer;font-size:12px;color:var(--marca-vivo);
  list-style:none}
details.detalle summary::-webkit-details-marker{display:none}
details.detalle summary::before{content:"▸ ";font-size:10px}
details.detalle[open] summary::before{content:"▾ "}
.detalle ul{margin:7px 0 0;padding-left:17px;font-size:12.5px;color:var(--ink-soft)}
.detalle li{margin-bottom:5px}
.vacio{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}
pre.crudo{margin:0;padding:13px 14px;overflow:auto;max-height:420px;max-width:100%;font-family:var(--mono);
  font-size:11.5px;line-height:1.5;background:var(--surface-2);color:var(--ink-soft)}
.pie{border-top:1px solid var(--line);padding-block:20px 34px;color:var(--muted);font-size:12px}
.oculto{display:none!important}
.grave{color:var(--hallazgo)}

/* El aviso de que no hay porcentaje va arriba y se queda: es la frase que
   distingue a este producto del resto, y la unica que alguien buscara en la
   pantalla cuando su director le pida "el porcentaje". */
.aviso{font-size:13px}
#sello{max-width:100%;overflow-wrap:anywhere}
.paso .v.gris{margin-top:auto}

/* Texto que sólo leen los lectores de pantalla.
 *
 * No es `display:none` ni `visibility:hidden`: los dos lo quitan también del
 * árbol de accesibilidad, así que el lector tampoco lo lee y la etiqueta deja
 * de existir para quien la necesita. El recorte a un píxel es la forma que sí
 * lo deja leer.
 *
 * Hace falta porque el buscador de la lista no tiene etiqueta visible -- su
 * sitio está junto al título de la tarjeta -- y un `input` sin nombre
 * accesible se anuncia como «campo de edición» y nada más. */
.visualmente-oculto {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}

/* El foco del teclado, VISIBLE.
 *
 * Los navegadores lo pintan solos y es lo primero que quita cualquier hoja de
 * estilo con `outline:none` para que «quede limpio». Aquí se refuerza en vez
 * de quitarse: sin un foco visible, la página se puede recorrer con el teclado
 * y no se puede saber donde estas, que es lo mismo que no poder recorrerla. */
:is(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
  border-radius: 4px;
}

/* El panel conectado. NO calcula nada: pinta lo que el motor devolvio.
 *
 * LA REGLA DE ESTE FICHERO ES LA MISMA QUE LA DE LA API
 * ------------------------------------------------------
 * Traduce presentacion, nunca significado. Cada numero que sale en pantalla

 * documento, en los dos idiomas, escrita por una persona. Aqui no se suma, no

dor_fijado":"Esta página la sirve este servidor, y su política de seguridad sólo deja hablar con él. Es a propósito: si alguien colara un script aquí, no podría mandarse tu expediente a otro sitio.","servidor_libre":"Has abierto esta página como fichero, así que no hay política de seguridad que la limite y puedes apuntar a cualquier servidor. Tampoco hay nada que impida que un script se lleve tu credencial: para algo que no sea una prueba, pide la página a tu servidor.","vistas":"Qué quieres ver","pedir_ev":"Evidencia","pedir_preg":"Qué falta contestar","pedir_soa":"Declaración de aplicabilidad","pedir_anx":"Expediente técnico","pedir_rev":"Revisión por la dirección","buscar":"Buscar en la lista","buscar_nada":"Ninguna línea coincide con «{q}».","buscar_algunas":"{n} de {total} líneas coinciden con «{q}».","buscar_todas":"{total} líneas.","pedir_apl":"Qué me ata","pedir_comp":"Artículo 50","sin_datos_conectado":"Conectado. Elige una vista arriba para pedirle el documento al motor.","buscar_una":"1 línea.","doc_en_otro_idioma":"La interfaz está en este idioma; el documento llega en inglés. El motor emite el contenido normativo sólo en español y en inglés, porque lo escribe una persona y no una traducción automática.","almacen_fichero":"Fichero","almacen_hay":"existe","almacen_no_hay":"todavía no","almacen_no_existe":"Todavía no hay almacén. Un cliente que no ha observado nada no tiene fichero, y ese es su estado normal el primer día: no significa que algo esté mal.","almacen_cadena":"Cadena","almacen_verifica":"La cadena de sellos cuadra de principio a fin.","almacen_no_verifica":"La cadena de sellos no cuadra.","almacen_ok":"verifica","almacen_rota":"rota","almacen_cabeza":"Cabeza","almacen_sin_cabeza":"Sin cabeza: no hay ninguna línea sellada.","almacen_cabeza_esperada":"Cabeza esperada","almacen_cabeza_no_comprobada":"Nadie dijo qué cabeza esperaba, así que esta comprobación no se ha hecho. No es lo mismo que que cuadre.","almacen_observaciones":"observaciones selladas","almacen_sin_cadena":"líneas sin cadena demostrable","almacen_sin_cadena_pie":"O las escribió una versión del motor que no encadenaba, o vinieron de un almacén que encadenaba y no cuadraba. La marca va dentro del sello y no se puede quitar.","sin_nada":"Este documento no trae ninguna línea. No es un filtro: el motor no encontró nada que enseñar aquí."},"en":{"titulo":"Actaira · Console","eyebrow":"Regulation (EU) 2024/1689 · ISO/IEC 42001:2023","titular":"Your system's state, read from the documents the engine emits.","entradilla":"This panel computes nothing. Every number you see comes inside the document the engine emits, and so does every sentence explaining it. If the engine did not say it, it is not here.","categoria":"Product category","cat_dev":"Engineering team","cat_dev_pie":"The repository, continuous integration and findings where you already look.","cat_pyme":"Small business","cat_pyme_pie":"What binds you, what is left to answer and the file, with no template to fill in.","cat_empresa":"Enterprise","cat_empresa_pie":"Several systems, continuous monitoring, nonconformities and delegated remediation.","conexion":"Connection","sin_conexion":"Not connected","conectado":"Connected","servidor":"Server","cliente":"Client","credencial":"Credential","credencial_nota":"The credential stays in memory and is not stored anywhere in the browser. Reloading means typing it again, and that is deliberate: a token in browser storage is readable by any script on the page.","conectar":"Connect","desconectar":"Disconnect","probando":"Trying…","no_llega":"The server could not be reached. Check the address, and that the server allows requests from this origin.","credencial_mala":"That credential is not valid for that client.","sin_datos":"Nothing to show yet: connect a server and ask for the plan.","pedir_plan":"Ask for the plan","pedir_vigilancia":"Ask for monitoring","pedir_nc":"Nonconformities","pedir_venc":"What expired","perfil":"Your profile","roles":"What are you with respect to the system?","alto_riesgo":"Is it high-risk?","via":"By which route?","sector":"Public sector?","uso_general":"General-purpose model?","sistemico":"With systemic risk?","fecha":"Assessment date","si":"Yes","no":"No","nulo":"Unanswered","estado_del_ciclo":"The cycle","p1":"What binds you","p2":"What came up","p3":"What you must be asked","p4":"What expired","p5":"What is open","recuento":"Counts","sin_recuento":"Not asked yet","lineas":"Obligation by obligation","todas":"All","hallazgos":"Findings","preguntas":"Questions","remediacion":"What to do","donde":"Where","regla":"Rule","sin_lineas":"No line matches this filter.","documento":"The document as it came","doc_nota":"This is what the engine returned, untouched. If something on screen is not in here, that is a defect of this page.","esquema":"Schema","codigo":"Exit code","codigo_0":"it was looked at and nothing was left pending","codigo_1":"something appeared","codigo_3":"something is unanswered, or must be looked at again","codigo_4":"the analyser broke","codigo_5":"the store is not the one this house wrote","sin_porcentaje":"There is no compliance percentage, no grade and no overall traffic light. These are counts of obligations, and an obligation is met by an organisation, not by a control.","ejecutada_no_es_cerrada":"EXECUTED is not closed: clause 10.2 asks whether the action worked, and that is a later observation.","nc_vencida":"Overdue","nc_estancada":"Stalled","nc_incoherente":"Incoherent","dias":"days","nada_que_avisar":"Nothing to report today.","error_motor":"The engine answered, and what it answered is not understood as a document.","tema_claro":"Light","tema_oscuro":"Dark","roles_ayuda":"You can pick several: an organisation is usually the provider of one system and the deployer of another.","origen_nota":"What this page does NOT do: check a signature. The document arrives over the connection you opened to your server, and that connection is all the origin guarantee it has. The intro used to say «a document signed by the engine» and that was not true: the engine can sign —the `sellar` verb emits an Ed25519 seal verifiable offline— but neither does the API sign nor does this page check. For a claim you can put in front of a third party, request the sealed dossier and verify it with `actaira verificar --clave-esperada`.","servidor_fijado":"This page is served by this server, and its security policy only allows talking to it. That is deliberate: if somebody injected a script here, it could not send your dossier anywhere else.","servidor_libre":"You opened this page as a file, so no security policy constrains it and you can point it at any server. Equally, nothing stops a script from taking your credential: for anything beyond a trial, ask your server for the page.","vistas":"What do you want to see","pedir_ev":"Evidence","pedir_preg":"What is left to answer","pedir_soa":"Statement of applicability","pedir_anx":"Technical documentation","pedir_rev":"Management review","buscar":"Search the list","buscar_nada":"No line matches «{q}».","buscar_algunas":"{n} of {total} lines match «{q}».","buscar_todas":"{total} lines.","pedir_apl":"What binds me","pedir_comp":"Article 50","sin_datos_conectado":"Connected. Pick a view above to ask the engine for the document.","buscar_una":"1 line.","doc_en_otro_idioma":"The interface is in this language; the document arrives in English.","almacen_fichero":"File","almacen_hay":"present","almacen_no_hay":"not yet","almacen_no_existe":"There is no store yet. A client that has observed nothing has no file, and that is its normal state on day one: it does not mean something is wrong.","almacen_cadena":"Chain","almacen_verifica":"The chain of seals holds from start to end.","almacen_no_verifica":"The chain of seals does not hold.","almacen_ok":"verifies","almacen_rota":"broken","almacen_cabeza":"Head","almacen_sin_cabeza":"No head: there is no sealed line.","almacen_cabeza_esperada":"Expected head","almacen_cabeza_no_comprobada":"Nobody stated which head they expected, so this check was not made. That is not the same as it matching.","almacen_observaciones":"sealed observations","almacen_sin_cadena":"lines with no demonstrable chain","almacen_sin_cadena_pie":"Either a version of the engine that did not chain wrote them, or they came from a store that chained and did not hold. The mark is inside the seal and cannot be removed.","sin_nada":"This document brings no lines. It is not a filter: the engine found nothing to show here."},"fr":{"titulo":"Actaira · Console","eyebrow":"Règlement (UE) 2024/1689 · ISO/IEC 42001:2023","titular":"L'état de votre système, lu dans les documents qu'émet le moteur.","entradilla":"Cette console ne calcule rien. Chaque chiffre que vous voyez arrive dans le document qu'émet le moteur, et chaque phrase qui l'explique aussi. Si le moteur ne l'a pas dit, il n'apparaît pas ici.","categoria":"Catégorie de produit","cat_dev":"Équipe technique","cat_dev_pie":"Le dépôt, l'intégration continue et les constats là où vous regardez déjà.","cat_pyme":"PME","cat_pyme_pie":"Ce qui vous lie, ce qu'il reste à répondre et le dossier, sans modèle à remplir.","cat_empresa":"Entreprise","cat_empresa_pie":"Plusieurs systèmes, surveillance continue, non-conformités et remédiation déléguée.","conexion":"Connexion","sin_conexion":"Non connecté","conectado":"Connecté","servidor":"Serveur","cliente":"Client","credencial":"Identifiant","credencial_nota":"L'identifiant reste en mémoire et n'est enregistré nulle part dans le navigateur. Au rechargement il faut le retaper, et c'est voulu : un jeton dans le stockage du navigateur est lisible par n'importe quel script de la page.","conectar":"Se connecter","desconectar":"Se déconnecter","probando":"Essai…","no_llega":"Le serveur n'a pas répondu. Vérifiez l'adresse, et que le serveur accepte les requêtes depuis cette origine.","credencial_mala":"Cet identifiant ne vaut pas pour ce client.","sin_datos":"Rien à montrer pour l'instant : connectez un serveur et demandez le plan.","pedir_plan":"Demander le plan","pedir_vigilancia":"Demander la surveillance","pedir_nc":"Non-conformités","pedir_venc":"Ce qui a expiré","perfil":"Votre profil","roles":"Que sommes-nous vis-à-vis du système ?","alto_riesgo":"Est-il à haut risque ?","via":"Par quelle voie ?","sector":"Secteur public ?","uso_general":"Modèle à usage général ?","sistemico":"Avec risque systémique ?","fecha":"Date d'évaluation","si":"Oui","no":"Non","nulo":"Sans réponse","estado_del_ciclo":"Le cycle","p1":"Ce qui vous lie","p2":"Ce qui est apparu","p3":"Ce qu'il faut vous demander","p4":"Ce qui a expiré","p5":"Ce qui est ouvert","recuento":"Décompte","sin_recuento":"Pas encore demandé","lineas":"Obligation par obligation","todas":"Toutes","hallazgos":"Constats","preguntas":"Questions","remediacion":"Que faire","donde":"Où","regla":"Règle","sin_lineas":"Aucune ligne ne correspond à ce filtre.","documento":"Le document tel quel","doc_nota":"C'est ce qu'a renvoyé le moteur, sans y toucher. Si quelque chose de l'écran n'est pas là-dedans, c'est un défaut de cette page.","esquema":"Schéma","codigo":"Code de sortie","codigo_0":"on a regardé et rien ne reste en attente","codigo_1":"quelque chose est apparu","codigo_3":"il reste à répondre, ou il y a quelque chose à revoir","codigo_4":"l'analyseur s'est cassé","codigo_5":"le magasin n'est pas celui que cette maison a écrit","sin_porcentaje":"Il n'y a pas de pourcentage de conformité, ni de note, ni de feu tricolore global. Ce sont des décomptes d'obligations, et une obligation est remplie par une organisation, pas par un contrôle.","ejecutada_no_es_cerrada":"EJECUTADA n'est pas clôturée : la clause 10.2 demande de vérifier si l'action a fonctionné, et cela est une observation postérieure.","nc_vencida":"Échue","nc_estancada":"À l'arrêt","nc_incoherente":"Incohérente","dias":"jours","nada_que_avisar":"Rien à signaler aujourd'hui.","error_motor":"Le moteur a répondu, et ce qu'il a répondu ne se comprend pas comme un document.","tema_claro":"Clair","tema_oscuro":"Sombre","roles_ayuda":"Vous pouvez en cocher plusieurs : une organisation est souvent fournisseur d'un système et déployeur d'un autre.","origen_nota":"Ce que cette page NE fait PAS : vérifier une signature. Le document arrive par la connexion que vous avez ouverte avec votre serveur, et cette connexion est toute la garantie d'origine dont il dispose. Le moteur sait signer — le verbe `sellar` émet un sceau Ed25519 vérifiable sans réseau — mais ni l'API ne le signe ni cette page ne le vérifie. Pour une affirmation face à un tiers, demandez le dossier scellé et vérifiez-le avec `actaira verificar --clave-esperada`.","servidor_fijado":"Cette page est servie par ce serveur, et sa politique de sécurité ne laisse parler qu'avec lui. C'est voulu : si quelqu'un glissait un script ici, il ne pourrait pas envoyer votre dossier ailleurs.","servidor_libre":"Vous avez ouvert cette page comme un fichier, il n'y a donc aucune politique de sécurité qui la limite et vous pouvez viser n'importe quel serveur. Rien n'empêche non plus un script d'emporter votre identifiant : pour autre chose qu'un essai, demandez la page à votre serveur.","vistas":"Que voulez-vous voir","pedir_ev":"Preuves","pedir_preg":"Ce qu'il reste à répondre","pedir_soa":"Déclaration d'applicabilité","pedir_anx":"Dossier technique","pedir_rev":"Revue de direction","buscar":"Chercher dans la liste","buscar_nada":"Aucune ligne ne correspond à « {q} ».","buscar_algunas":"{n} lignes sur {total} correspondent à « {q} ».","buscar_todas":"{total} lignes.","pedir_apl":"Ce qui me lie","pedir_comp":"Article 50","sin_datos_conectado":"Connecté. Choisissez une vue ci-dessus pour demander le document au moteur.","buscar_una":"1 ligne.","doc_en_otro_idioma":"L'interface est dans cette langue ; le document arrive en anglais. Le moteur n'émet le contenu normatif qu'en espagnol et en anglais, parce qu'il est écrit par une personne et non par une traduction automatique.","almacen_fichero":"Fichier","almacen_hay":"présent","almacen_no_hay":"pas encore","almacen_no_existe":"Il n'y a pas encore de dépôt. Un client qui n'a rien observé n'a pas de fichier, et c'est son état normal le premier jour : cela ne signifie pas qu'il y a un problème.","almacen_cadena":"Chaîne","almacen_verifica":"La chaîne de sceaux tient du début à la fin.","almacen_no_verifica":"La chaîne de sceaux ne tient pas.","almacen_ok":"vérifie","almacen_rota":"rompue","almacen_cabeza":"Tête","almacen_sin_cabeza":"Pas de tête : aucune ligne scellée.","almacen_cabeza_esperada":"Tête attendue","almacen_cabeza_no_comprobada":"Personne n'a dit quelle tête il attendait, donc cette vérification n'a pas été faite. Ce n'est pas la même chose qu'une concordance.","almacen_observaciones":"observations scellées","almacen_sin_cadena":"lignes sans chaîne démontrable","almacen_sin_cadena_pie":"Soit une version du moteur qui n'enchaînait pas les a écrites, soit elles viennent d'un dépôt qui enchaînait sans tenir. La marque est dans le sceau et ne peut pas être retirée.","sin_nada":"Ce document n'apporte aucune ligne. Ce n'est pas un filtre : le moteur n'a rien trouvé à montrer ici."},"pt":{"titulo":"Actaira · Painel","eyebrow":"Regulamento (UE) 2024/1689 · ISO/IEC 42001:2023","titular":"O estado do seu sistema, lido nos documentos que o motor emite.","entradilla":"Este painel não calcula nada. Cada número que vê vem dentro do documento que o motor emite, e cada frase que o explica também. Se o motor não o disse, aqui não aparece.","categoria":"Categoria de produto","cat_dev":"Equipa técnica","cat_dev_pie":"O repositório, a integração contínua e as constatações onde já olha.","cat_pyme":"PME","cat_pyme_pie":"O que o vincula, o que falta responder e o dossiê, sem modelo para preencher.","cat_empresa":"Empresa","cat_empresa_pie":"Vários sistemas, vigilância contínua, não conformidades e remediação delegada.","conexion":"Ligação","sin_conexion":"Sem ligação","conectado":"Ligado","servidor":"Servid /* ESTA TABLA SE QUEDO ATRAS Y ESCONDIO EL PRODUCTO.
 *
 * `RUTAS` paso de cuatro vistas a once y esto no se toco, asi que SIETE de las
 * once no se podian alcanzar desde ninguna categoria: el Anexo IV, la
 * declaracion de aplicabilidad, el cuestionario, el almacen de evidencia, la
 * revision por la direccion, la aplicabilidad y el control del articulo 50.
 * Justo lo que la portada vende.
 *
 * Es el mismo defecto que ya tuvo la API una capa mas abajo -- traducia cinco
 * de diecinueve verbos, y quien abria el panel concluia que el producto hace
 * cinco cosas -- reaparecido una capa mas arriba: se arreglo la API, se
 * amplio `RUTAS`, y la tabla que decide QUE SE VE se quedo como estaba. El
 * arreglo nunca llego a la pantalla.
 *
 * Y lo peor es que el texto de cada categoria ya prometia lo que la categoria
 * no daba: «Pyme: lo que te ata, lo que falta por contestar y el expediente»
 * ensenaba el plan y los vencimientos, ni el cuestionario ni el expediente.
 * El reparto de abajo es el que ese texto ya decia.
 *
 * Hay ahora una puerta -- `test_toda_vista_es_alcanzable` -- que falla si una
 * vista de `RUTAS` no aparece en ninguna categoria: un boton que existe y no
 * se puede pulsar nunca es peor que un boton que no existe, porque nadie lo
 * echa de menos. */

  dev:     { pasos: ["p2", "p3", "p5"],

  // Lo que te ata, lo que falta por contestar y el expediente.
  pyme:    { pasos: ["p1", "p2", "p3"],
             verbos: ["apl", "plan", "preg", "soa", "anx", "venc"] },
  // Varios sistemas, vigilancia continua, no conformidades y remediacion.
  empresa: { pasos: ["p1", "p2", "p3", "p4", "p5"],
             verbos: ["apl", "plan", "comp", "preg", "soa", "anx",
                      "vig", "venc", "nc", "ev", "rev"] },
};

/* Los campos de DOCUMENTO que esta pagina lee, en un solo sitio y con nombre.
 *
 * Existe para poder comprobarlos contra el contrato publicado: si el motor
 * renombra un campo, esta lista y `contrato/*.json` dejan de casar y la puerta
 * lo dice. Sin ella, la pantalla se quedaria en blanco sin que fallara nada,
 * que es el modo de fallo que el contrato existe para evitar y que hasta ahora
 * solo cubria el lado Go.
 *
 * Lo que esta lista NO demuestra, y se dice en vez de disimularlo: que el
 * codigo no lea ademas algun campo que no este aqui. Comprobarlo de verdad
 * pedia analizar JavaScript, y un analizador a medias se relaja hasta que deja
 * de mirar. Lo que si se comprueba es que todo lo de aqui existe en el
 * contrato Y aparece en el codigo, asi que la lista no envejece por los dos
 * lados a la vez.
 */
const CAMPOS_DEL_DOCUMENTO = [
  "esquema", "recuento", "lineas", "veredictos", "no_conformidades",
  "total_preguntas", "a_reobservar", "nota_de_recuento", "nota_del_cierre",
  "articulo", "obligacion_id", "titulo", "estado", "hallazgos", "preguntas",
  "motivo", "por_que", "remediacion", "localizacion", "regla_id", "texto",
  "situacion", "regla", "id", "descripcion", "origen", "dias_abierta",
  "incoherencias", "vencida", "estancada", "nombres_de_estado",
  // Los del almacen de evidencia. No estaban porque la pantalla no leia
  // ninguno: la vista existia, pedia el documento y no pintaba nada de lo que
  // venia dentro. Ahora los lee, asi que entran en la lista y el contrato los
  // sujeta como a los demas.
  "ruta", "existe", "verifica", "roturas", "cabeza", "nota_de_la_cabeza",
  "cabeza_esperada", "cabeza_es_la_esperada", "por_que_no_es_la_esperada",
  "observaciones", "sin_cadena_demostrable",
];

/* Como se lee un estado. El nombre lo publica el MOTOR dentro del documento,
 * porque el vocabulario del producto es suyo: si lo tuviera esta pagina, el
 * dia que el motor anada un estado un cliente ingles veria `sin_cubrir` en
 * crudo, que es el defecto que la fase 20 encontro mirando la pantalla en
 * ingles. Si falta, se ensena el identificador: feo y verdad. */
function nombreDe(clave) {
  const r = estado.documentos[estado.vista];
  const tabla = r && r.documento ? r.documento.nombres_de_estado : null;
  const n = tabla && tabla[clave] ? bil(tabla[clave]) : "";
  return n || String(clave || "").replace(/_/g, " ");
}

const estado = {
  idioma: "es",
  tema: "",
  categoria: "pyme",
  conectado: false,
  servidor: "",
  cliente: "",
  credencial: "",          // en memoria y en ningun otro sitio
  documentos: {},          // verbo -> {codigo, documento, esquema}
  vista: "plan",
  filtro: "todas",
};

/* --- utilidades sin ninguna doctrina dentro ------------------------------ */

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

function vaciar(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }

function el(etiqueta, clase, texto) {
  const n = document.createElement(etiqueta);
  if (clase) n.className = clase;
  if (texto !== undefined && texto !== null) n.textContent = String(texto);
  return n;
}

/* EL IDIOMA DE LA INTERFAZ NO ES EL DEL DOCUMENTO, Y NO PUEDE SERLO.
 *
 * Esta pagina habla seis idiomas. El MOTOR emite sus documentos en dos, `es` y
 * `en`, porque lo que va dentro es contenido normativo -- titulos de
 * obligaciones, motivos, remediaciones, el texto de cada pregunta -- y eso lo
 * escribe una persona, no una maquina. Traducirlo a maquina seria exactamente
 * lo que la segunda negativa de esta casa prohibe.
 *
 * Asi que son dos ajustes distintos. Si se hubieran atado, poner la interfaz
 * en frances habria dejado el contenido EN BLANCO: `bil()` devuelve vacio a
 * proposito cuando falta el idioma pedido, y eso es correcto -- un expediente
 * en un idioma con frases sueltas en otro es el defecto que el motor lleva
 * doce fases evitando -- pero aplicado a un idioma que el motor no emite
 * habria vaciado la pantalla sin decir por que.
 *
 * El documento se pide en el idioma de la interfaz cuando el motor lo emite, y
 * en ingles cuando no. La pantalla lo DICE en vez de disimularlo. */
const IDIOMAS_DEL_MOTOR = ["es", "en"];

function idiomaDelDocumento() {
  return IDIOMAS_DEL_MOTOR.indexOf(estado.idioma) === -1 ? "en" : estado.idioma;
}

function bil(x) {
  if (!x || typeof x !== "object") return "";
  const v = x[idiomaDelDocumento()];
  return typeof v === "string" ? v : "";
}

/* --- el transporte ------------------------------------------------------- */

async function pedir(metodo, camino, cuerpo) {
  const url = estado.servidor.replace(/\/+$/, "") + camino;
  const r = await fetch(url, {
    method: metodo,
    headers: {
      "Authorization": "Bearer " + estado.credencial,
      "Accept-Language": idiomaDelDocumento(),
      ...(cuerpo ? { "Content-Type": "application/json" } : {}),
    },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  const texto = await r.text();
  let doc = null;
  try { doc = JSON.parse(texto); } catch (e) { doc = null; }
  return { estado: r.status, doc };
}

function perfilDelFormulario() {
  // VARIOS roles, no uno. Una organizacion es a la vez proveedor de un sistema
  // y responsable del despliegue de otro, y con un solo valor habia que elegir
  // cual declarar y perder las obligaciones del otro. El motor siempre acepto
  // un conjunto; era la pantalla la que obligaba a quedarse con uno.
  const p = { roles: [...$("#rol").selectedOptions].map((o) => o.value) };
  for (const k of ["alto_riesgo", "sector_publico", "modelo_uso_general", "riesgo_sistemico"]) {
    p[k] = $("#" + k).value;
  }
  p.via_anexo = $("#via_anexo").value;
  p.fecha = $("#fecha").value;
  return p;
}

const RUTAS = {
  plan: (c) => ["POST", `/v1/clientes/${c}/plan`, perfilDelFormulario()],
  vig:  (c) => ["POST", `/v1/clientes/${c}/vigilar`, perfilDelFormulario()],
  venc: (c) => ["GET", `/v1/clientes/${c}/vencimientos`, null],
  nc:   (c) => ["GET", `/v1/clientes/${c}/noconformidades`, null],
  // Las cinco vistas que faltaban. No son pantallas nuevas que inventen nada:
  // son verbos que el motor ya tenia y que la API no traducia, asi que el panel
  // no podia ensenarlos. Una auditoria externa lo leyo como «no hay explorador
  // de evidencia, no hay vista de procedencia, no hay tablero», y la causa
  // estaba una capa mas abajo de donde se veia.
  ev:   (c) => ["GET", `/v1/clientes/${c}/almacen`, null],
  preg: (c) => ["POST", `/v1/clientes/${c}/preguntar`, perfilDelFormulario()],
  soa:  (c) => ["POST", `/v1/clientes/${c}/soa`, perfilDelFormulario()],
  anx:  (c) => ["POST", `/v1/clientes/${c}/anexo?cual=iv`, perfilDelFormulario()],
  rev:  (c) => ["GET", `/v1/clientes/${c}/revision`, null],
  // La aplicabilidad es la PRIMERA pregunta del producto -- que te ata y que
  // no -- y era la unica de las grandes que no tenia pantalla. Sin ella habia
  // que lanzar un `plan`, que arranca el motor sobre el repositorio entero,
  // para contestar algo que sale del perfil y no lee ni un byte del codigo.
  apl:  (c) => ["POST", `/v1/clientes/${c}/aplicabilidad`, perfilDelFormulario()],
  // Y el control del articulo 50 a solas. Estaba dentro del `plan`, mezclado
  // con todo lo demas: quien queria la respuesta de UN control sobre su codigo
  // tenia que pedir el ciclo entero y buscarla.
  //
  // SIN perfil: este verbo no pregunta a quien ata nada, lee el codigo y dice
  // lo que ve.
  comp: (c) => ["POST", `/v1/clientes/${c}/comprobar`, null],
};

async function traer(verbo) {
  const [metodo, camino, cuerpo] = RUTAS[verbo](estado.cliente);
  // El boton se llama igual que la vista. Habia un mapa que traducia cada
  // nombre al suyo y era la identidad: cuatro entradas que decian `plan: plan`.
  // Con las vistas nuevas habria hecho falta acordarse de anadir cinco mas, y
  // el dia que alguien no lo hiciera el boton no se desactivaria mientras corre
  // -- que es lo unico que ese mapa hacia.
  const boton = $("#pedir-" + verbo);
  if (boton) boton.disabled = true;
  try {
    const r = await pedir(metodo, camino, cuerpo);
    if (r.estado === 401) { fallo(T().credencial_mala); return; }
    if (!r.doc || typeof r.doc !== "object") { fallo(T().error_motor); return; }
    if (r.doc.documento === undefined) { fallo(bil(r.doc.que) || T().error_motor); return; }
    estado.documentos[verbo] = r.doc;
    estado.vista = verbo;
    fallo("");
  } catch (e) {
    fallo(T().no_llega);
  } finally {
    if (boton) boton.disabled = !estado.conectado;
    pintar();
  }
}

/* Que poner cuando no hay nada que ensenar.
 *
 * Decia siempre «conecta un servidor y pide el plan», tambien despues de
 * conectar. Una pantalla que te manda hacer lo que acabas de hacer te dice que
 * no se ha enterado, y lo primero que piensa quien la usa es que no funciona.
 */
function vacio() {
  return estado.conectado ? T().sin_datos_conectado : T().sin_datos;
}

function fallo(texto) {
  const n = $("#conexion-mal");
  n.textContent = texto || "";
  n.classList.toggle("oculto", !texto);
}

/* --- conexion ------------------------------------------------------------ */

async function conectar() {
  estado.servidor = $("#servidor").value.trim();
  estado.cliente = $("#cliente").value.trim();
  estado.credencial = $("#credencial").value;
  $("#conectar").disabled = true;
  $("#conectar").textContent = T().probando;
  try {
    const r = await pedir("GET", "/salud", null);
    if (!r.doc || r.doc.vivo !== true) { fallo(T().no_llega); return; }
    // La salud no pide credencial, asi que no demuestra que la credencial
    // valga. Se prueba con una ruta que SI la pide: decir «conectado» porque
    // el servidor respira seria prometer algo que no se ha comprobado.
    const p = await pedir("GET", `/v1/clientes/${estado.cliente}/noconformidades`, null);
    if (p.estado === 401) { fallo(T().credencial_mala); return; }
    estado.conectado = true;
    estado.documentos.nc = p.doc && p.doc.documento !== undefined ? p.doc : undefined;
    fallo("");
  } catch (e) {
    fallo(T().no_llega);
  } finally {
    $("#conectar").disabled = false;
    pintar();
  }
}

function desconectar() {
  estado.conectado = false;
  estado.credencial = "";
  estado.documentos = {};
  $("#credencial").value = "";
  pintar();
}

/* --- pintar -------------------------------------------------------------- */

const CLASE_SITUACION = {
  ata: "ata", con_hallazgos: "mal", comprobada: "ata", futura: "futura",
  no_ata: "", a_preguntar: "indet", indeterminada: "indet", sin_resolver: "indet",
  solo_formulario: "", abierta: "indet", en_analisis: "indet", con_accion: "indet",
  ejecutada: "futura", verificada: "ata", vencidas: "mal", estancadas: "mal",
  incoherentes: "mal",
};

function pintarTextos() {
  const t = T();
  document.documentElement.lang = estado.idioma;
  // El aviso de que el documento no viene en el idioma de la pantalla.
  const aviso = $("#idioma-doc");
  if (aviso) {
    const distinto = idiomaDelDocumento() !== estado.idioma;
    aviso.textContent = distinto ? T().doc_en_otro_idioma : "";
    aviso.classList.toggle("oculto", !distinto);
  }
  // LA NOTA DEL SERVIDOR SE REPINTA COMO TODO LO DEMAS.
  //
  // Se escribia UNA sola vez, al arrancar, asi que quien cambiaba de idioma se
  // quedaba con ese parrafo en castellano dentro de una pantalla en aleman. Se
  // ve a simple vista y llevaba ahi desde que la pagina tiene dos idiomas: lo
  // que no lo cazaba era que ninguna prueba cambia el idioma y vuelve a mirar.
  const servido = location.protocol === "http:" || location.protocol === "https:";
  $("#servidor-nota").textContent = servido ? T().servidor_fijado : T().servidor_libre;
  document.title = t.titulo;
  const mapa = {
    "#eyebrow": "eyebrow", "#titular": "titular", "#entradilla": "entradilla",
    "#sin-porcentaje": "sin_porcentaje", "#t-categoria": "categoria",
    "#t-ciclo": "estado_del_ciclo", "#t-conexion": "conexion", "#t-servidor": "servidor",
    "#t-cliente": "cliente", "#t-credencial": "credencial",
    "#credencial-nota": "credencial_nota", "#conectar": "conectar",
    "#desconectar": "desconectar", "#t-perfil": "perfil", "#t-roles": "roles",
    "#origen-nota": "origen_nota",
    "#t-roles-ayuda": "roles_ayuda",
    "#t-alto": "alto_riesgo", "#t-via": "via", "#t-sector": "sector",
    "#t-general": "uso_general", "#t-sistemico": "sistemico", "#t-fecha": "fecha",
    "#pedir-plan": "pedir_plan", "#pedir-vig": "pedir_vigilancia",
    "#pedir-venc": "pedir_venc", "#pedir-nc": "pedir_nc",
    "#pedir-ev": "pedir_ev", "#pedir-preg": "pedir_preg",
    "#pedir-soa": "pedir_soa", "#pedir-anx": "pedir_anx",
    "#pedir-rev": "pedir_rev", "#pedir-apl": "pedir_apl",
    "#pedir-comp": "pedir_comp",
    "#t-vistas": "vistas", "#t-buscar": "buscar",
    "#t-recuento": "recuento", "#t-lineas": "lineas", "#t-documento": "documento",
    "#doc-nota": "doc_nota",
  };
  for (const [sel, clave] of Object.entries(mapa)) {
    const n = $(sel);
    if (n) n.textContent = t[clave];
  }
  $("#enchufe-txt").textContent = estado.conectado ? t.conectado : t.sin_conexion;
  $("#punto").classList.toggle("vivo", estado.conectado);
  $$("#tema button")[0].title = t.tema_claro;
  $$("#tema button")[1].title = t.tema_oscuro;
  // Los roles son valores del motor y sus nombres son de la pantalla: quien
  // elige "deployer" en ingles manda el identificador que el motor entiende.
  // Traducir el valor lo habria roto; no traducir la etiqueta habria dejado
  // media pantalla en castellano. Las dos cosas salen ahora del MISMO sitio.
  const rol = $("#rol");
  const antesRol = [...rol.selectedOptions].map((o) => o.value);
  vaciar(rol);
  for (const r of ROLES.roles) {
    // El vocabulario de roles sale del MOTOR y existe en `es` y `en`, como
    // todo el contenido normativo. Caia a `es` cuando faltaba el idioma, asi
    // que un aleman veia la interfaz en aleman y los roles en castellano.
    // Cae al mismo idioma al que cae el documento, que es la unica caida que
    // esta pantalla explica.
    const o = el("option", null, r.nombre[idiomaDelDocumento()] || r.nombre.en);
    o.value = r.id;
    o.title = r.definicion[idiomaDelDocumento()] || r.definicion.en;
    rol.appendChild(o);
  }
  const elegidos = antesRol.length ? antesRol : ["proveedor"];
  for (const o of rol.options) o.selected = elegidos.includes(o.value);
  for (const s of $$("select[data-tri]")) {
    const antes = s.value;
    vaciar(s);
    for (const [v, k] of [["", "nulo"], ["si", "si"], ["no", "no"]]) {
      const o = el("option", null, t[k]);
      o.value = v;
      s.appendChild(o);
    }
    s.value = antes;
  }
}

function pintarCategorias() {
  const t = T(), caja = vaciar($("#cats"));
  let i = 1;
  for (const clave of ["dev", "pyme", "empresa"]) {
    const b = el("button", "cat");
    // El nombre de la categoria, en el DOM. Los botones de idioma y de tema lo
    // llevan (`data-l`, `data-t`) y estos no, asi que la unica forma de pulsar
    // una categoria desde fuera era contar posiciones -- y una prueba que
    // cuenta posiciones se rompe el dia que se reordenan, que es el dia en que
    // deja de mirar.
    b.dataset.c = clave;
    b.setAttribute("aria-pressed", String(estado.categoria === clave));
    b.appendChild(el("p", "n", "0" + i++));
    b.appendChild(el("h3", null, t["cat_" + clave]));
    b.appendChild(el("p", null, t["cat_" + clave + "_pie"]));
    b.onclick = () => { estado.categoria = clave; pintar(); };
    caja.appendChild(b);
  }
}

/* El ciclo lee de los documentos que HAY. Un paso sin documento dice que no se
 * ha pedido, y no un cero: un cero es una afirmacion sobre el mundo y «no lo he
 * mirado» no lo es. Es la misma distincion que el motor hace entre
 * NO_APLICABLE e INDETERMINADA, y fundirla aqui la desharia en la pantalla,
 * que es donde la gente la lee. */
const PASOS = {
  p1: () => sacar("plan", (d) => sumaDe(d.recuento, ["comprobada", "con_hallazgos",
        "a_preguntar", "solo_formulario", "sin_resolver"])),
  p2: () => sacar("plan", (d) => valor(d.recuento, "con_hallazgos")),
  p3: () => sacar("plan", (d) => d.total_preguntas),
  p4: () => sacar("venc", (d) => (d.a_reobservar || []).length),
  p5: () => sacar("nc", (d) => (d.no_conformidades || []).filter((n) => n.estado !== "verificada").length),
};

function valor(o, k) { return o && typeof o[k] === "number" ? o[k] : null; }

/* La UNICA aritmetica de este fichero, y es un recuento de los recuentos que
 * el documento ya trae, no una proporcion. Se escribe aqui, con nombre, para
 * que se vea: si algun dia aparece una division en este fichero, sera facil
 * encontrarla. */
function sumaDe(recuento, claves) {
  if (!recuento) return null;
  let n = 0, hubo = false;
  for (const k of claves) {
    if (typeof recuento[k] === "number") { n += recuento[k]; hubo = true; }
  }
  return hubo ? n : null;
}

function sacar(verbo, fn) {
  const r = estado.documentos[verbo];
  if (!r || !r.documento) return null;
  try { return fn(r.documento); } catch (e) { return null; }
}

function pintarCiclo() {
  const t = T(), caja = vaciar($("#ciclo"));
  let i = 1;
  for (const clave of CATEGORIAS[estado.categoria].pasos) {
    const paso = el("div", "paso");
    paso.appendChild(el("p", "n", "0" + i++));
    paso.appendChild(el("p", "t", t[clave]));
    const v = PASOS[clave]();
    paso.appendChild(v === null || v === undefined
      ? el("p", "v gris", t.sin_recuento)
      : el("p", "v", v));
    caja.appendChild(paso);
  }
}

function pintarBotones() {
  const permitidos = new Set(CATEGORIAS[estado.categoria].verbos);
  // UNA LINEA POR VISTA DE `RUTAS`, NO UNA LISTA ESCRITA A MANO.
  //
  // Aqui habia cuatro pares escritos a mano -- plan, vig, venc y nc -- y
  // `RUTAS` tiene once. Los otros SIETE botones no los tocaba nadie, asi que
  // se quedaban con el `disabled` del HTML PARA SIEMPRE, en cualquier
  // categoria. Existian, se veian si la categoria los dejaba ver, y no se
  // podian pulsar nunca.
  //
  // La leccion ya estaba aprendida VEINTE LINEAS MAS ABAJO, donde los clics se
  // enganchan recorriendo `Object.keys(RUTAS)` con este comentario: «Eran
  // cuatro lineas identicas; con nueve vistas, la novena es la que alguien
  // olvida y el boton no hace nada sin que falle nada». Se arreglo ahi y se
  // dejo intacto aqui, que es como una leccion se queda a medias.
  for (const verbo of Object.keys(RUTAS)) {
    const b = $("#pedir-" + verbo);
    if (!b) continue;
    b.classList.toggle("oculto", !permitidos.has(verbo));
    b.disabled = !estado.conectado;
  }
  $("#desconectar").classList.toggle("oculto", !estado.conectado);
  $("#conectar").textContent = T().conectar;
}

function pintarRecuento() {
  const caja = vaciar($("#recuento"));
  const r = estado.documentos[estado.vista];
  const sello = $("#sello");
  if (!r || !r.documento) {
    sello.textContent = "";
    caja.appendChild(el("p", "vacio", vacio()));
    return;
  }
  const t = T();
  sello.textContent = `${r.documento.esquema} · ${t.codigo} ${r.codigo}` +
    (t["codigo_" + r.codigo] ? ` — ${t["codigo_" + r.codigo]}` : "");
  const rec = r.documento.recuento || {};
  for (const [clave, n] of Object.entries(rec)) {
    if (typeof n !== "number") continue;
    const p = el("span", "pastilla " + (CLASE_SITUACION[clave] || ""));
    p.appendChild(el("b", null, n));
    p.appendChild(el("span", null, nombreDe(clave)));
    caja.appendChild(p);
  }
  if (r.documento.nota_de_recuento) {
    caja.appendChild(el("p", "sub", bil(r.documento.nota_de_recuento)));
  }
  if (r.documento.nota_del_cierre) {
    caja.appendChild(el("p", "sub", bil(r.documento.nota_del_cierre)));
  }
  // La nota del cierre la escribe el motor; esta la escribe la pagina y dice
  // lo mismo, porque es la frase que alguien va a buscar en la pantalla
  // cuando vea un ticket cerrado y la no conformidad abierta.
  if (estado.vista === "nc") caja.appendChild(el("p", "sub", t.ejecutada_no_es_cerrada));
  if (estado.vista === "venc" && !(r.documento.a_reobservar || []).length) {
    caja.appendChild(el("p", "sub", t.nada_que_avisar));
  }
}

const FILTROS = ["todas", "hallazgos", "preguntas"];

function pintarFiltro() {
  const t = T(), caja = vaciar($("#filtro"));
  for (const f of FILTROS) {
    const b = el("button", null, t[f]);
    b.setAttribute("aria-pressed", String(estado.filtro === f));
    b.onclick = () => { estado.filtro = f; pintar(); };
    caja.appendChild(b);
  }
}

/* De un documento del motor a las filas de la pantalla.
 *
 * ESTO CONOCIA TRES FORMAS Y EL PANEL PIDE ONCE DOCUMENTOS.
 *
 * Las ocho restantes caian aqui, devolvian cero filas, y lo unico que veia
 * quien las pedia era el volcado de JSON de abajo. El cuestionario son
 * NOVENTA preguntas y salia como cuatrocientos kilobytes de JSON; la
 * declaracion de aplicabilidad, treinta y ocho controles; el Anexo IV,
 * veintitres secciones. Es decir: justo lo que la portada vende, servido
 * crudo.
 *
 * El volcado se queda -- es honesto y dice «si algo de la pantalla no esta
 * aqui dentro, es un defecto de esta pagina» -- pero deja de ser lo unico.
 *
 * Cada adaptador traduce a la MISMA fila que ya usa el plan: clave, titulo,
 * marca y motivo. No inventa ningun dato: si un campo no viene, la fila lo
 * deja vacio en vez de rellenarlo. */
function lineasDe(doc) {
  // GANA LA PRIMERA LISTA CON ALGO DENTRO, NO LA PRIMERA QUE EXISTA.
  //
  // `Array.isArray([])` es cierto, asi que una lista VACIA que aparezca antes
  // en esta cadena tapaba a una llena que viniera despues. Paso de verdad: el
  // documento de la revision por la direccion trae `no_conformidades` vacio y
  // `entradas` con diez, y la pantalla salia con «ninguna linea encaja con
  // este filtro» teniendo diez cosas que ensenar.
  //
  // El orden se queda como desempate para cuando TODAS estan vacias: asi un
  // documento sin datos sigue diciendo que forma tiene.
  const formas = [
    [doc.lineas, deLineaDePlan],
    [doc.no_conformidades, deNoConformidad],
    [doc.veredictos, deVeredicto],
    [doc.preguntas, dePregunta],
    [doc.controles, deControlIso],
    [doc.secciones, deSeccionDeAnexo],
    [doc.entradas, deEntradaDeRevision],
  ];
  for (const [lista, comoFila] of formas) {
    if (Array.isArray(lista) && lista.length) return lista.map(comoFila);
  }
  if (Array.isArray(doc.inspeccionado) && doc.inspeccionado.length) return lineasDeControl(doc);
  // EL ALMACEN NO ES UNA LISTA, Y POR ESO NO SE PINTABA NUNCA.
  //
  // Las diez vistas de arriba traen una lista de algo. El almacen de evidencia
  // trae un ESTADO: existe o no, la cadena cuadra o no, cual es la cabeza, y
  // cuantas lineas no se puede demostrar que esten intactas. No hay ninguna
  // lista que recorrer, asi que la cadena de formas acababa aqui devolviendo
  // cero filas y la pantalla decia «conecta y pide el plan» encima de un
  // volcado de JSON.
  //
  // Y es la vista que sostiene la UNICA afirmacion que este producto hace
  // frente a un tercero: que la evidencia es la que esta casa escribio. La
  // pasada anterior arreglo ocho formas de once y dio las once por buenas
  // porque las ocho tenian lista; esta, que no la tiene, se quedo fuera sin
  // que fallara nada. La cazo el navegador el primer dia que corrio.
  if (doc.esquema === "actaira/almacen/v1") return lineasDeAlmacen(doc);
  return [];
}

function lineasDeAlmacen(doc) {
  const t = T(), filas = [];
  const fila = (clave, titulo, marca, etiqueta, motivo) => ({
    clave, titulo, marca, etiqueta, motivo: motivo || "", hallazgos: [], preguntas: [],
  });

  filas.push(fila(t.almacen_fichero, doc.ruta || "",
                  doc.existe ? "comprobada" : "sin_resolver",
                  doc.existe ? t.almacen_hay : t.almacen_no_hay,
                  doc.existe ? "" : t.almacen_no_existe));

  // Lo que sigue solo se afirma sobre un fichero que existe. Decir «la cadena
  // no verifica» de un almacen que no se ha escrito todavia seria una alarma
  // fabricada, que es el defecto contra el que va la tercera negativa.
  if (!doc.existe) return filas;

  filas.push(fila(t.almacen_cadena,
                  doc.verifica ? t.almacen_verifica : t.almacen_no_verifica,
                  doc.verifica ? "comprobada" : "con_hallazgos",
                  doc.verifica ? t.almacen_ok : t.almacen_rota,
                  (doc.roturas || []).join("  —  ")));

  // La nota de la cabeza la escribe el MOTOR, en los dos idiomas, y dice lo
  // que la cadena NO demuestra. Es la frase mas importante de esta pantalla y
  // no la escribe esta pagina.
  filas.push(fila(t.almacen_cabeza, doc.cabeza || t.almacen_sin_cabeza,
                  doc.cabeza ? "comprobada" : "sin_resolver", "",
                  bil(doc.nota_de_la_cabeza)));

  // `null` NO es `true`: nadie dijo que cabeza esperaba, asi que esa
  // comprobacion no se ha hecho. Pintarla como si cuadrara seria inventar una
  // comprobacion que no ocurrio.
  filas.push(fila(t.almacen_cabeza_esperada,
                  doc.cabeza_esperada || t.almacen_cabeza_no_comprobada,
                  doc.cabeza_es_la_esperada === true ? "comprobada"
                    : doc.cabeza_es_la_esperada === false ? "con_hallazgos" : "indeterminada",
                  doc.cabeza_es_la_esperada === true ? t.almacen_ok
                    : doc.cabeza_es_la_esperada === false ? t.almacen_rota : "",
                  doc.por_que_no_es_la_esperada || ""));

  filas.push(fila(String(doc.observaciones ?? 0), t.almacen_observaciones, "", "", ""));
  filas.push(fila(String(doc.sin_cadena_demostrable ?? 0), t.almacen_sin_cadena,
                  doc.sin_cadena_demostrable ? "indeterminada" : "",
                  "", t.almacen_sin_cadena_pie));
  return filas;
}

function dePregunta(p) {
  // `por_que` es la LISTA de obligaciones a las que sirve la pregunta. Es el
  // dato que hace que este cuestionario no sea otro cuestionario de
  // trescientas preguntas: cada una dice a que ata.
  const ata = (p.por_que || []).map((x) => x.id).filter(Boolean);
  return {
    clave: p.id || "",
    titulo: bil(p.texto) || p.id || "",
    marca: p.estado,
    hallazgos: [],
    preguntas: bil(p.ayuda) ? [{ texto: bil(p.ayuda) }] : [],
    motivo: [p.destinatario, ata.join(" · ")].filter(Boolean).join("  —  "),
  };
}

function deControlIso(c) {
  const e = c.estado_de_implantacion || {};
  return {
    clave: c.control_id || "",
    titulo: bil(c.titulo) || c.control_id || "",
    // `incluido` es un booleano, y la marca del resto de la pantalla es un
    // nombre. Se traduce aqui y no en la hoja de estilo.
    marca: c.incluido === false ? "no_ata" : (e.estado || c.procedencia),
    hallazgos: [],
    preguntas: [],
    motivo: bil(c.justificacion) || "",
  };
}

function deSeccionDeAnexo(s) {
  return {
    clave: s.punto ? s.punto : (s.id || ""),
    titulo: bil(s.titulo) || s.id || "",
    marca: s.procedencia,
    hallazgos: [],
    preguntas: [],
    // Si falta, el motivo de que falte. Es la tercera negativa de la casa
    // puesta en una fila: lo que no se pudo sacar dice por que.
    motivo: bil(s.motivo_ausencia) || (s.de_donde || []).join(", "),
  };
}

function deEntradaDeRevision(e) {
  return {
    clave: (e.clausulas || []).join(" ") || e.entrada || "",
    titulo: bil(e.texto) || e.entrada || "",
    marca: e.situacion,
    hallazgos: [],
    preguntas: [],
    motivo: (e.se_apoya_en || []).join(", "),
  };
}

function lineasDeControl(doc) {
  // El control del articulo 50 no trae una lista de obligaciones: trae lo que
  // MIRO. Enseñarlo es la procedencia, que es media promesa del producto.
  return (doc.inspeccionado || []).map((x) => ({
    clave: doc.control_id || "",
    titulo: String(x),
    marca: doc.resultado,
    hallazgos: [],
    preguntas: [],
    motivo: bil(doc.motivo_indeterminado) || "",
  }));
}

function deLineaDePlan(l) {
  return {
    clave: l.articulo ? "art. " + l.articulo : l.obligacion_id,
    titulo: bil(l.titulo) || l.obligacion_id,
    marca: l.estado,
    hallazgos: (l.hallazgos || []).map((h) => ({
      texto: bil(h.remediacion), donde: h.localizacion, regla: h.regla_id })),
    preguntas: (l.preguntas || []).map((p) => ({ texto: bil(p.texto) || bil(p) })),
    motivo: bil(l.motivo) || bil(l.por_que) || "",
  };
}

function deVeredicto(v) {
  return { clave: v.obligacion_id, titulo: v.regla || v.obligacion_id,
           marca: v.situacion, hallazgos: [], preguntas: [], motivo: "" };
}

function deNoConformidad(n) {
  const t = T(), avisos = [];
  if (n.vencida) avisos.push(t.nc_vencida);
  if (n.estancada) avisos.push(t.nc_estancada);
  if ((n.incoherencias || []).length) avisos.push(t.nc_incoherente);
  return {
    clave: n.id,
    titulo: n.descripcion,
    marca: n.estado,
    hallazgos: (n.incoherencias || []).map((x) => ({ texto: x })),
    preguntas: [],
    motivo: [n.origen, `${n.dias_abierta} ${t.dias}`, ...avisos].filter(Boolean).join(" · "),
  };
}

function filtrarPorTexto() {
  // Filtra lo YA PINTADO y no vuelve a pedir nada.
  //
  // Es deliberado: el documento que se esta mirando es el que emitio el motor,
  // y buscar dentro de el no puede cambiar lo que dice. Si el buscador pidiera
  // otra vez con un criterio, la pantalla estaria componiendo una pregunta que
  // el motor no hizo, y lo que se vería dejaría de ser el documento que hay.
  const q = ($("#buscar").value || "").trim().toLowerCase();
  // LAS FILAS, NO LOS HIJOS DE LA CAJA.
  //
  // Cuando no hay nada que ensenar, `pintarLineas` deja ahi dentro UN parrafo
  // que lo explica -- «este documento no trae ninguna linea», o «conecta un
  // servidor y pide el plan» --, y ese parrafo es un hijo de la caja. Contando
  // hijos, una vista vacia decia «1 linea.» justo debajo de la frase que dice
  // que no hay ninguna: dos afirmaciones contrarias en la misma pantalla, y la
  // falsa es la que lleva un numero. Pasa de verdad, y no en un caso raro: la
  // vista de no conformidades sale vacia el dia que no hay ninguna.
  //
  // Peor todavia era escribir en el buscador: el parrafo casaba o no casaba
  // como si fuera una fila, asi que se ESCONDIA la unica frase que explicaba
  // que hacer, y en su sitio quedaba «ninguna linea coincide con ...», que
  // ademas es mentira -- nunca hubo una linea que pudiera coincidir.
  const filas = $$("#lineas .linea");
  let visibles = 0;
  for (const fila of filas) {
    const casa = !q || (fila.textContent || "").toLowerCase().includes(q);
    fila.hidden = !casa;
    if (casa) visibles++;
  }
  const t = T();
  const cuenta = $("#buscar-cuenta");
  if (!filas.length) { cuenta.textContent = ""; return; }
  // Singular y plural. Decia «1 lineas» en un producto que tiene una puerta
  // para las tildes del castellano.
  const plantilla = !q ? (filas.length === 1 ? t.buscar_una : t.buscar_todas)
    : visibles ? t.buscar_algunas : t.buscar_nada;
  cuenta.textContent = plantilla
    .replace("{n}", String(visibles))
    .replace("{total}", String(filas.length))
    .replace("{q}", q);
}

function pintarLineas() {
  const t = T(), caja = vaciar($("#lineas"));
  const r = estado.documentos[estado.vista];
  if (!r || !r.documento) { caja.appendChild(el("p", "vacio", vacio())); return; }
  let lineas = lineasDe(r.documento);
  // «NINGUNA LINEA ENCAJA CON ESTE FILTRO» CON EL FILTRO EN «TODAS».
  //
  // Un documento que no trae nada y un filtro que lo esconde todo son dos
  // cosas distintas, y aqui se decian con la misma frase. El caso normal es el
  // de vencimientos un dia tranquilo: el recuento dice «nada que avisar hoy» y
  // justo debajo salia «ninguna linea encaja con este filtro» sin que nadie
  // hubiera tocado el filtro. Quien lo lee busca el filtro que no puso.
  const habia = lineas.length;
  if (estado.filtro === "hallazgos") lineas = lineas.filter((l) => l.hallazgos.length);
  if (estado.filtro === "preguntas") lineas = lineas.filter((l) => l.preguntas.length);
  if (!lineas.length) {
    caja.appendChild(el("p", "vacio", habia ? t.sin_lineas : t.sin_nada));
    return;
  }
  for (const l of lineas) {
    const fila = el("div", "linea");
    fila.appendChild(el("p", "art", l.clave));
    const medio = el("div");
    medio.appendChild(el("h3", null, l.titulo));
    if (l.motivo) medio.appendChild(el("p", "sub", l.motivo));
    for (const [cual, etiqueta] of [["hallazgos", t.remediacion], ["preguntas", t.preguntas]]) {
      if (!l[cual].length) continue;
      const d = el("details", "detalle");
      d.appendChild(el("summary", null, `${etiqueta} (${l[cual].length})`));
      const ul = el("ul");
      for (const x of l[cual]) {
        const li = el("li", null, x.texto);
        if (x.donde) li.appendChild(el("span", "mono", `  ${t.donde}: ${x.donde}`));
        if (x.regla) li.appendChild(el("span", "mono", `  ${t.regla}: ${x.regla}`));
        ul.appendChild(li);
      }
      d.appendChild(ul);
      medio.appendChild(d);
    }
    fila.appendChild(medio);
    // EL NOMBRE DEL ESTADO LO PUBLICA EL MOTOR, SALVO CUANDO NO HAY ESTADO.
    //
    // `nombreDe` lee `nombres_de_estado` del documento, que es lo correcto: el
    // vocabulario del producto es del motor. Pero hay un documento que no
    // publica estados porque no los tiene -- el del almacen, que trae
    // BOOLEANOS -- y ahi `nombreDe` caia al identificador en crudo, es decir a
    // una palabra castellana dentro de una pantalla en aleman.
    //
    // Cuando la fila trae `etiqueta`, la palabra es de la pantalla y viaja en
    // los seis idiomas. Eso no es traducir significado: es ponerle nombre a un
    // `true` que el motor no nombra.
    // Y si no hay nada que decir, no se pinta la insignia.
    //
    // Se pintaba SIEMPRE, asi que una fila sin estado -- las dos que son un
    // recuento a secas en la vista del almacen -- salia con una pastilla gris
    // vacia al final, que parece un estado que no se pudo leer. Enseñar un
    // hueco donde no hay dato es peor que no enseñar nada: invita a buscarle
    // un significado.
    const insignia = l.etiqueta || (l.marca ? nombreDe(l.marca) : "");
    if (insignia) {
      fila.appendChild(el("span", "marca " + (CLASE_SITUACION[l.marca] || ""), insignia));
    }
    caja.appendChild(fila);
  }
}

function pintarCrudo() {
  const r = estado.documentos[estado.vista];
  $("#crudo").textContent = r ? JSON.stringify(r, null, 2) : "";
  $("#pie-esquema").textContent =
    r && r.documento ? `${T().esquema}: ${r.documento.esquema}` : "";
}

function pintar() {
  pintarTextos();
  pintarCategorias();
  pintarCiclo();
  pintarBotones();
  pintarRecuento();
  pintarFiltro();
  pintarLineas();
  // El filtro se vuelve a aplicar despues de pintar: si no, cambiar de vista
  // con texto en el buscador ensena la lista entera y la cuenta dice otra cosa.
  filtrarPorTexto();
  pintarCrudo();
}

/* --- arranque ------------------------------------------------------------ */

function arrancar() {
  for (const b of $$("#idioma button")) {
    b.onclick = () => {
      estado.idioma = b.dataset.l;
      for (const o of $$("#idioma button")) o.setAttribute("aria-pressed", String(o === b));
      pintar();
    };
  }
  for (const b of $$("#tema button")) {
    b.onclick = () => {
      estado.tema = estado.tema === b.dataset.t ? "" : b.dataset.t;
      document.documentElement.dataset.tema = estado.tema;
      for (const o of $$("#tema button")) {
        o.setAttribute("aria-pressed", String(o.dataset.t === estado.tema));
      }
    };
  }
  $("#conectar").onclick = conectar;
  $("#desconectar").onclick = desconectar;
  $("#enchufe").onclick = () => $("#servidor").focus();
  // Un enganche por cada vista de `RUTAS`, y no una linea por vista escrita a
  // mano. Eran cuatro lineas identicas; con nueve vistas, la novena es la que
  // alguien olvida y el boton no hace nada sin que falle nada.
  for (const vista of Object.keys(RUTAS)) {
    const b = $("#pedir-" + vista);
    if (b) b.onclick = () => traer(vista);
  }
  $("#buscar").oninput = filtrarPorTexto;
  // El servidor se rellena con el ORIGEN DE ESTA PAGINA cuando la sirve uno.
  //
  // La politica de seguridad de contenido que manda el servidor lleva
  // `connect-src 'self'`, que es lo que impide que un script colado en la
  // pagina se mande el expediente del cliente a otro sitio. Es el control
  // correcto y se queda. Lo que estaba mal era la pantalla: ofrecia un campo
  // de texto libre para escribir cualquier servidor mientras el navegador solo
  // dejaba hablar con este, asi que escribir otro daba un error de red sin
  // explicacion y el usuario concluia que el producto no funciona.
  //
  // Abierta como fichero local no hay politica ninguna, y ahi el campo si vale
  // para cualquier servidor. Por eso se rellena solo cuando hay origen.
  if (location.protocol === "http:" || location.protocol === "https:") {
    if (!$("#servidor").value) $("#servidor").value = location.origin;
  }
  $("#fecha").value = new Date().toISOString().slice(0, 10);
  $("#alto_riesgo").value = "";
  pintar();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", arrancar);
} else {
  arrancar();
}

</script>
