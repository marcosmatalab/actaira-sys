[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "motor/src/actaira_motor/__init__.py"

[project]
name = "actaira-motor"
# La version vive en el paquete y aqui se lee de ahi. Habia dos numeros --
# 0.9.0 aqui y 0.1.0 en el modulo -- y la plantilla de integracion continua
# clavaba el del modulo, asi que un cliente que la copiara habria instalado una
# version que este fichero decia no ser la suya. Regla 10 aplicada al empaquetado.
dynamic = ["version"]
description = "El Reglamento (UE) 2024/1689 y la ISO/IEC 42001 comprobados leyendo tu repositorio, con procedencia por afirmación."
readme = "README.md"
# POR QUE 3.12 Y NO 3.11
#
# `actaira ortografia --arreglar` corrige tambien la prosa que vive DENTRO de
# las llaves de una f-string. Para eso hace falta que el tokenizador vea ahi
# dentro, y eso es PEP 701, que llego en Python 3.12: en 3.11 la f-string
# entera es un unico componente y el corrector pasa de largo sin decir nada.
#
# Esto lo encontro la matriz de integracion continua el primer dia que corrio,
# y no se podia ver antes porque aqui se desarrolla en 3.13. Declarar 3.11 era
# prometer un verbo que alli no hace su trabajo, y callarlo es peor que no
# tenerlo: el corrector no fallaba, devolvia el texto sin corregir.
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Marcos Mata García" }]
keywords = ["ai-act", "iso-42001", "compliance", "sarif", "governance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Natural Language :: Spanish",
  "Natural Language :: English",
]
dependencies = [
  "cryptography>=42",     # Ed25519 para el sello; sin red al verificar
]

[project.optional-dependencies]
# El marcado de imagenes del articulo 50 necesita Pillow. Se deja fuera del
# nucleo a proposito: la mayoria de los clientes no generan imagenes, y una
# dependencia binaria que no se usa es una superficie de ataque que no se usa.
marcado = ["pillow>=10"]

# Lo que hace falta para CORRER LA SUITE, y por eso existe.
#
# Un criterio de aceptacion de este producto es que todas sus pruebas salgan
# verdes desde una instalacion limpia. Eso no se podia cumplir: no habia
# ninguna forma declarada de instalar `pytest`, `jsonschema` ni `pillow`, asi
# que quien clonaba el arbol y corria la suite recogia MENOS pruebas de las que
# hay -- las que dependen de `jsonschema` se saltan solas -- y se llevaba un
# verde que no cubria lo que creia. Una suite que mide menos segun lo que
# tengas instalado es una suite que miente por omision.
#
#   pip install -e ".[dev]"
#
# `pillow` esta tambien aqui, y no solo en `marcado`, porque `consola/marca/
# incrustar.py` lo necesita para regenerar los logos. Construir las paginas NO
# lo necesita: ese es justo el punto del artefacto precalculado.
dev = [
  "pytest>=8",
  "jsonschema>=4",
  "pillow>=10",
  # `test_no_falta_ninguna_dependencia_de_desarrollo` exige `yaml` para leer la
  # plantilla de integracion continua como estructura y no como texto, y su
  # mensaje de fallo manda instalar precisamente `.[dev]` para conseguirlo. No
  # estaba aqui: la prueba salia verde solo si el interprete traia PyYAML por
  # otra via, que es el mismo defecto que este bloque documenta mas arriba.
  "pyyaml>=6",
  # `build` lo necesita la fase `paquete` para construir la rueda y probar que
  # instala en un entorno virgen. No estaba declarado, asi que esa fase se
  # OMITIA en cualquier maquina que no lo trajera puesto -- incluida la de
  # integracion continua, donde una omision significa que algo falta, no que
  # no se pueda medir. Es la tercera vez que este extra se queda corto: ver
  # D-93 con `pyyaml`. Ahora la lista es la que la puerta necesita ENTERA.
  "build>=1",
  # `playwright` lo necesita la fase `navegador`, que es la unica que EJECUTA
  # el JavaScript del panel. Cuarta vez que este extra se queda corto, y la
  # unica que se declara el mismo dia que la fase: la anterior -- `build` --
  # se omitio en silencio hasta que alguien miro el resumen.
  #
  # El modulo no trae el navegador: hace falta `python -m playwright install
  # chromium` una vez. Sin el, la fase se declara OMITIDA con ese motivo en vez
  # de fingir que midio algo.
  "playwright>=1.44",
]

[project.urls]
Homepage = "https://actaira.com"
Source = "https://github.com/marcosmatalab/actaira-sys"

[project.scripts]
actaira = "actaira_motor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["motor/src/actaira_motor"]

# El catalogo vive en la raiz del repositorio, que es donde lo revisa un
# jurista, y se copia DENTRO del paquete al construir la rueda. La alternativa
# -- duplicarlo bajo src/ -- daria dos copias del contenido normativo, que es
# la regla 10 aplicada a ficheros: dos copias no se suman, se anulan.
[tool.hatch.build.targets.wheel.force-include]
"catalogo" = "actaira_motor/_catalogo"

[tool.hatch.build.targets.sdist]
include = ["motor", "catalogo", "consola", "docs", "integraciones", "ejemplos",
           "Makefile", "README.md", "LICENSE", "NOTICE"]
