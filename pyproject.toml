[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "motor/src/actaira_motor/__init__.py"

[project]
name = "actaira-motor"
# La version vive en el paquete y aqui se lee de ahi. Habia dos numeros --
# 0.9.0 aqui y 0.1.0 en el modulo -- y la plantilla de integracion continua
# clavaba el del modulo, asi que un cliente que la copiara habria instalado una
# version que este fichero decia no ser la suya. Regla 10 aplicada al empaquetado.
dynamic = ["version"]
description = "El Reglamento (UE) 2024/1689 y la ISO/IEC 42001 comprobados leyendo tu repositorio, con procedencia por afirmación."
readme = "README.md"
# POR QUE 3.12 Y NO 3.11
#
# `actaira ortografia --arreglar` corrige tambien la prosa que vive DENTRO de
# las llaves de una f-string. Para eso hace falta que el tokenizador vea ahi
# dentro, y eso es PEP 701, que llego en Python 3.12: en 3.11 la f-string
# entera es un unico componente y el corrector pasa de largo sin decir nada.
#
# Esto lo encontro la matriz de integracion continua el primer dia que corrio,
# y no se podia ver antes porque aqui se desarrolla en 3.13. Declarar 3.11 era
# prometer un verbo que alli no hace su trabajo, y callarlo es peor que no
# tenerlo: el corrector no fallaba, devolvia el texto sin corregir.
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Marcos Mata García" }]
keywords = ["ai-act", "iso-42001", "compliance", "sarif", "governance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Natural Language :: Spanish",
  "Natural Language :: English",
]
dependencies = [
  "cryptography>=42",     # Ed25519 para el sello; sin red al verificar
]

[project.optional-dependencies]
# El marcado de imagenes del articulo 50 necesita Pillow. Se deja fuera del
# nucleo a proposito: la mayoria de los clientes no generan imagenes, y una
# dependencia binaria que no se usa es una superficie de ataque que no se usa.
marcado = ["pillow>=10"]

# Lo que hace falta para CORRER LA SUITE, y por eso existe.
#
# Un criterio de aceptacion de este producto es que todas sus pruebas salgan
# verdes desde una instalacion limpia. Eso no se podia cumplir: no habia
# ninguna forma declarada de instalar `pytest`, `jsonschema` ni `pillow`, asi
# que quien clonaba el arbol y corria la suite recogia MENOS pruebas de las que
# hay -- las que dependen de `jsonschema` se saltan solas -- y se llevaba un
# verde que no cubria lo que creia. Una suite que mide menos segun lo que
# tengas instalado es una suite que miente por omision.
#
#   pip install -e ".[dev]"
#
# `pillow` esta tambien aqui, y no solo en `marcado`, porque `consola/marca/
# incrustar.py` lo necesita para regenerar los logos. Construir las paginas NO
# lo necesita: ese es justo el punto del artefacto precalculado.
dev = [
  "pytest>=8",
  "jsonschema>=4",
  "pillow>=10",
  # `test_no_falta_ninguna_dependencia_de_desarrollo` exige `yaml` para leer la
  # plantilla de integracion continua como estructura y no como texto, y su
  # mensaje de fallo manda instalar precisamente `.[dev]` para conseguirlo. No
  # estaba aqui: la prueba salia verde solo si el interprete traia PyYAML por
  # otra via, que es el mismo defecto que este bloque documenta mas arriba.
  "pyyaml>=6",
  # `build` lo necesita la fase `paquete` para construir la rueda y probar que
  # instala en un entorno virgen. No estaba declarado, asi que esa fase se
  # OMITIA en cualquier maquina que no lo trajera puesto -- incluida la de
  # integracion continua, donde una omision significa que algo falta, no que
  # no se pueda medir. Es la tercera vez que este extra se queda corto: ver
  # D-93 con `pyyaml`. Ahora la lista es la que la puerta necesita ENTERA.
  "build>=1",
  # `playwright` lo necesita la fase `navegador`, que es la unica que EJECUTA
  # el JavaScript del panel. Cuarta vez que este extra se queda corto, y la
  # unica que se declara el mismo dia que la fase: la anterior -- `build` --
  # se omitio en silencio hasta que alguien miro el resumen.
  #
  # El modulo no trae el navegador: hace falta `python -m playwright install
  # chromium` una vez. Sin el, la fase se declara OMITIDA con ese motivo en vez
  # de fingir que midio algo.
  "playwright>=1.44",
  # `ruff` y `mypy` los necesita la fase `lint`. Van aqui y no fuera por lo
  # mismo que `pyyaml`, `build` y `playwright`: una fase que se OMITE porque
  # falta lo que necesita es una fase que no mide, y en integracion continua
  # -- donde se corre con `--sin-omitir` -- una omision es un rojo.
  "ruff>=0.15",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://actaira.com"
Source = "https://github.com/marcosmatalab/actaira-sys"

[project.scripts]
actaira = "actaira_motor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["motor/src/actaira_motor"]

# El catalogo vive en la raiz del repositorio, que es donde lo revisa un
# jurista, y se copia DENTRO del paquete al construir la rueda. La alternativa
# -- duplicarlo bajo src/ -- daria dos copias del contenido normativo, que es
# la regla 10 aplicada a ficheros: dos copias no se suman, se anulan.
[tool.hatch.build.targets.wheel.force-include]
"catalogo" = "actaira_motor/_catalogo"

[tool.hatch.build.targets.sdist]
include = ["motor", "catalogo", "consola", "docs", "integraciones", "ejemplos",
           "Makefile", "README.md", "LICENSE", "NOTICE"]

# --- ruff -------------------------------------------------------------------
#
# POR QUE ESTO NO ESTABA, Y POR QUE ESTAR SIN CONFIGURAR ERA PEOR QUE NO ESTAR
# ------------------------------------------------------------------------------
# No habia ninguna declaracion de que reglas cumple este arbol. Lanzar `ruff` a
# secas daba 187 quejas, de las que el 95 % eran de ESTILO -- variables de una
# letra, dos sentencias en la misma linea, imports que no van arriba del todo --
# y en este arbol son deliberadas. Una lista de 187 cosas que nadie va a mirar
# es lo mismo que ninguna lista, con el agravante de que parece que hay control.
#
# Lo que se elige medir es lo que CAZA DEFECTOS, y nada mas:
#
#   F    pyflakes: un nombre que no existe, un import muerto, una variable que
#        se calcula y se tira, una redefinicion que tapa a la de arriba. Es la
#        familia que encuentra codigo que no hace lo que parece.
#   E9   lo que ni siquiera se puede analizar.
#   E71  comparaciones con `None`, `True` y `False` escritas con `==`, que en
#        una casa donde «no se sabe» y «es falso» son estados distintos no es
#        un detalle de estilo.
#   E722 `except:` a secas, que se traga hasta un Ctrl-C. Hoy no hay ninguno y
#        esto es para que siga siendo verdad.
#   B    bugbear: el `except` que pierde la causa, el argumento por omision
#        mutable, la clausura que captura la variable del bucle.
#
# LO QUE NO SE MIDE, dicho aqui para que nadie lo tome por un olvido: la
# longitud de linea. Este arbol tiene 204 lineas de mas de 99 caracteres, casi
# todas datos del catalogo o mensajes bilingues que parten peor de lo que leen.
# Declararla obligaria a reformatear el arbol entero para no arreglar nada.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "E71", "E722", "B"]

# B905: `zip()` sin `strict=`. La regla existe para cazar el `zip` que descarta
# lo que sobra en silencio, y es buena -- pero las cuatro apariciones de este
# arbol son el par consecutivo `zip(xs, xs[1:])` y las claves y valores de un
# `ast.Dict`, donde las longitudes NO son iguales a proposito o lo son por
# construccion. Ponerles `strict=True` seria falso en las primeras y ruido en
# las segundas.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Los repositorios de EJEMPLO estan escritos rotos a proposito: son la entrada
# del motor, no codigo de este producto. `asistente.py` llama a dos funciones
# que no existen porque eso es lo que el control tiene que ver. Se les exime de
# las reglas de nombres, no de `E9`: un fixture que no se puede analizar no
# sirve para probar nada.
"motor/tests/fixtures/**" = ["F", "B"]

# --- mypy -------------------------------------------------------------------
#
# Se declara para que haya UNA forma de correrlo, que es lo que faltaba: sin
# esto, dos personas lo lanzaban con dos configuraciones y obtenian dos
# respuestas.
#
# NO esta en modo estricto, y no se finge que lo este. Quedan errores conocidos
# -- listados uno a uno en `herramientas/mypy-conocidos.txt` -- que son casi
# todos «mypy no sabe estrechar este tipo aqui» y no fallos de ejecucion. La
# fase `lint` compara contra esa lista y se pone roja EN LOS DOS SENTIDOS: si
# aparece uno nuevo lo nombra, y si se arregla uno viejo tambien, para que la
# lista no se quede mintiendo por arriba.
[tool.mypy]
python_version = "3.12"
files = ["motor/src"]
ignore_missing_imports = true

# LA PLATAFORMA SE FIJA, Y LA MATRIZ ENSENO POR QUE.
#
# La lista de conocidos se genero en Windows y en Linux no cuadraba: cuatro
# errores que no estaban y dos de la lista que alli no ocurren. No era deriva ni
# descuido. `vigilancia/almacen.py` toma el candado con `fcntl` en POSIX y con
# `msvcrt` en Windows, dentro de un `try/except ImportError`, asi que el modulo
# que mypy NO puede resolver es distinto en cada sistema, y con el cambian los
# tipos que deduce.
#
# Con la lista atada al sistema donde se genero, la puerta saldria roja en el
# otro con el producto intacto -- y una puerta que se pone roja donde no hay
# nada que arreglar ensena a apagarla. La alternativa, dos listas, serian dos
# definiciones de la misma propiedad, que es la regla 10: acabarian diciendo
# cosas distintas.
#
# LO QUE ESTO CUESTA, dicho y no escondido: las ramas de Windows se comprueban
# contra los tipos de POSIX. Es el mismo precio que paga cualquier analisis
# estatico de codigo que se bifurca por sistema, y se elige a sabiendas: quien
# de verdad comprueba esas ramas es la matriz, que CORRE la suite en los dos.
platform = "linux"
