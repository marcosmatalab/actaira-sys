*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

header{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap}
.logo{background-image:var(--logo);background-size:contain;background-repeat:no-repeat;background-position:left center;width:168px;height:35px;flex:none}
.controles{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--marca-vivo);color:#fff}
.seg button:focus-visible{outline:2px solid var(--marca-vivo);outline-offset:-2px}

.hero{padding-block:34px 26px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(22px,3.4vw,31px);font-weight:600;letter-spacing:-.015em;max-width:24ch;line-height:1.15}
.hero p{margin-top:12px;color:var(--ink-soft);max-width:70ch;font-size:15px}

.ciclo{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--surface-2)}
.paso{flex:1 0 auto;min-width:112px;padding:11px 13px;border-right:1px solid var(--line);position:relative}
.paso:last-child{border-right:0}
.paso .n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.paso .t{font-size:12.5px;font-weight:500;margin-top:2px}
.paso[data-estado="hecho"]{background:var(--ata-fondo)}
.paso[data-estado="hecho"] .t{color:var(--ata)}
.paso[data-estado="ahora"]{background:var(--surface);box-shadow:inset 0 -3px 0 var(--marca-vivo)}

main{padding-block:26px 60px}
.panel{display:grid;gap:22px;align-items:start}
@media(min-width:900px){.panel{grid-template-columns:330px 1fr}}

.tarjeta{background:var(--surface);border:1px solid var(--line)}
.tarjeta>h2{font-size:13px;font-weight:600;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.tarjeta>h2 span{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400}
.cuerpo{padding:16px}

.campo{margin-bottom:17px}
.campo:last-child{margin-bottom:0}
.campo .pregunta{font-size:13.5px;margin-bottom:7px;display:block;color:var(--ink)}
.tri{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.tri button{flex:1;background:transparent;border:0;padding:7px 4px;font-size:12px;cursor:pointer;color:var(--ink-soft);border-right:1px solid var(--line)}
.tri button:last-child{border-right:0}
.tri button[aria-pressed="true"]{background:var(--marca-profundo);color:#fff}
.tri button[data-v="null"][aria-pressed="true"]{background:var(--indet);color:#fff}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.rol{border:1px solid var(--line);background:transparent;padding:6px 10px;font-size:12px;cursor:pointer;border-radius:2px;color:var(--ink-soft)}
.rol[aria-pressed="true"]{background:var(--marca-vivo);color:#fff;border-color:var(--marca-vivo)}

.recuento{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:20px}
@media(min-width:620px){
  /* auto-fit y no `repeat(4,1fr)`: la vista de la declaracion de aplicabilidad
     emite tres cifras y la cuarta columna salia como un hueco gris. Una rejilla
     que cuenta a sus hijos no se rompe cuando cambia lo que se cuenta. */
  .recuento{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}
.cifra{background:var(--surface);padding:13px 15px}
.cifra b{display:block;font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.cifra span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cifra[data-s="ata"] b{color:var(--ata)}
.cifra[data-s="futura"] b{color:var(--futura)}
.cifra[data-s="indeterminada"] b{color:var(--indet)}
.cifra[data-s="no_ata"] b{color:var(--noata)}

.aviso{border:1px solid var(--indet);background:var(--indet-fondo);padding:14px 16px;margin-bottom:20px}
.aviso h3{font-size:13.5px;font-weight:600;color:var(--indet);margin-bottom:6px}
.aviso p{font-size:13px;color:var(--ink-soft)}
.aviso ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-soft)}

.lista{border:1px solid var(--line);background:var(--surface)}
.fila{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line-soft);align-items:start;cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.fila:last-child{border-bottom:0}
.fila:hover{background:var(--surface-2)}
.fila:focus-visible{outline:2px solid var(--marca-vivo);outline-offset:-2px}
.fila .art{font-family:var(--mono);font-size:12px;color:var(--ink-soft);padding-top:1px}
.fila .tit{font-size:13.5px}
.fila .meta{font-size:11.5px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;white-space:nowrap;border:1px solid}
.pill[data-s="ata"]{color:var(--ata);background:var(--ata-fondo);border-color:var(--ata)}
.pill[data-s="futura"]{color:var(--futura);background:var(--futura-fondo);border-color:var(--futura)}
.pill[data-s="no_ata"]{color:var(--noata);background:var(--noata-fondo);border-color:var(--noata)}
.pill[data-s="indeterminada"]{color:var(--indet);background:var(--indet-fondo);border-color:var(--indet)}
.pill.nivel{border-style:dashed;color:var(--ink-soft);background:transparent;border-color:var(--line)}

.detalle{position:fixed;inset:auto 0 0 0;max-height:72vh;overflow:auto;background:var(--raised);border-top:2px solid var(--marca-vivo);padding:20px;z-index:30;box-shadow:0 -12px 40px rgba(14,0,15,.22)}
@media(min-width:900px){.detalle{inset:0 0 0 auto;max-width:440px;max-height:none;border-top:0;border-left:2px solid var(--marca-vivo);box-shadow:-12px 0 40px rgba(14,0,15,.22)}}
.detalle h3{font-size:17px;font-weight:600;margin:6px 0 4px;line-height:1.25}
.detalle .cerrar{position:absolute;top:14px;right:16px;background:transparent;border:1px solid var(--line);padding:4px 9px;cursor:pointer;font-size:12px}
.detalle dl{margin:16px 0 0}
.detalle dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:15px}
.detalle dd{margin:5px 0 0;font-size:13.5px;color:var(--ink-soft)}
.detalle code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px}
.regla{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);background:var(--surface-2);padding:9px 11px;border-left:2px solid var(--marca-vivo);margin-top:10px}

.tablawrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface);margin-top:22px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.mono{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);white-space:nowrap}

.pie{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);max-width:76ch}
.seccion{margin-top:42px}
.seccion>h2{font-size:18px;font-weight:600;margin-bottom:5px}
.seccion>p{color:var(--ink-soft);font-size:14px;max-width:72ch;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* --- fase 7: las tres vistas ------------------------------------------- */
.oculto{display:none}
.vistas{display:flex;gap:4px;margin:0 auto 26px;padding:5px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;max-width:min(1160px,100% - 48px)}
.vistas button{flex:1;padding:11px 14px;border:0;border-radius:8px;background:transparent;
  color:var(--muted);font:600 14px/1 Archivo,system-ui;cursor:pointer;letter-spacing:-.01em;
  transition:background .14s,color .14s}
.vistas button:hover{color:var(--ink)}
.vistas button[aria-selected="true"]{background:var(--ink);color:var(--ground)}

.firmante{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:22px 0 8px}
.firmante label{display:flex;flex-direction:column;gap:6px;flex:1;min-width:190px}
.firmante span{font:500 12px/1.3 Archivo,system-ui;color:var(--muted);letter-spacing:.02em;
  text-transform:uppercase}
.firmante input{padding:10px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--ground);color:var(--ink);font:400 15px/1.3 Archivo,system-ui}
.firmante input:focus{outline:2px solid var(--ata);outline-offset:1px;border-color:transparent}
.accion{padding:11px 18px;border:1px solid var(--ink);border-radius:9px;background:var(--ink);
  color:var(--ground);font:600 14px/1 Archivo,system-ui;cursor:pointer}
.accion:hover{opacity:.87}
.accion[disabled]{opacity:.38;cursor:not-allowed}

.filtro{margin:18px 0 20px;flex-wrap:wrap}
.filtro button{padding:8px 14px}

.q{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px;
  background:var(--surface)}
.q[data-e="contestada"]{border-color:var(--ata)}
.q[data-e="salta"]{opacity:.62;border-style:dashed}
.q .qid{font:500 11px/1 IBM Plex Mono,monospace;color:var(--muted);letter-spacing:.04em}
.q h4{margin:7px 0 10px;font:600 16.5px/1.35 Archivo,system-ui;letter-spacing:-.011em}
.q .porque{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.q .ref{font:500 11px/1 IBM Plex Mono,monospace;padding:4px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--muted)}

.q textarea,.q input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--ground);color:var(--ink);font:400 14.5px/1.5 Archivo,system-ui;
  resize:vertical}
.q textarea:focus,.q input:focus{outline:2px solid var(--ata);outline-offset:1px;border-color:transparent}
.q .opciones{display:flex;flex-direction:column;gap:7px}
.q .opciones label{display:flex;gap:9px;align-items:flex-start;font:400 14px/1.45 Archivo,system-ui;
  cursor:pointer}
.q .pie2{margin-top:9px;font:400 12px/1.4 Archivo,system-ui;color:var(--muted);
  display:flex;gap:12px;flex-wrap:wrap}

ked last and separately: until it is there, the document is emitted marked as a draft."},"destinatario_principal":"direccion"},{"paquete":"aia-despliegue","titulo":{"es":"Obligaciones del responsable del despliegue frente a las personas","en":"Deployer obligations towards people"},"nota":{"es":"Este formulario existe porque faltaba. El requisito AIA-R-026-04 —informar a los trabajadores y a sus representantes antes de poner en servicio un sistema de alto riesgo en el lugar de trabajo, e informar a las personas cuando el sistema decide sobre ellas— estaba catalogado y sin ninguna pregunta que lo cubriera, y la razón escrita era que toca Derecho laboral y varía por Estado miembro.\n\nEsa razón era buena para no improvisar la NORMA y mala para no hacer la PREGUNTA. Lo que varía por Estado miembro es qué cauce de información o consulta exige cada legislación nacional; lo que no varía es que el artículo 26(7) obliga a informar y que quien despliega sabe si lo hizo, cuándo y por qué cauce. Así que se pregunta eso, se pide el Estado miembro y se dice expresamente que la suficiencia del cauce la juzga quien conozca esa legislación. Preguntar sin fingir que aquí se sabe la respuesta es distinto de no preguntar.","en":"This form exists because it was missing. Requirement AIA-R-026-04 —inform workers and their representatives before putting a high-risk system into service in the workplace, and inform persons when the system decides about them— was catalogued with no question covering it, and the reason written down was that it touches labour law and varies by Member State.\n\nThat reason was good for not improvising the RULE and bad for not asking the QUESTION. What varies by Member State is which information or consultation channel each national law requires; what does not vary is that Article 26(7) requires informing, and that whoever deploys knows whether they did, when, and through what channel. So that is what is asked, the Member State is requested, and it is stated outright that the sufficiency of the channel is judged by someone who knows that law. Asking without pretending the answer is known here is different from not asking."},"destinatario_principal":"responsable"},{"paquete":"aia-proveedor","titulo":{"es":"Obligaciones del proveedor","en":"Provider obligations"},"nota":null,"destinatario_principal":"direccion"},{"paquete":"aia-sistema","titulo":{"es":"El sistema en operación","en":"The system in operation"},"nota":null,"destinatario_principal":"tecnico"},{"paquete":"iso-contexto","titulo":{"es":"Contexto de la organización","en":"Context of the organization"},"nota":null,"destinatario_principal":"direccion"},{"paquete":"iso-desempeno","titulo":{"es":"Evaluación del desempeño","en":"Performance evaluation"},"nota":null,"destinatario_principal":"direccion"},{"paquete":"iso-liderazgo","titulo":{"es":"Liderazgo, política y objetivos","en":"Leadership, policy and objectives"},"nota":null,"destinatario_principal":"direccion"},{"paquete":"iso-mejora","titulo":{"es":"Mejora","en":"Improvement"},"nota":null,"destinatario_principal":"responsable"},{"paquete":"iso-operacion","titulo":{"es":"Operación","en":"Operation"},"nota":null,"destinatario_principal":"responsable"},{"paquete":"iso-riesgo","titulo":{"es":"Riesgo, tratamiento e impacto","en":"Risk, treatment and impact"},"nota":null,"destinatario_principal":"responsable"},{"paquete":"iso-soporte","titulo":{"es":"Soporte: recursos, competencia e información documentada","en":"Support: resources, competence and documented information"},"nota":null,"destinatario_principal":"responsable"},{"paquete":"iso-uso","titulo":{"es":"Uso responsable y uso previsto del sistema (ISO/IEC 42001 A.9)","en":"Responsible use and intended use of the system (ISO/IEC 42001 A.9)"},"nota":null,"destinatario_principal":"responsable"}],"preguntas":[{"id":"F-CAD-1","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Qué versión del estado de la técnica y qué normas armonizadas ha tomado como referencia para cumplir los requisitos de los artículos 9 a 15?","en":"Which state of the art and which harmonised standards have you taken as a reference to meet the Articles 9 to 15 requirements?"},"ayuda":{"es":"El artículo 8 no añade requisitos nuevos: dice que los de la sección se cumplen teniendo en cuenta el estado de la técnica y la finalidad prevista del sistema. En la práctica eso significa nombrar contra qué se comparó. Una respuesta que no nombre ninguna referencia deja los artículos 9 a 15 sin criterio, y entonces «cumplido» quiere decir lo que cada uno quiera.","en":"Article 8 adds no new requirements: it says the section's requirements are met taking into account the state of the art and the system's intended purpose. In practice that means naming what you compared against. An answer naming no reference leaves Articles 9 to 15 without a yardstick, and then 'met' means whatever each person wants."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":120},"opciones":[],"sirve_a":["AIA-008","A.6.2.2"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-008","marco":"ai-act","referencia":{"es":"artículo 8","en":"Article 8"},"titulo":{"es":"Cumplimiento de los requisitos","en":"Compliance with the requirements"}},{"id":"A.6.2.2","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.2","en":"Annex A, A.6.2.2"},"titulo":{"es":"Requisitos y especificación del sistema de IA","en":"AI system requirements and specification"}}]},{"id":"F-CAD-2","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Dónde se conserva la documentación técnica y la declaración de conformidad, y durante cuántos años?","en":"Where are the technical documentation and the declaration of conformity kept, and for how many years?"},"ayuda":{"es":"El artículo 18 pide diez años a disposición de las autoridades nacionales, contados desde la introducción en el mercado o la puesta en servicio. Diez años es más de lo que dura la mayoría de las herramientas en las que se guarda: si la respuesta es «en el wiki del equipo», conviene decirlo ahora y no dentro de siete años.","en":"Article 18 asks for ten years at the disposal of national authorities, counted from placing on the market or putting into service. Ten years is longer than most of the tools it gets stored in last: if the answer is 'in the team wiki', it is better said now than in seven years' time."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":80},"opciones":[],"sirve_a":["AIA-018","A.6.2.7","A.4.2"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-018","marco":"ai-act","referencia":{"es":"artículo 18","en":"Article 18"},"titulo":{"es":"Conservación de la documentación","en":"Documentation keeping"}},{"id":"A.6.2.7","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.7","en":"Annex A, A.6.2.7"},"titulo":{"es":"Documentación técnica del sistema de IA","en":"AI system technical documentation"}},{"id":"A.4.2","marco":"iso42001","referencia":{"es":"Anexo A, A.4.2","en":"Annex A, A.4.2"},"titulo":{"es":"Documentación de recursos","en":"Resource documentation"}}]},{"id":"F-CAD-3","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Si detecta que un sistema ya en el mercado no es conforme, ¿qué hace, en qué orden, y a quién avisa?","en":"If you find that a system already on the market is not conforming, what do you do, in what order, and whom do you notify?"},"ayuda":{"es":"El artículo 20 obliga a adoptar de inmediato las medidas correctoras necesarias -poner en conformidad, retirar, desactivar o recuperar- y a informar a los distribuidores y, cuando proceda, a los responsables del despliegue, al representante autorizado y a los importadores. Además, si el sistema presenta un riesgo y el proveedor lo sabe, hay que informar a las autoridades. Lo que aquí importa no es que exista un procedimiento bonito, sino que la secuencia esté escrita y nombre destinatarios concretos.","en":"Article 20 requires immediately taking the necessary corrective actions - bringing into conformity, withdrawing, disabling or recalling - and informing distributors and, where applicable, deployers, the authorised representative and importers. In addition, if the system presents a risk and the provider knows it, authorities must be informed. What matters here is not that a tidy procedure exists, but that the sequence is written down and names actual recipients."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":150},"opciones":[],"sirve_a":["AIA-020","A.8.4","A.10.2"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-020","marco":"ai-act","referencia":{"es":"artículo 20","en":"Article 20"},"titulo":{"es":"Medidas correctoras y obligación de información","en":"Corrective actions and duty of information"}},{"id":"A.8.4","marco":"iso42001","referencia":{"es":"Anexo A, A.8.4","en":"Annex A, A.8.4"},"titulo":{"es":"Comunicación de incidentes","en":"Communication of incidents"}},{"id":"A.10.2","marco":"iso42001","referencia":{"es":"Anexo A, A.10.2","en":"Annex A, A.10.2"},"titulo":{"es":"Asignación de responsabilidades","en":"Allocating responsibilities"}}]},{"id":"F-CAD-4","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Quién responde, con nombre y cargo, cuándo una autoridad competente pide la documentación del sistema, y en qué lenguas puede entregarla?","en":"Who responds, by name and role, when a competent authority requests the system's documentation, and in which languages can you provide it?"},"ayuda":{"es":"El artículo 21 obliga a facilitar a la autoridad, cuando lo pida y de forma motivada, toda la información y documentación necesarias para demostrar la conformidad, en una lengua que la autoridad entienda fácilmente. Sin una persona designada, la petición llega a un buzón genérico y el plazo corre igual.","en":"Article 21 requires providing the authority, on reasoned request, all information and documentation necessary to demonstrate conformity, in a language the authority easily understands. Without a designated person the request lands in a generic inbox and the clock runs all the same."},"formato":"persona","vigencia_dias":365,"exige":{},"opciones":[],"sirve_a":["AIA-021","A.10.2","A.8.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-021","marco":"ai-act","referencia":{"es":"artículo 21","en":"Article 21"},"titulo":{"es":"Cooperación con las autoridades competentes","en":"Cooperation with competent authorities"}},{"id":"A.10.2","marco":"iso42001","referencia":{"es":"Anexo A, A.10.2","en":"Annex A, A.10.2"},"titulo":{"es":"Asignación de responsabilidades","en":"Allocating responsibilities"}},{"id":"A.8.3","marco":"iso42001","referencia":{"es":"Anexo A, A.8.3","en":"Annex A, A.8.3"},"titulo":{"es":"Información externa","en":"External reporting"}}]},{"id":"F-CAD-5","paquete":"aia-cadena-derechos-modelos","destinatario":"direccion","texto":{"es":"¿Si está establecido fuera de la Unión, ¿quién es su representante autorizado en la Unión y dónde está su mandato escrito?","en":"If you are established outside the Union, who is your authorised representative in the Union and where is their written mandate?"},"ayuda":{"es":"El artículo 22 obliga a los proveedores de terceros países a designar, por mandato escrito, un representante autorizado en la Unión ANTES de comercializar. El mandato tiene que facultarle para, entre otras cosas, conservar la documentación diez años y cooperar con las autoridades. Si está usted establecido en la Unión, conteste que no procede y se cierra.","en":"Article 22 requires third-country providers to appoint, by written mandate, an authorised representative in the Union BEFORE placing the system on the market. The mandate must empower them, among other things, to keep the documentation for ten years and cooperate with authorities. If you are established in the Union, answer not applicable and it closes."},"formato":"texto_corto","vigencia_dias":365,"exige":{"minimo_caracteres":20},"opciones":[],"sirve_a":["AIA-022","A.10.2","A.10.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-022","marco":"ai-act","referencia":{"es":"artículo 22","en":"Article 22"},"titulo":{"es":"Representantes autorizados de los proveedores de sistemas de IA de alto riesgo","en":"Authorised representatives of providers of high-risk AI systems"}},{"id":"A.10.2","marco":"iso42001","referencia":{"es":"Anexo A, A.10.2","en":"Annex A, A.10.2"},"titulo":{"es":"Asignación de responsabilidades","en":"Allocating responsibilities"}},{"id":"A.10.3","marco":"iso42001","referencia":{"es":"Anexo A, A.10.3","en":"Annex A, A.10.3"},"titulo":{"es":"Proveedores","en":"Suppliers"}}]},{"id":"F-CAD-6","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Cómo importador, ¿qué comprueba antes de introducir un sistema en el mercado, y dónde guarda constancia de esa comprobación?","en":"As an importer, what do you verify before placing a system on the market, and where do you keep a record of that check?"},"ayuda":{"es":"El artículo 23 obliga al importador a verificar que el proveedor ha hecho la evaluación de la conformidad, que existe la documentación técnica, que el sistema lleva el marcado CE y va acompañado de la declaración UE de conformidad y de las instrucciones de uso, y que hay representante autorizado si procede. Verificar no es confiar: la constancia de esa verificación es lo que después le protege a usted.","en":"Article 23 requires the importer to verify that the provider has carried out the conformity assessment, that the technical documentation exists, that the system bears the CE marking and comes with the EU declaration of conformity and the instructions for use, and that there is an authorised representative where applicable. Verifying is not trusting: the record of that verification is what later protects you."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":120},"opciones":[],"sirve_a":["AIA-023","A.10.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-023","marco":"ai-act","referencia":{"es":"artículo 23","en":"Article 23"},"titulo":{"es":"Obligaciones de los importadores","en":"Obligations of importers"}},{"id":"A.10.3","marco":"iso42001","referencia":{"es":"Anexo A, A.10.3","en":"Annex A, A.10.3"},"titulo":{"es":"Proveedores","en":"Suppliers"}}]},{"id":"F-CAD-7","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Cómo distribuidor, ¿cómo comprueba el marcado CE y las instrucciones antes de comercializar, y qué hace si sospecha que el sistema no es conforme?","en":"As a distributor, how do you check the CE marking and the instructions before making the system available, and what do you do if you suspect it does not conform?"},"ayuda":{"es":"El artículo 24 pide dos cosas distintas: una comprobación previa (marcado, declaración, instrucciones, obligaciones del proveedor y del importador cumplidas) y una conducta posterior (no comercializar mientras sospeche, e informar al proveedor o al importador). La segunda es la que suele faltar por escrito.","en":"Article 24 asks two different things: a prior check (marking, declaration, instructions, provider's and importer's obligations met) and subsequent conduct (not making it available while you suspect, and informing the provider or importer). The second is the one usually missing in writing."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":120},"opciones":[],"sirve_a":["AIA-024","A.10.3","A.10.4"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-024","marco":"ai-act","referencia":{"es":"artículo 24","en":"Article 24"},"titulo":{"es":"Obligaciones de los distribuidores","en":"Obligations of distributors"}},{"id":"A.10.3","marco":"iso42001","referencia":{"es":"Anexo A, A.10.3","en":"Annex A, A.10.3"},"titulo":{"es":"Proveedores","en":"Suppliers"}},{"id":"A.10.4","marco":"iso42001","referencia":{"es":"Anexo A, A.10.4","en":"Annex A, A.10.4"},"titulo":{"es":"Clientes","en":"Customers"}}]},{"id":"F-CNF-A","paquete":"aia-cadena-derechos-modelos","destinatario":"direccion","texto":{"es":"¿Ha solicitado alguna autorización excepcional para poner en servicio un sistema sin evaluación previa de la conformidad?","en":"Have you applied for any exceptional authorisation to put a system into service without prior conformity assessment?"},"ayuda":{"es":"El artículo 46 permite a una autoridad de vigilancia del mercado autorizar, por razones excepcionales de seguridad pública o de protección de la vida y la salud, la introducción de un sistema concreto por un período limitado. Es una excepción estrecha y temporal: si la ha pedido, el expediente tiene que llevar la autorización y su plazo.","en":"Article 46 allows a market surveillance authority to authorise, for exceptional reasons of public security or protection of life and health, the placing of a specific system for a limited period. It is a narrow and temporary exception: if you have requested it, the file must carry the authorisation and its time limit."},"formato":"si_no","vigencia_dias":365,"exige":{},"opciones":[],"sirve_a":["AIA-046","A.6.2.4"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-046","marco":"ai-act","referencia":{"es":"artículo 46","en":"Article 46"},"titulo":{"es":"Exención del procedimiento de evaluación de la conformidad","en":"Derogation from conformity assessment procedure"}},{"id":"A.6.2.4","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.4","en":"Annex A, A.6.2.4"},"titulo":{"es":"Verificación y validación del sistema de IA","en":"AI system verification and validation"}}]},{"id":"F-CNF-B","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Dónde se coloca el marcado CE del sistema, y con qué número de organismo notificado cuando procede?","en":"Where is the system's CE marking affixed, and with which notified body number where applicable?"},"ayuda":{"es":"El artículo 48 pide que el marcado sea visible, legible e indeleble; cuando no sea posible por la naturaleza del sistema, va en el embalaje o en la documentación que lo acompaña. En un sistema que se entrega como software, «dónde» suele ser la pantalla de información o el fichero de documentación que acompaña a la entrega, y conviene decidirlo antes de la auditoría.","en":"Article 48 requires the marking to be visible, legible and indelible; where that is not possible given the nature of the system, it goes on the packaging or the accompanying documentation. In a system delivered as software, 'where' is usually the about screen or the documentation file shipped with the release, and it is better decided before the audit."},"formato":"texto_corto","vigencia_dias":365,"exige":{"minimo_caracteres":20},"opciones":[],"sirve_a":["AIA-048","A.8.2"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-048","marco":"ai-act","referencia":{"es":"artículo 48","en":"Article 48"},"titulo":{"es":"Marcado CE","en":"CE marking"}},{"id":"A.8.2","marco":"iso42001","referencia":{"es":"Anexo A, A.8.2","en":"Annex A, A.8.2"},"titulo":{"es":"Documentación del sistema e información para los usuarios","en":"System documentation and information for users"}}]},{"id":"F-COD-1","paquete":"aia-cadena-derechos-modelos","destinatario":"direccion","texto":{"es":"¿Se ha adherido a algún código de conducta del artículo 95, y qué compromisos asumió exactamente?","en":"Have you adhered to any Article 95 code of conduct, and what exactly did you commit to?"},"ayuda":{"es":"Los códigos de conducta son voluntarios y extienden a sistemas que NO son de alto riesgo requisitos pensados para los que sí lo son, más compromisos sobre sostenibilidad, accesibilidad, participación de las partes interesadas o diversidad de los equipos. Adherirse es gratis; incumplir lo que uno mismo firmó, no: pasa a ser una afirmación pública falsa sobre el propio producto.","en":"Codes of conduct are voluntary and extend to systems that are NOT high-risk requirements designed for those that are, plus commitments on sustainability, accessibility, stakeholder participation or team diversity. Adhering is free; failing what you signed yourself is not: it becomes a false public claim about your own product."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":80},"opciones":[],"sirve_a":["AIA-095","A.2.2","A.2.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-095","marco":"ai-act","referencia":{"es":"artículo 95","en":"Article 95"},"titulo":{"es":"Códigos de conducta para la aplicación voluntaria de requisitos específicos","en":"Codes of conduct for voluntary application of specific requirements"}},{"id":"A.2.2","marco":"iso42001","referencia":{"es":"Anexo A, A.2.2","en":"Annex A, A.2.2"},"titulo":{"es":"Política de IA","en":"AI policy"}},{"id":"A.2.3","marco":"iso42001","referencia":{"es":"Anexo A, A.2.3","en":"Annex A, A.2.3"},"titulo":{"es":"Alineación con otras políticas de la organización","en":"Alignment with other organizational policies"}}]},{"id":"F-DER-1","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Por dónde recibe una reclamación de una persona afectada por el sistema, y a quién se escala?","en":"Where do you receive a complaint from a person affected by the system, and to whom is it escalated?"},"ayuda":{"es":"El artículo 85 da a cualquier persona el derecho de presentar una reclamación ante la autoridad de vigilancia del mercado. No obliga a la empresa a tener canal propio, pero la reclamación llega igual y llega antes si hay por dónde: el canal propio es lo que convierte una reclamación en un incidente que se puede resolver, en vez de en una notificación de la autoridad.","en":"Article 85 gives any person the right to lodge a complaint with the market surveillance authority. It does not oblige the company to have its own channel, but the complaint arrives all the same, and earlier if there is somewhere for it: your own channel is what turns a complaint into an incident you can resolve rather than a notification from the authority."},"formato":"texto_corto","vigencia_dias":365,"exige":{"minimo_caracteres":20},"opciones":[],"sirve_a":["AIA-085","A.3.3","A.8.4"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-085","marco":"ai-act","referencia":{"es":"artículo 85","en":"Article 85"},"titulo":{"es":"Derecho a presentar una reclamación ante una autoridad de vigilancia del mercado","en":"Right to lodge a complaint with a market surveillance authority"}},{"id":"A.3.3","marco":"iso42001","referencia":{"es":"Anexo A, A.3.3","en":"Annex A, A.3.3"},"titulo":{"es":"Comunicación de preocupaciones","en":"Reporting of concerns"}},{"id":"A.8.4","marco":"iso42001","referencia":{"es":"Anexo A, A.8.4","en":"Annex A, A.8.4"},"titulo":{"es":"Comunicación de incidentes","en":"Communication of incidents"}}]},{"id":"F-DER-2","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Cuándo una persona pida una explicación de una decisión individual tomada con el sistema, ¿qué le entrega y quién la redacta?","en":"When a person asks for an explanation of an individual decision taken with the system, what do you give them and who writes it?"},"ayuda":{"es":"El artículo 86 da derecho a obtener del responsable del despliegue explicaciones claras y significativas sobre el papel del sistema en el procedimiento y sobre los principales elementos de la decisión adoptada, cuando la decisión se basa en la salida de un sistema de alto riesgo del Anexo III y produce efectos jurídicos o afecta significativamente a la salud, la seguridad o los derechos fundamentales. Una captura del resultado del modelo no es una explicación.","en":"Article 86 gives the right to obtain from the deployer clear and meaningful explanations of the system's role in the decision-making procedure and of the main elements of the decision taken, where the decision is based on the output of an Annex III high-risk system and produces legal effects or significantly affects health, safety or fundamental rights. A screenshot of the model output is not an explanation."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":150},"opciones":[],"sirve_a":["AIA-086","A.8.2","A.8.5"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-086","marco":"ai-act","referencia":{"es":"artículo 86","en":"Article 86"},"titulo":{"es":"Derecho a explicación de decisiones tomadas individualmente","en":"Right to explanation of individual decision-making"}},{"id":"A.8.2","marco":"iso42001","referencia":{"es":"Anexo A, A.8.2","en":"Annex A, A.8.2"},"titulo":{"es":"Documentación del sistema e información para los usuarios","en":"System documentation and information for users"}},{"id":"A.8.5","marco":"iso42001","referencia":{"es":"Anexo A, A.8.5","en":"Annex A, A.8.5"},"titulo":{"es":"Información para las partes interesadas","en":"Information for interested parties"}}]},{"id":"F-DER-3","paquete":"aia-cadena-derechos-modelos","destinatario":"direccion","texto":{"es":"¿Tiene canal interno de denuncias conforme a la Directiva (UE) 2019/1937, y quién lo gestiona?","en":"Do you have an internal reporting channel under Directive (EU) 2019/1937, and who manages it?"},"ayuda":{"es":"El artículo 87 remite a la Directiva de protección de denunciantes para las infracciones de este Reglamento. Lo que se comprueba aquí no es el canal en sí -que ya viene exigido por otra norma-, sino que cubra también las infracciones del Reglamento de IA, que es lo que casi nunca está escrito.","en":"Article 87 refers to the whistleblower protection Directive for infringements of this Regulation. What is checked here is not the channel itself - already required by another instrument - but that it also covers AI Act infringements, which is what is almost never written down."},"formato":"texto_corto","vigencia_dias":365,"exige":{"minimo_caracteres":20},"opciones":[],"sirve_a":["AIA-087","A.3.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-087","marco":"ai-act","referencia":{"es":"artículo 87","en":"Article 87"},"titulo":{"es":"Denuncia de infracciones y protección de los denunciantes","en":"Reporting of infringements and protection of reporting persons"}},{"id":"A.3.3","marco":"iso42001","referencia":{"es":"Anexo A, A.3.3","en":"Annex A, A.3.3"},"titulo":{"es":"Comunicación de preocupaciones","en":"Reporting of concerns"}}]},{"id":"F-MOD-A","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Qué cantidad acumulada de cómputo se usó para entrenar el modelo, y lo ha notificado a la Comisión?","en":"What cumulative amount of compute was used to train the model, and have you notified the Commission?"},"ayuda":{"es":"El artículo 51 presume riesgo sistémico a partir de un umbral de cómputo acumulado de entrenamiento, y el artículo 52 obliga a notificarlo a la Comisión sin demora y en un plazo de dos semanas desde que se cumple el requisito o desde que se sabe que se cumplirá. Se puede alegar que, pese a superar el umbral, el modelo no presenta riesgos sistémicos; alegarlo es un escrito, no un silencio.","en":"Article 51 presumes systemic risk above a cumulative training compute threshold, and Article 52 requires notifying the Commission without delay and within two weeks of the requirement being met or of knowing it will be. You may argue that, despite exceeding the threshold, the model does not present systemic risks; arguing it is a written submission, not silence."},"formato":"texto_corto","vigencia_dias":180,"exige":{"minimo_caracteres":10},"opciones":[],"sirve_a":["AIA-052","A.8.3","A.10.2"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-052","marco":"ai-act","referencia":{"es":"artículo 52","en":"Article 52"},"titulo":{"es":"Procedimiento","en":"Procedure"}},{"id":"A.8.3","marco":"iso42001","referencia":{"es":"Anexo A, A.8.3","en":"Annex A, A.8.3"},"titulo":{"es":"Información externa","en":"External reporting"}},{"id":"A.10.2","marco":"iso42001","referencia":{"es":"Anexo A, A.10.2","en":"Annex A, A.10.2"},"titulo":{"es":"Asignación de responsabilidades","en":"Allocating responsibilities"}}]},{"id":"F-MOD-B","paquete":"aia-cadena-derechos-modelos","destinatario":"direccion","texto":{"es":"¿Si el proveedor del modelo está fuera de la Unión, ¿quién es su representante autorizado y dónde está el mandato?","en":"If the model provider is established outside the Union, who is the authorised representative and where is the mandate?"},"ayuda":{"es":"El artículo 54 es el equivalente del artículo 22 para los modelos de uso general, y tiene una consecuencia que se pasa por alto: el representante puede poner fin al mandato si considera que el proveedor actúa en contra del Reglamento, y entonces debe informar a la Oficina de IA. El mandato no es un trámite, es una salida de emergencia.","en":"Article 54 is the Article 22 equivalent for general-purpose AI models, with a consequence that gets overlooked: the representative may terminate the mandate if it considers the provider acts contrary to the Regulation, and must then inform the AI Office. The mandate is not paperwork, it is an emergency exit."},"formato":"texto_corto","vigencia_dias":365,"exige":{"minimo_caracteres":20},"opciones":[],"sirve_a":["AIA-054","A.10.2","A.10.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-054","marco":"ai-act","referencia":{"es":"artículo 54","en":"Article 54"},"titulo":{"es":"Representantes autorizados de los proveedores de modelos de IA de uso general","en":"Authorised representatives of providers of general-purpose AI models"}},{"id":"A.10.2","marco":"iso42001","referencia":{"es":"Anexo A, A.10.2","en":"Annex A, A.10.2"},"titulo":{"es":"Asignación de responsabilidades","en":"Allocating responsibilities"}},{"id":"A.10.3","marco":"iso42001","referencia":{"es":"Anexo A, A.10.3","en":"Annex A, A.10.3"},"titulo":{"es":"Proveedores","en":"Suppliers"}}]},{"id":"F-MOD-C","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Quién atiende una solicitud de documentación o información de la Comisión sobre el modelo, y en cuánto tiempo puede reunirla?","en":"Who handles a Commission request for documentation or information about the model, and how quickly can you assemble it?"},"ayuda":{"es":"El artículo 91 faculta a la Comisión para pedir al proveedor del modelo la documentación de los artículos 53 y 55 y cualquier información adicional necesaria para evaluar el cumplimiento. La petición indica la base jurídica, el plazo y las sanciones por no responder. El plazo no se negocia el día que llega.","en":"Article 91 empowers the Commission to request from the model provider the Articles 53 and 55 documentation and any additional information needed to assess compliance. The request states the legal basis, the deadline and the penalties for not responding. The deadline is not negotiated on the day it arrives."},"formato":"persona","vigencia_dias":365,"exige":{},"opciones":[],"sirve_a":["AIA-091","A.6.2.7","A.8.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-091","marco":"ai-act","referencia":{"es":"artículo 91","en":"Article 91"},"titulo":{"es":"Poderes para solicitar documentación e información","en":"Power to request documentation and information"}},{"id":"A.6.2.7","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.7","en":"Annex A, A.6.2.7"},"titulo":{"es":"Documentación técnica del sistema de IA","en":"AI system technical documentation"}},{"id":"A.8.3","marco":"iso42001","referencia":{"es":"Anexo A, A.8.3","en":"Annex A, A.8.3"},"titulo":{"es":"Información externa","en":"External reporting"}}]},{"id":"F-MOD-D","paquete":"aia-cadena-derechos-modelos","destinatario":"tecnico","texto":{"es":"¿Por qué vía técnica podría la Comisión acceder al modelo para evaluarlo, incluida la API y los parámetros de acceso?","en":"By which technical route could the Commission access the model in order to evaluate it, including the API and access parameters?"},"ayuda":{"es":"El artículo 92 permite a la Comisión realizar evaluaciones del modelo, entre otras cosas para comprobar el cumplimiento o para investigar un riesgo sistémico, y puede exigir acceso a través de una API o de otros medios técnicos apropiados, incluido el código fuente. Tener la vía prevista y documentada evita improvisar un acceso privilegiado bajo presión, que es como se abren agujeros.","en":"Article 92 allows the Commission to conduct evaluations of the model, among other things to check compliance or investigate a systemic risk, and it may require access through an API or other appropriate technical means, including source code. Having the route planned and documented avoids improvising privileged access under pressure, which is how holes get opened."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":100},"opciones":[],"sirve_a":["AIA-092","A.6.2.4"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-092","marco":"ai-act","referencia":{"es":"artículo 92","en":"Article 92"},"titulo":{"es":"Poderes para realizar evaluaciones","en":"Power to conduct evaluations"}},{"id":"A.6.2.4","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.4","en":"Annex A, A.6.2.4"},"titulo":{"es":"Verificación y validación del sistema de IA","en":"AI system verification and validation"}}]},{"id":"F-MOD-E","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Si la Comisión exigiera restringir, retirar del mercado o recuperar el modelo, ¿cuál es la ruta y cuánto tarda?","en":"If the Commission required restricting, withdrawing or recalling the model, what is the route and how long does it take?"},"ayuda":{"es":"El artículo 93 permite a la Comisión exigir medidas adecuadas, incluida la restricción de la comercialización, la retirada o la recuperación del modelo. La pregunta no es si obedecería: es si puede, y en cuánto tiempo. Un modelo servido por doce clientes a través de una API tiene una ruta de retirada muy distinta de uno que se distribuye por descarga.","en":"Article 93 allows the Commission to require appropriate measures, including restricting the making available, withdrawing or recalling the model. The question is not whether you would obey: it is whether you can, and how fast. A model served to twelve customers through an API has a very different withdrawal route from one distributed by download."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":100},"opciones":[],"sirve_a":["AIA-093","A.8.4","A.10.2"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-093","marco":"ai-act","referencia":{"es":"artículo 93","en":"Article 93"},"titulo":{"es":"Poderes para solicitar la adopción de medidas","en":"Power to request measures"}},{"id":"A.8.4","marco":"iso42001","referencia":{"es":"Anexo A, A.8.4","en":"Annex A, A.8.4"},"titulo":{"es":"Comunicación de incidentes","en":"Communication of incidents"}},{"id":"A.10.2","marco":"iso42001","referencia":{"es":"Anexo A, A.10.2","en":"Annex A, A.10.2"},"titulo":{"es":"Asignación de responsabilidades","en":"Allocating responsibilities"}}]},{"id":"F-PRU-1","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Si trata datos personales recogidos para otra finalidad dentro de un espacio controlado de pruebas, ¿cuál es el interés público que lo justifica y de dónde vienen esos datos?","en":"If you further process personal data collected for another purpose inside a regulatory sandbox, what is the public interest justifying it and where does that data come from?"},"ayuda":{"es":"El artículo 59 abre una puerta estrecha y la rodea de condiciones: interés público sustancial en un ámbito tasado, datos necesarios, supervisión, aislamiento, no transmisión a terceros, no decisiones que afecten a los interesados, borrado al terminar y registro del tratamiento. Contestarla mal no es un defecto de forma: es tratar datos personales sin base.","en":"Article 59 opens a narrow door and surrounds it with conditions: substantial public interest in a listed area, necessary data, supervision, isolation, no transmission to third parties, no decisions affecting data subjects, deletion on completion and a record of the processing. Answering it badly is not a formal defect: it is processing personal data without a basis."},"formato":"texto_largo","vigencia_dias":180,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["AIA-059","A.7.3","A.7.5"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-059","marco":"ai-act","referencia":{"es":"artículo 59","en":"Article 59"},"titulo":{"es":"Tratamiento ulterior de datos personales para el desarrollo de determinados sistemas de IA en favor del interés público en el espacio controlado de pruebas para la IA","en":"Further processing of personal data for developing certain AI systems in the public interest in the AI regulatory sandbox"}},{"id":"A.7.3","marco":"iso42001","referencia":{"es":"Anexo A, A.7.3","en":"Annex A, A.7.3"},"titulo":{"es":"Adquisición de datos","en":"Acquisition of data"}},{"id":"A.7.5","marco":"iso42001","referencia":{"es":"Anexo A, A.7.5","en":"Annex A, A.7.5"},"titulo":{"es":"Procedencia de los datos","en":"Data provenance"}}]},{"id":"F-PRU-2","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Va a probar el sistema en condiciones reales fuera de un espacio controlado, y dónde está el plan de pruebas registrado?","en":"Will you test the system in real world conditions outside a sandbox, and where is the registered testing plan?"},"ayuda":{"es":"El artículo 60 permite probar en condiciones reales antes de la comercialización, con un plan registrado ante la autoridad, un máximo de seis meses prorrogable otros seis, supervisión por personas cualificadas, capacidad de revertir o descartar las predicciones y conservación de la documentación durante seis meses. El plan registrado es la pieza que hace legal todo lo demás.","en":"Article 60 allows testing in real world conditions before placing on the market, with a plan registered with the authority, a maximum of six months extendable by six more, supervision by qualified persons, the ability to reverse or disregard predictions, and documentation kept for six months. The registered plan is the piece that makes everything else lawful."},"formato":"texto_largo","vigencia_dias":180,"exige":{"minimo_caracteres":120},"opciones":[],"sirve_a":["AIA-060","A.6.2.4","A.6.2.5"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-060","marco":"ai-act","referencia":{"es":"artículo 60","en":"Article 60"},"titulo":{"es":"Pruebas de sistemas de IA de alto riesgo en condiciones reales fuera de los espacios controlados de pruebas para la IA","en":"Testing of high-risk AI systems in real world conditions outside AI regulatory sandboxes"}},{"id":"A.6.2.4","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.4","en":"Annex A, A.6.2.4"},"titulo":{"es":"Verificación y validación del sistema de IA","en":"AI system verification and validation"}},{"id":"A.6.2.5","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.5","en":"Annex A, A.6.2.5"},"titulo":{"es":"Despliegue del sistema de IA","en":"AI system deployment"}}]},{"id":"F-PRU-3","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Cómo obtiene y dónde conserva el consentimiento informado de quiénes participan en pruebas en condiciones reales?","en":"How do you obtain and where do you keep the informed consent of those taking part in real world testing?"},"ayuda":{"es":"El artículo 61 pide consentimiento libremente dado, previo y documentado, con información concisa sobre la naturaleza y los objetivos de la prueba, los inconvenientes posibles, las condiciones de participación, el derecho a retirarse sin perjuicio y los datos de contacto. El participante se queda con una copia. Un consentimiento que no se puede enseñar no existe.","en":"Article 61 requires freely given, prior and documented consent, with concise information on the nature and objectives of the test, the possible inconveniences, the conditions of participation, the right to withdraw without detriment and contact details. The participant keeps a copy. A consent you cannot show does not exist."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":100},"opciones":[],"sirve_a":["AIA-061","A.8.5"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-061","marco":"ai-act","referencia":{"es":"artículo 61","en":"Article 61"},"titulo":{"es":"Consentimiento informado para participar en pruebas en condiciones reales fuera de los espacios controlados de pruebas para la IA","en":"Informed consent to participate in testing in real world conditions outside AI regulatory sandboxes"}},{"id":"A.8.5","marco":"iso42001","referencia":{"es":"Anexo A, A.8.5","en":"Annex A, A.8.5"},"titulo":{"es":"Información para las partes interesadas","en":"Information for interested parties"}}]},{"id":"F-PRU-4","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Si su sistema es componente de seguridad de un producto de la sección B del Anexo I, ¿dónde está el plan de pruebas en condiciones reales?","en":"If your system is a safety component of an Annex I Section B product, where is the real world testing plan?"},"ayuda":{"es":"El artículo 60 bis, que añadió el Reglamento (UE) 2026/1744, extiende a esos productos el régimen del artículo 60. La fecha en la que empieza a atar es la del Anexo I: 2 de agosto de 2028, ocho meses después que la del Anexo III. Si no sabe por cuál de las dos vías es de alto riesgo, Actaira no le inventa la fecha: se la pregunta.","en":"Article 60a, added by Regulation (EU) 2026/1744, extends the Article 60 regime to those products. The date it starts to bind is the Annex I one: 2 August 2028, eight months after the Annex III one. If you do not know which of the two routes makes you high-risk, Actaira does not invent the date: it asks."},"formato":"texto_largo","vigencia_dias":180,"exige":{"minimo_caracteres":80},"opciones":[],"sirve_a":["AIA-060A","A.6.2.4","A.6.2.5"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-060A","marco":"ai-act","referencia":{"es":"artículo 60a","en":"Article 60a"},"titulo":{"es":"Pruebas en condiciones reales de los sistemas de la sección B","en":"Testing in real world conditions of Section B systems"}},{"id":"A.6.2.4","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.4","en":"Annex A, A.6.2.4"},"titulo":{"es":"Verificación y validación del sistema de IA","en":"AI system verification and validation"}},{"id":"A.6.2.5","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.5","en":"Annex A, A.6.2.5"},"titulo":{"es":"Despliegue del sistema de IA","en":"AI system deployment"}}]},{"id":"F-PYM-1","paquete":"aia-cadena-derechos-modelos","destinatario":"direccion","texto":{"es":"¿Es su organización una microempresa, y se acoge al cumplimiento simplificado del sistema de gestión de la calidad?","en":"Is your organisation a microenterprise, and are you relying on the simplified quality management system compliance?"},"ayuda":{"es":"El artículo 63 permite a las microempresas cumplir de forma simplificada determinados elementos del sistema de gestión de la calidad del artículo 17. Simplificado no es exento: el resto del Reglamento se aplica igual, y acogerse a esto conviene que conste por escrito con la fecha en que se comprobó el tamaño.","en":"Article 63 allows microenterprises to comply in a simplified manner with certain elements of the Article 17 quality management system. Simplified is not exempt: the rest of the Regulation applies all the same, and relying on this is better recorded in writing with the date the size was checked."},"formato":"si_no","vigencia_dias":365,"exige":{},"opciones":[],"sirve_a":["AIA-063","A.4.2"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-063","marco":"ai-act","referencia":{"es":"artículo 63","en":"Article 63"},"titulo":{"es":"Excepciones para operadores específicos","en":"Derogations for specific operators"}},{"id":"A.4.2","marco":"iso42001","referencia":{"es":"Anexo A, A.4.2","en":"Annex A, A.4.2"},"titulo":{"es":"Documentación de recursos","en":"Resource documentation"}}]},{"id":"F-SES-1","paquete":"aia-cadena-derechos-modelos","destinatario":"responsable","texto":{"es":"¿Trata categorías especiales de datos personales para detectar y corregir sesgos, y qué hace con esos datos cuando termina?","en":"Do you process special categories of personal data to detect and correct bias, and what do you do with that data when you are done?"},"ayuda":{"es":"El artículo 4 bis, que añadió el Reglamento (UE) 2026/1744, es una puerta: autoriza tratar datos como el origen étnico o los datos de salud cuando hacen falta de verdad para medir un sesgo. La puerta viene con cerrojos: estrictamente necesario, limitaciones técnicas a la reutilización, seudonimización o cifrado cuando baste, acceso restringido a quien lo necesite, borrado en cuanto se corrige el sesgo y justificación documentada. Sin el borrado y sin el acceso restringido, lo que había era una excusa para guardar datos sensibles.","en":"Article 4a, added by Regulation (EU) 2026/1744, is a door: it authorises processing data such as ethnic origin or health data where it is genuinely needed to measure bias. The door comes with locks: strictly necessary, technical limits on reuse, pseudonymisation or encryption where enough, access restricted to those who need it, deletion as soon as the bias is corrected, and documented justification. Without the deletion and the restricted access, what you had was an excuse to keep sensitive data."},"formato":"texto_largo","vigencia_dias":180,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["AIA-004A","A.7.4","A.7.6","A.5.4"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-004A","marco":"ai-act","referencia":{"es":"artículo 4a","en":"Article 4a"},"titulo":{"es":"Tratamiento de datos para la detección y corrección de sesgos","en":"Processing of data for bias detection and correction"}},{"id":"A.7.4","marco":"iso42001","referencia":{"es":"Anexo A, A.7.4","en":"Annex A, A.7.4"},"titulo":{"es":"Calidad de los datos para los sistemas de IA","en":"Quality of data for AI systems"}},{"id":"A.7.6","marco":"iso42001","referencia":{"es":"Anexo A, A.7.6","en":"Annex A, A.7.6"},"titulo":{"es":"Preparación de los datos","en":"Data preparation"}},{"id":"A.5.4","marco":"iso42001","referencia":{"es":"Anexo A, A.5.4","en":"Annex A, A.5.4"},"titulo":{"es":"Evaluación del impacto sobre personas o grupos","en":"Assessing AI system impact on individuals or groups"}}]},{"id":"F-CLS-1","paquete":"aia-clasificacion","destinatario":"responsable","texto":{"es":"¿Hace su sistema alguna de las prácticas prohibidas del artículo 5?","en":"Does your system perform any of the prohibited practices in Article 5?"},"ayuda":{"es":"El artículo 5 no admite mitigación: si entra, no se despliega. Está en vigor desde el 2 de febrero de 2025 y es la única parte del Reglamento donde la respuesta correcta a un hallazgo es apagar el sistema, no documentarlo. Marque todas las que apliquen o la última opción.","en":"Article 5 admits no mitigation: if you fall under it, you do not deploy. It has applied since 2 February 2025 and is the only part of the Regulation where the right response to a finding is to switch the system off, not to document it. Tick all that apply or the last option."},"formato":"eleccion","vigencia_dias":180,"exige":{"excluyente":"ninguna","minimo_elementos":1},"opciones":[{"valor":"subliminal","es":"Técnicas subliminales o deliberadamente manipuladoras que mermen la capacidad de decidir","en":"Subliminal or purposefully manipulative techniques impairing the ability to decide"},{"valor":"vulnerabilidad","es":"Explotación de vulnerabilidades por edad, discapacidad o situación social o económica","en":"Exploitation of vulnerabilities due to age, disability or social or economic situation"},{"valor":"puntuacion_social","es":"Puntuación social que lleve a trato perjudicial en contextos no relacionados","en":"Social scoring leading to detrimental treatment in unrelated contexts"},{"valor":"prediccion_delictiva","es":"Predicción del riesgo de que una persona cometa un delito basada solo en perfilado o rasgos","en":"Predicting a person's risk of committing a crime based solely on profiling or traits"},{"valor":"raspado_facial","es":"Creación de bases de reconocimiento facial mediante raspado no selectivo","en":"Building facial recognition databases through untargeted scraping"},{"valor":"emociones_trabajo","es":"Inferencia de emociones en el lugar de trabajo o en centros educativos","en":"Emotion inference in the workplace or in educational institutions"},{"valor":"categorizacion","es":"Categorización biométrica para deducir raza, opiniones políticas, afiliación sindical, creencias, vida u orientación sexual","en":"Biometric categorisation to infer race, political opinions, trade union membership, beliefs, sex life or sexual orientation"},{"valor":"identificacion_remota","es":"Identificación biométrica remota en tiempo real en espacios de acceso público con fines policiales","en":"Real-time remote biometric identification in publicly accessible spaces for law enforcement"},{"valor":"ninguna","es":"Ninguna de las anteriores","en":"None of the above"}],"sirve_a":["AIA-005"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-005","marco":"ai-act","referencia":{"es":"artículo 5","en":"Article 5"},"titulo":{"es":"Prácticas de IA prohibidas","en":"Prohibited AI practices"}}]},{"id":"F-CLS-2","paquete":"aia-clasificacion","destinatario":"responsable","texto":{"es":"¿Es su sistema un componente de seguridad de un producto cubierto por la legislación de armonización del Anexo I, o es el producto mismo?","en":"Is your system a safety component of a product covered by the Annex I harmonisation legislation, or the product itself?"},"ayuda":{"es":"Esta es la primera de las dos puertas del artículo 6. Si la respuesta es si y el producto necesita evaluación de la conformidad por un tercero, el sistema es de alto riesgo por el apartado 1, sin pasar por el Anexo III.","en":"This is the first of Article 6's two gates. If the answer is yes and the product requires third-party conformity assessment, the system is high-risk under paragraph 1, without going through Annex III."},"formato":"si_no","vigencia_dias":180,"exige":{},"opciones":[],"sirve_a":["AIA-006"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-006","marco":"ai-act","referencia":{"es":"artículo 6","en":"Article 6"},"titulo":{"es":"Reglas de clasificación de sistemas de alto riesgo","en":"Classification rules for high-risk AI systems"}}]},{"id":"F-CLS-3","paquete":"aia-clasificacion","destinatario":"responsable","texto":{"es":"¿En cuál de los ocho ámbitos del Anexo III encaja el uso previsto de su sistema?","en":"Which of the eight Annex III areas does your system's intended use fall into?"},"ayuda":{"es":"La puerta del apartado 2. Si encaja en alguno, el sistema es de alto riesgo salvo que pueda acogerse a la excepción del artículo 6.3, que exige que no plantee un riesgo importante de perjuicio y que además se documente y se registre esa evaluación antes de comercializar.","en":"The paragraph 2 gate. If it fits any, the system is high-risk unless it can rely on the Article 6(3) derogation, which requires that it does not pose a significant risk of harm and that the assessment be documented and registered before placing on the market."},"formato":"eleccion","vigencia_dias":180,"exige":{"excluyente":"ninguno","minimo_elementos":1},"opciones":[{"valor":"biometria","es":"Biometría","en":"Biometrics"},{"valor":"infraestructuras","es":"Infraestructuras críticas","en":"Critical infrastructure"},{"valor":"educacion","es":"Educación y formación profesional","en":"Education and vocational training"},{"valor":"empleo","es":"Empleo, gestión de trabajadores y acceso al autoempleo","en":"Employment, workers management and access to self-employment"},{"valor":"servicios","es":"Acceso a servicios esenciales públicos y privados","en":"Access to essential public and private services"},{"valor":"policial","es":"Garantía del cumplimiento del Derecho","en":"Law enforcement"},{"valor":"migracion","es":"Migración, asilo y control fronterizo","en":"Migration, asylum and border control"},{"valor":"justicia","es":"Administración de justicia y procesos democraticos","en":"Administration of justice and democratic processes"},{"valor":"ninguno","es":"Ninguno de los ocho","en":"None of the eight"}],"sirve_a":["AIA-006"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-006","marco":"ai-act","referencia":{"es":"artículo 6","en":"Article 6"},"titulo":{"es":"Reglas de clasificación de sistemas de alto riesgo","en":"Classification rules for high-risk AI systems"}}]},{"id":"F-CLS-4","paquete":"aia-clasificacion","destinatario":"responsable","texto":{"es":"¿Se acoge a la excepción del artículo 6, apartado 3, y con qué fundamento?","en":"Are you relying on the Article 6(3) derogation, and on what basis?"},"ayuda":{"es":"La excepción solo cabe si el sistema no plantea un riesgo importante de perjuicio para la salud, la seguridad o los derechos fundamentales, y el Reglamento cierra la puerta cuando el sistema realiza perfilado de personas físicas: ahi no cabe excepción nunca. Tiene que documentar la evaluación ANTES de comercializar y registrarla. Si se acoge y no lo documenta, no se ha acogido.","en":"The derogation only applies if the system does not pose a significant risk of harm to health, safety or fundamental rights, and the Regulation shuts the door when the system performs profiling of natural persons: there the derogation never applies. You must document the assessment BEFORE placing on the market and register it. If you rely on it and do not document it, you have not relied on it."},"formato":"texto_largo","vigencia_dias":180,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["AIA-006"],"salta_si_cubre":[],"si":{"pregunta":"F-CLS-3","distinto_de":"ninguno"},"produce":null,"por_que":[{"id":"AIA-006","marco":"ai-act","referencia":{"es":"artículo 6","en":"Article 6"},"titulo":{"es":"Reglas de clasificación de sistemas de alto riesgo","en":"Classification rules for high-risk AI systems"}}]},{"id":"F-CLS-5","paquete":"aia-clasificacion","destinatario":"responsable","texto":{"es":"¿Interactúa su sistema directamente con personas, genera o manipula contenido sintético, o infiere emociones o categorías biométricas?","en":"Does your system interact directly with people, generate or manipulate synthetic content, or infer emotions or biometric categories?"},"ayuda":{"es":"El artículo 50 se aplica desde el 2 de agosto de 2026 y no depende del alto riesgo: ata también a sistemas de riesgo limitado. Cada una de estas cuatro situaciones arrastra una obligación de transparencia distinta y Actaira comprueba en el código las que se pueden comprobar.","en":"Article 50 applies from 2 August 2026 and does not depend on high-risk status: it also binds limited-risk systems. Each of these four situations carries a different transparency duty and Actaira checks in code the ones that can be checked."},"formato":"eleccion","vigencia_dias":180,"exige":{"excluyente":"ninguna","minimo_elementos":1},"opciones":[{"valor":"interaccion","es":"Interactúa directamente con personas físicas","en":"Interacts directly with natural persons"},{"valor":"sintetico","es":"Genera o manipula imagen, sonido, video o texto sintéticos","en":"Generates or manipulates synthetic image, audio, video or text"},{"valor":"emociones","es":"Reconoce emociones o hace categorización biométrica","en":"Performs emotion recognition or biometric categorisation"},{"valor":"ultrasuplantacion","es":"Produce ultrasuplantaciones o texto publicado para informar al público","en":"Produces deep fakes or text published to inform the public"},{"valor":"ninguna","es":"Ninguna de las cuatro","en":"None of the four"}],"sirve_a":["AIA-050"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-050","marco":"ai-act","referencia":{"es":"artículo 50","en":"Article 50"},"titulo":{"es":"Obligaciones de transparencia","en":"Transparency obligations"}}]},{"id":"F-CNF-1","paquete":"aia-conformidad","destinatario":"responsable","texto":{"es":"¿Trata el sistema datos personales?","en":"Does the system process personal data?"},"ayuda":{"es":"El punto 5 del Anexo V solo entra si la respuesta es si, y entonces obliga a declarar la conformidad con el RGPD, con el Reglamento 2018/1725 y con la Directiva 2016/680. Si contesta que si, esa declaración la está haciendo usted, no Actaira: aquí solo se comprueba que el texto esté y que alguien lo firme.","en":"Point 5 of Annex V only applies if the answer is yes, and it then requires declaring conformity with the GDPR, with Regulation 2018/1725 and with Directive 2016/680. If you answer yes, that declaration is yours, not Actaira's: here we only check that the text is there and that someone signs it."},"formato":"si_no","vigencia_dias":365,"exige":{},"opciones":[],"sirve_a":["AIA-047"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-047","marco":"ai-act","referencia":{"es":"artículo 47","en":"Article 47"},"titulo":{"es":"Declaración UE de conformidad","en":"EU declaration of conformity"}}]},{"id":"F-CNF-2","paquete":"aia-conformidad","destinatario":"responsable","texto":{"es":"¿Qué normas armonizadas u otras especificaciones comunes ha aplicado, total o parcialmente?","en":"Which harmonised standards or other common specifications have you applied, in full or in part?"},"ayuda":{"es":"El punto 6 del Anexo V las pide con referencia. Aplicar una norma armonizada por completo da presunción de conformidad con el requisito que cubre, que es la vía más corta por el artículo 43, así que conviene decir cuál y hasta dónde. Si no ha aplicado ninguna, escríbalo: 'ninguna' es una respuesta válida y no impide la declaración.","en":"Point 6 of Annex V asks for them with a reference. Applying a harmonised standard in full gives presumption of conformity with the requirement it covers, which is the shortest route under Article 43, so it pays to say which and how far. If you have applied none, write that: 'none' is a valid answer and does not prevent the declaration."},"formato":"lista","vigencia_dias":365,"exige":{"minimo_elementos":1},"opciones":[],"sirve_a":["AIA-047","AIA-043"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-047","marco":"ai-act","referencia":{"es":"artículo 47","en":"Article 47"},"titulo":{"es":"Declaración UE de conformidad","en":"EU declaration of conformity"}},{"id":"AIA-043","marco":"ai-act","referencia":{"es":"artículo 43","en":"Article 43"},"titulo":{"es":"Evaluación de la conformidad","en":"Conformity assessment"}}]},{"id":"F-CNF-3","paquete":"aia-conformidad","destinatario":"responsable","texto":{"es":"Nombre y número de identificación del organismo notificado, procedimiento seguido y certificado expedido.","en":"Name and identification number of the notified body, procedure followed and certificate issued."},"ayuda":{"es":"Solo se pregunta si antes ha dicho que su vía de evaluación pasa por un organismo notificado. El número de identificación es el de cuatro dígitos que figura en la base de datos NANDO, no el nombre comercial.","en":"Only asked if you have said your assessment route goes through a notified body. The identification number is the four-digit one in the NANDO database, not the trade name."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":60},"opciones":[],"sirve_a":["AIA-043","AIA-047"],"salta_si_cubre":[],"si":{"pregunta":"F-PRV-3","contiene":"notificado"},"produce":null,"por_que":[{"id":"AIA-043","marco":"ai-act","referencia":{"es":"artículo 43","en":"Article 43"},"titulo":{"es":"Evaluación de la conformidad","en":"Conformity assessment"}},{"id":"AIA-047","marco":"ai-act","referencia":{"es":"artículo 47","en":"Article 47"},"titulo":{"es":"Declaración UE de conformidad","en":"EU declaration of conformity"}}]},{"id":"F-CNF-4","paquete":"aia-conformidad","destinatario":"direccion","texto":{"es":"Lugar y fecha de expedición, nombre y cargo de quien firma, y persona en cuyo nombre firma.","en":"Place and date of issue, name and position of the signatory, and the person on whose behalf they sign."},"ayuda":{"es":"Este es el punto 8 y es la firma. Mientras esta respuesta no exista, Actaira emite el documento con la palabra BORRADOR en el encabezado y no la quita por ninguna otra vía. Los puntos 3 y 4 del Anexo V son afirmaciones que hace usted bajo su exclusiva responsabilidad; firmar aquí es asumirlas.","en":"This is point 8 and it is the signature. While this answer does not exist, Actaira emits the document with the word DRAFT in its header and removes it by no other means. Points 3 and 4 of Annex V are affirmations you make under your sole responsibility; signing here is assuming them."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":80},"opciones":[],"sirve_a":["AIA-047"],"salta_si_cubre":[],"si":null,"produce":"declaracion-ue-conformidad","por_que":[{"id":"AIA-047","marco":"ai-act","referencia":{"es":"artículo 47","en":"Article 47"},"titulo":{"es":"Declaración UE de conformidad","en":"EU declaration of conformity"}}]},{"id":"F-DPL-1","paquete":"aia-despliegue","destinatario":"responsable","texto":{"es":"Antes de poner el sistema en servicio en el lugar de trabajo, ¿cómo informaron a los trabajadores afectados y a sus representantes, cuándo, y bajo qué legislación nacional?","en":"Before putting the system into service in the workplace, how did you inform the affected workers and their representatives, when, and under which national law?"},"ayuda":{"es":"Artículo 26(7). Hacen falta cuatro cosas y las cuatro son comprobables: el Estado miembro cuya legislación aplica, el cauce usado (comité de empresa, representación sindical, comunicación directa), la fecha —que tiene que ser ANTERIOR a la puesta en servicio, y es el detalle que más se incumple sin querer— y qué se les dijo del sistema.\n\nActaira no juzga si el cauce basta: eso depende de la legislación laboral de su Estado miembro y lo decide quien la conozca. Lo que sí queda registrado con su fecha es que usted afirmó haberlo hecho de esta manera, y eso es lo que un inspector va a contrastar.\n\nSi el sistema no se usa en un lugar de trabajo, dígalo y por qué: el apartado no le ata y el expediente lo dirá en vez de dejar un hueco.","en":"Article 26(7). Four things are needed and all four are checkable: the Member State whose law applies, the channel used (works council, union representation, direct communication), the date —which must be BEFORE putting into service, and is the detail most often missed unintentionally— and what they were told about the system.\n\nActaira does not judge whether the channel suffices: that depends on your Member State's labour law and is decided by someone who knows it. What is recorded, with its date, is that you stated you did it this way, and that is what an inspector will check against.\n\nIf the system is not used in a workplace, say so and why: the paragraph does not bind you and the dossier will say so instead of leaving a gap."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["AIA-026"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-026","marco":"ai-act","referencia":{"es":"artículo 26","en":"Article 26"},"titulo":{"es":"Obligaciones de los responsables del despliegue","en":"Obligations of deployers"}}]},{"id":"F-DPL-2","paquete":"aia-despliegue","destinatario":"responsable","texto":{"es":"Cuando el sistema se usa para tomar o apoyar una decisión sobre una persona, ¿cómo se le informa de ello, y dónde puede verse ese aviso?","en":"When the system is used to take or support a decision about a person, how are they informed of it, and where can that notice be seen?"},"ayuda":{"es":"Artículo 26(11). No pregunta si tienen una política que lo diga: pregunta por el aviso que ve la persona. Dé la ubicación concreta —la pantalla, la carta, la cláusula— y el texto o un enlace a él. Un aviso que sólo existe en un procedimiento interno no informa a nadie.\n\nSi el sistema no decide sobre personas ni apoya esas decisiones, dígalo y describa qué hace: es una respuesta legítima y el expediente la recogerá como tal.","en":"Article 26(11). It does not ask whether you have a policy saying so: it asks about the notice the person sees. Give the concrete location —the screen, the letter, the clause— and the text or a link to it. A notice that exists only in an internal procedure informs nobody.\n\nIf the system neither decides about people nor supports such decisions, say so and describe what it does: that is a legitimate answer and the dossier will record it as such."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":150},"opciones":[],"sirve_a":["AIA-026"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-026","marco":"ai-act","referencia":{"es":"artículo 26","en":"Article 26"},"titulo":{"es":"Obligaciones de los responsables del despliegue","en":"Obligations of deployers"}}]},{"id":"F-PRV-1","paquete":"aia-proveedor","destinatario":"direccion","texto":{"es":"¿Tiene implantado un sistema de gestión de la calidad conforme al artículo 17, y en qué documento consta?","en":"Do you have a quality management system in place under Article 17, and in which document is it recorded?"},"ayuda":{"es":"El artículo 17 enumera trece elementos que ese sistema tiene que contener por escrito, entre ellos la estrategia de cumplimiento normativo, las técnicas de diseño y verificación, los procedimientos de gestión de datos, el sistema de gestión de riesgos del artículo 9, la vigilancia poscomercialización del artículo 72 y la notificación de incidentes del artículo 73. Un sistema de gestión certificado en la ISO 42001 cubre buena parte, pero no todo: el Reglamento pide cosas que la norma no pide. Actaira le dice cuáles faltan.","en":"Article 17 lists thirteen elements that system must contain in writing, among them the regulatory compliance strategy, the design and verification techniques, the data management procedures, the Article 9 risk management system, the Article 72 post-market monitoring and the Article 73 incident reporting. A management system certified to ISO 42001 covers much of it, but not all: the Regulation asks for things the standard does not. Actaira tells you which are missing."},"formato":"artefacto","vigencia_dias":365,"exige":{},"opciones":[],"sirve_a":["AIA-016","AIA-017","A.10.2"],"salta_si_cubre":[],"si":null,"produce":"sistema-de-calidad","por_que":[{"id":"AIA-016","marco":"ai-act","referencia":{"es":"artículo 16","en":"Article 16"},"titulo":{"es":"Obligaciones de los proveedores de sistemas de IA de alto riesgo","en":"Obligations of providers of high-risk AI systems"}},{"id":"AIA-017","marco":"ai-act","referencia":{"es":"artículo 17","en":"Article 17"},"titulo":{"es":"Sistema de gestión de la calidad","en":"Quality management system"}},{"id":"A.10.2","marco":"iso42001","referencia":{"es":"Anexo A, A.10.2","en":"Annex A, A.10.2"},"titulo":{"es":"Asignación de responsabilidades","en":"Allocating responsibilities"}}]},{"id":"F-PRV-2","paquete":"aia-proveedor","destinatario":"responsable","texto":{"es":"¿Qué nombre, nombre comercial registrado y dirección de contacto figuran en el sistema o en su embalaje o documentación?","en":"Which name, registered trade name and contact ad
