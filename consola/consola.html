dress appear on the system or on its packaging or documentation?"},"ayuda":{"es":"El artículo 16.b lo pide literalmente. Parece trivial y es de los incumplimientos más fáciles de detectar desde fuera, porque basta mirar el producto.","en":"Article 16(b) requires it literally. It looks trivial and it is one of the easiest failures to spot from outside, because you only have to look at the product."},"formato":"texto_corto","vigencia_dias":365,"exige":{"minimo_caracteres":30},"opciones":[],"sirve_a":["AIA-016"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-016","marco":"ai-act","referencia":{"es":"artículo 16","en":"Article 16"},"titulo":{"es":"Obligaciones de los proveedores de sistemas de IA de alto riesgo","en":"Obligations of providers of high-risk AI systems"}}]},{"id":"F-PRV-3","paquete":"aia-proveedor","destinatario":"direccion","texto":{"es":"¿Qué procedimiento de evaluación de la conformidad le corresponde y en qué estado está?","en":"Which conformity assessment procedure applies to you and what is its status?"},"ayuda":{"es":"El artículo 43 distingue control interno (Anexo VI) de la intervención de un organismo notificado (Anexo VII). La regla práctica: los sistemas del Anexo III suelen ir por control interno salvo el punto 1 de biometría, y los del Anexo I siguen el procedimiento de su propia legislación sectorial. Si aplica una norma armonizada por completo, la vía suele ser más corta.","en":"Article 43 distinguishes internal control (Annex VI) from notified body involvement (Annex VII). The practical rule: Annex III systems usually go through internal control except biometrics in point 1, and Annex I systems follow their own sector legislation's procedure. If you apply a harmonised standard in full, the route is usually shorter."},"formato":"eleccion","vigencia_dias":365,"exige":{},"opciones":[{"valor":"interno","es":"Control interno, Anexo VI","en":"Internal control, Annex VI"},{"valor":"notificado","es":"Organismo notificado, Anexo VII","en":"Notified body, Annex VII"},{"valor":"sectorial","es":"El de la legislación de armonización aplicable","en":"That of the applicable harmonisation legislation"},{"valor":"pendiente","es":"Todavía no determinado","en":"Not yet determined"}],"sirve_a":["AIA-043"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-043","marco":"ai-act","referencia":{"es":"artículo 43","en":"Article 43"},"titulo":{"es":"Evaluación de la conformidad","en":"Conformity assessment"}}]},{"id":"F-PRV-4","paquete":"aia-proveedor","destinatario":"direccion","texto":{"es":"¿Quién firma la declaración UE de conformidad y desde qué fecha está emitida?","en":"Who signs the EU declaration of conformity and from what date is it issued?"},"ayuda":{"es":"El artículo 47 exige que el proveedor la redacte, la firme, la mantenga a disposición de las autoridades diez años y asuma con ella la responsabilidad del cumplimiento. El Anexo V fija su contenido. Actaira la genera desde el expediente y usted la firma: lo que no puede hacer ningún software es asumir la responsabilidad por usted.","en":"Article 47 requires the provider to draw it up, sign it, keep it available to authorities for ten years and thereby assume responsibility for compliance. Annex V fixes its content. Actaira generates it from the file and you sign it: what no software can do is assume the responsibility for you."},"formato":"persona","vigencia_dias":365,"exige":{},"opciones":[],"sirve_a":["AIA-047"],"salta_si_cubre":[],"si":null,"produce":"declaracion-ue-conformidad","por_que":[{"id":"AIA-047","marco":"ai-act","referencia":{"es":"artículo 47","en":"Article 47"},"titulo":{"es":"Declaración UE de conformidad","en":"EU declaration of conformity"}}]},{"id":"F-PRV-5","paquete":"aia-proveedor","destinatario":"responsable","texto":{"es":"¿Está el sistema registrado en la base de datos de la UE del artículo 71, y con qué identificador?","en":"Is the system registered in the EU database of Article 71, and under which identifier?"},"ayuda":{"es":"El artículo 49 obliga a registrarse antes de comercializar o poner en servicio. Los sistemas del Anexo III que se acogen a la excepción del artículo 6.3 también se registran, precisamente para que conste que se acogieron. Si aún no existe, escriba 'pendiente' y la fecha prevista.","en":"Article 49 requires registration before placing on the market or putting into service. Annex III systems relying on the Article 6(3) derogation also register, precisely so that the reliance is on record. If it does not exist yet, write 'pending' and the expected date."},"formato":"texto_corto","vigencia_dias":90,"exige":{"minimo_caracteres":5},"opciones":[],"sirve_a":["AIA-049"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-049","marco":"ai-act","referencia":{"es":"artículo 49","en":"Article 49"},"titulo":{"es":"Registro en la base de datos de la UE","en":"Registration in the EU database"}}]},{"id":"F-PRV-6","paquete":"aia-proveedor","destinatario":"responsable","texto":{"es":"¿Qué información entrega a sus clientes o responsables del despliegue, y cómo les comunica un cambio en el sistema?","en":"What information do you hand to your customers or deployers, and how do you notify them of a change in the system?"},"ayuda":{"es":"El artículo 13 fija que tienen que contener las instrucciones de uso, y el artículo 25 establece que si un tercero modifica sustancialmente su sistema pasa a ser el el proveedor. La línea entre los dos se dibuja en el contrato: si no dice quién responde de qué, responderá usted.","en":"Article 13 fixes what the instructions for use must contain, and Article 25 establishes that a third party who substantially modifies your system becomes the provider. The line between them is drawn in the contract: if it does not say who answers for what, you will."},"formato":"texto_largo","vigencia_dias":180,"exige":{"minimo_caracteres":150},"opciones":[],"sirve_a":["AIA-016","AIA-025","A.10.4"],"salta_si_cubre":["ACT-13-INSTRUCCIONES"],"si":null,"produce":null,"por_que":[{"id":"AIA-016","marco":"ai-act","referencia":{"es":"artículo 16","en":"Article 16"},"titulo":{"es":"Obligaciones de los proveedores de sistemas de IA de alto riesgo","en":"Obligations of providers of high-risk AI systems"}},{"id":"AIA-025","marco":"ai-act","referencia":{"es":"artículo 25","en":"Article 25"},"titulo":{"es":"Responsabilidades a lo largo de la cadena de valor de la IA","en":"Responsibilities along the AI value chain"}},{"id":"A.10.4","marco":"iso42001","referencia":{"es":"Anexo A, A.10.4","en":"Annex A, A.10.4"},"titulo":{"es":"Clientes","en":"Customers"}}]},{"id":"F-SIS-1","paquete":"aia-sistema","destinatario":"tecnico","texto":{"es":"¿Quién supervisa este sistema, qué formación tiene para hacerlo y qué puede hacer cuando algo va mal?","en":"Who oversees this system, what training do they have for it, and what can they do when something goes wrong?"},"ayuda":{"es":"Actaira comprueba en el código si existe la vía de anulación, la de parada y la de revisión humana. Lo que no puede comprobar es si la persona que las tiene las entiende, y el artículo 14 pide exactamente eso: que quien supervisa comprenda las capacidades y limitaciones del sistema, sea consciente de la propensión a confiar automáticamente en su salida, y pueda decidir no usarlo. Esa parte se firma, no se deduce.","en":"Actaira checks in code whether an override path, a stop path and a human review path exist. What it cannot check is whether the person holding them understands them, and Article 14 asks exactly that: that the overseer understands the system's capacities and limitations, is aware of automation bias, and is able to decide not to use it. That part is signed, not inferred."},"formato":"texto_largo","vigencia_dias":180,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["AIA-014"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-014","marco":"ai-act","referencia":{"es":"artículo 14","en":"Article 14"},"titulo":{"es":"Vigilancia humana","en":"Human oversight"}}]},{"id":"F-SIS-2","paquete":"aia-sistema","destinatario":"tecnico","texto":{"es":"¿De dónde salen los datos de entrenamiento, validación y prueba, y qué derecho tiene a usarlos?","en":"Where do the training, validation and test data come from, and what right do you have to use them?"},"ayuda":{"es":"El artículo 10 pide prácticas de gobernanza que cubran el origen, la recogida, el tratamiento previo, las hipótesis, la disponibilidad y la idoneidad. El control A.7.5 de la norma pide procedencia. En la práctica un auditor pregunta dos cosas: de dónde vino cada conjunto y quién le dijo que podía usarlo. La segunda hunde más expedientes que la primera.","en":"Article 10 requires governance practices covering origin, collection, pre-processing, assumptions, availability and suitability. Control A.7.5 of the standard requires provenance. In practice an auditor asks two things: where each dataset came from and who told you that you could use it. The second sinks more files than the first."},"formato":"texto_largo","vigencia_dias":180,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["AIA-010","A.7.3","A.7.5"],"salta_si_cubre":["ACT-10-FICHA"],"si":null,"produce":null,"por_que":[{"id":"AIA-010","marco":"ai-act","referencia":{"es":"artículo 10","en":"Article 10"},"titulo":{"es":"Datos y gobernanza de datos","en":"Data and data governance"}},{"id":"A.7.3","marco":"iso42001","referencia":{"es":"Anexo A, A.7.3","en":"Annex A, A.7.3"},"titulo":{"es":"Adquisición de datos","en":"Acquisition of data"}},{"id":"A.7.5","marco":"iso42001","referencia":{"es":"Anexo A, A.7.5","en":"Annex A, A.7.5"},"titulo":{"es":"Procedencia de los datos","en":"Data provenance"}}]},{"id":"F-SIS-3","paquete":"aia-sistema","destinatario":"tecnico","texto":{"es":"¿Qué examen de posibles sesgos ha hecho sobre esos datos y qué encontró?","en":"What examination of possible biases have you performed on that data and what did you find?"},"ayuda":{"es":"El artículo 10.2.f obliga a examinar posibles sesgos que puedan afectar a la salud, la seguridad o los derechos fundamentales o dar lugar a discriminación prohibida, y la letra g obliga a tomar medidas para detectarlos, prevenirlos y atenuarlos. Un examen que no encontró nada es un resultado válido si dice qué buscó y cómo; 'no hay sesgo' a secas no lo es.","en":"Article 10(2)(f) requires examining possible biases likely to affect health, safety or fundamental rights or lead to prohibited discrimination, and point (g) requires measures to detect, prevent and mitigate them. An examination that found nothing is a valid result if it says what it looked for and how; a bare 'there is no bias' is not."},"formato":"texto_largo","vigencia_dias":180,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["AIA-010","A.7.4"],"salta_si_cubre":["ACT-10-SESGO"],"si":null,"produce":null,"por_que":[{"id":"AIA-010","marco":"ai-act","referencia":{"es":"artículo 10","en":"Article 10"},"titulo":{"es":"Datos y gobernanza de datos","en":"Data and data governance"}},{"id":"A.7.4","marco":"iso42001","referencia":{"es":"Anexo A, A.7.4","en":"Annex A, A.7.4"},"titulo":{"es":"Calidad de los datos para los sistemas de IA","en":"Quality of data for AI systems"}}]},{"id":"F-SIS-4","paquete":"aia-sistema","destinatario":"tecnico","texto":{"es":"¿Durante cuánto tiempo conserva los registros automáticos y dónde?","en":"For how long do you retain the automatically generated logs and where?"},"ayuda":{"es":"El artículo 19 fija un mínimo de seis meses para el proveedor, salvo que otra norma de la Unión o nacional diga otra cosa, y el artículo 26.6 pone al responsable del despliegue el mismo mínimo para los registros bajo su control. Si su política de borrado los limpia a los noventa días, el incumplimiento está en la política, no en el código.","en":"Article 19 sets a minimum of six months for the provider unless other Union or national law says otherwise, and Article 26(6) puts the same minimum on the deployer for logs under their control. If your deletion policy wipes them at ninety days, the breach is in the policy, not in the code."},"formato":"texto_corto","vigencia_dias":365,"exige":{"minimo_caracteres":40,"exige_intervalo":true},"opciones":[],"sirve_a":["AIA-012","AIA-019"],"salta_si_cubre":["ACT-19-RETENCION-DECLARADA"],"si":null,"produce":null,"por_que":[{"id":"AIA-012","marco":"ai-act","referencia":{"es":"artículo 12","en":"Article 12"},"titulo":{"es":"Registro de acontecimientos","en":"Record-keeping"}},{"id":"AIA-019","marco":"ai-act","referencia":{"es":"artículo 19","en":"Article 19"},"titulo":{"es":"Conservación automática de los archivos de registro","en":"Automatically generated logs"}}]},{"id":"F-SIS-5","paquete":"aia-sistema","destinatario":"responsable","texto":{"es":"¿Quién recibe la alerta cuando una métrica de vigilancia cruza su umbral, y en cuánto tiempo actua?","en":"Who receives the alert when a monitoring metric crosses its threshold, and within what time do they act?"},"ayuda":{"es":"Actaira comprueba que el umbral existe en el código y que está atado a una alerta. Lo que le pregunta es el otro extremo del cable: quién está al otro lado y qué hace. Un umbral que dispara a un canal que nadie lee es un umbral que no existe.","en":"Actaira checks that the threshold exists in code and that it is wired to an alert. What it asks you is the other end of the wire: who is on the other side and what they do. A threshold firing into a channel nobody reads is a threshold that does not exist."},"formato":"texto_corto","vigencia_dias":90,"exige":{"minimo_caracteres":60},"opciones":[],"sirve_a":["AIA-072","A.6.2.6"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-072","marco":"ai-act","referencia":{"es":"artículo 72","en":"Article 72"},"titulo":{"es":"Vigilancia poscomercialización","en":"Post-market monitoring"}},{"id":"A.6.2.6","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.6","en":"Annex A, A.6.2.6"},"titulo":{"es":"Operación y seguimiento del sistema de IA","en":"AI system operation and monitoring"}}]},{"id":"F-SIS-6","paquete":"aia-sistema","destinatario":"responsable","texto":{"es":"¿Quién decide si un incidente es grave a efectos del artículo 73, y por qué vía se notifica?","en":"Who decides whether an incident is serious for the purposes of Article 73, and through which channel is it reported?"},"ayuda":{"es":"Los plazos del artículo 73 son cortos y empiezan a correr cuando se establece el vínculo causal entre el sistema y el incidente: quince días como regla general, dos días para una infracción generalizada o un incidente grave según se define en el artículo 3, punto 49, letra b, y diez días en caso de fallecimiento. Si nadie tiene asignada la decisión, el plazo se consume decidiendo quién decide.","en":"The Article 73 deadlines are short and start running once the causal link between the system and the incident is established: fifteen days as a general rule, two days for a widespread infringement or a serious incident as defined in Article 3(49)(b), and ten days in the event of death. If nobody is assigned the decision, the deadline is spent deciding who decides."},"formato":"persona","vigencia_dias":180,"exige":{"minimo_elementos":1},"opciones":[],"sirve_a":["AIA-073"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-073","marco":"ai-act","referencia":{"es":"artículo 73","en":"Article 73"},"titulo":{"es":"Notificación de incidentes graves","en":"Reporting of serious incidents"}}]},{"id":"F-SIS-7","paquete":"aia-sistema","destinatario":"responsable","texto":{"es":"¿Si usted es responsable del despliegue: ha informado a las personas afectadas de qué están sometidas a un sistema de alto riesgo?","en":"If you are a deployer: have you informed the affected persons that they are subject to a high-risk system?"},"ayuda":{"es":"El artículo 26.7 obliga a informar a los representantes de los trabajadores y a los trabajadores afectados antes de poner en servicio un sistema de alto riesgo en el lugar de trabajo. El 26.11 obliga a informar a la persona física cuando el sistema se usa para tomar decisiones o asistir en decisiones relacionadas con ella. Son dos avisos distintos a dos destinatarios distintos.","en":"Article 26(7) requires informing workers' representatives and affected workers before putting a high-risk system into service in the workplace. Article 26(11) requires informing the natural person when the system is used to take or assist in decisions relating to them. These are two different notices to two different recipients."},"formato":"si_no","vigencia_dias":180,"exige":{"exige_justificacion":true},"opciones":[],"sirve_a":["AIA-026"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-026","marco":"ai-act","referencia":{"es":"artículo 26","en":"Article 26"},"titulo":{"es":"Obligaciones de los responsables del despliegue","en":"Obligations of deployers"}}]},{"id":"F-SIS-8","paquete":"aia-sistema","destinatario":"responsable","texto":{"es":"¿Cómo se entera una persona de qué está hablando con una máquina, y dónde consta ese aviso?","en":"How does a person learn they are talking to a machine, and where is that notice recorded?"},"ayuda":{"es":"El artículo 50.1 exime del aviso cuando resulte evidente para una persona razonablemente atenta dadas las circunstancias. Esa exención se invoca mucho y se justifica poco: si se acoge a ella, escriba por que es evidente en su caso.","en":"Article 50(1) waives the notice where it is obvious to a reasonably well-informed person in the circumstances. That waiver is invoked often and justified rarely: if you rely on it, write down why it is obvious in your case."},"formato":"texto_corto","vigencia_dias":180,"exige":{"minimo_caracteres":60},"opciones":[],"sirve_a":["AIA-050"],"salta_si_cubre":["ACT-50-BOT"],"si":{"pregunta":"F-CLS-5","contiene":"interaccion"},"produce":null,"por_que":[{"id":"AIA-050","marco":"ai-act","referencia":{"es":"artículo 50","en":"Article 50"},"titulo":{"es":"Obligaciones de transparencia","en":"Transparency obligations"}}]},{"id":"F-SIS-9","paquete":"aia-sistema","destinatario":"tecnico","texto":{"es":"¿Puede este sistema afectar negativamente a menores de dieciocho años o a otros colectivos vulnerables, y qué han hecho al respecto?","en":"Can this system adversely affect persons under eighteen or other vulnerable groups, and what have you done about it?"},"ayuda":{"es":"Es el apartado 9 del artículo 9, y es el que una evaluación de riesgos genérica se salta con más facilidad: no pide un riesgo más, pide mirar a QUIÉN le pasa. Dos cosas concretas. Primera: si el sistema puede alcanzar a menores —porque el servicio es abierto, porque el colectivo evaluado los incluye, porque nadie comprueba la edad—, dígalo aunque no sea su público objetivo; «no van dirigidos a menores» no es lo mismo que «no les alcanza». Segunda: qué otros colectivos pueden quedar peor parados que la media —personas con discapacidad, personas sin dominio del idioma, personas en situación precaría— y qué han medido para saberlo. Si han medido el rendimiento por subgrupos, cítelo con sus cifras. Si la respuesta es que no afecta a ninguno, diga en qué se apoya: esa respuesta también hay que sostenerla, y es la que más se da sin mirar.","en":"This is Article 9(9), and it is the one a generic risk assessment skips most easily: it does not ask for one more risk, it asks you to look at WHO it happens to. Two concrete things. First: if the system can reach minors —because the service is open, because the assessed population includes them, because nobody checks age— say so even if they are not your intended audience; «not aimed at minors» is not the same as «does not reach them». Second: which other groups may come off worse than average —people with disabilities, people without command of the language, people in precarious situations— and what you measured to know. If you measured performance by subgroup, cite it with the figures. If the answer is that it affects none, say what that rests on: that answer also has to be supported, and it is the one most often given without looking."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["AIA-009"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-009","marco":"ai-act","referencia":{"es":"artículo 9","en":"Article 9"},"titulo":{"es":"Sistema de gestión de riesgos","en":"Risk management system"}}]},{"id":"F-CTX-1","paquete":"iso-contexto","destinatario":"direccion","texto":{"es":"¿Qué cuestiones externas e internas afectan a la capacidad de su organización de conseguir lo que espera de su sistema de gestión de la IA?","en":"Which external and internal issues affect your organization's ability to achieve the intended results of its AI management system?"},"ayuda":{"es":"Nombre las concretas, no las genericas. Externas: que normas le obligan (el propio Reglamento, el RGPD, la normativa sectorial), que hace la competencia, que espera su mercado. Internas: su estructura, sus contratos, su capacidad técnica. La cláusula 4.1 pide además que diga si el cambio climático es una cuestión relevante para usted, y responder que no también es responder.","en":"Name the specific ones, not the generic ones. External: which rules bind you (the Regulation itself, the GDPR, sector rules), what competitors do, what your market expects. Internal: your structure, your contracts, your technical capacity. Clause 4.1 also asks whether climate change is a relevant issue for you, and answering no is also an answer."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["ISO-4.1"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-4.1","marco":"iso42001","referencia":{"es":"cláusula 4.1","en":"clause 4.1"},"titulo":{"es":"Comprensión de la organización y de su contexto","en":"Understanding the organization and its context"}}]},{"id":"F-CTX-2","paquete":"iso-contexto","destinatario":"direccion","texto":{"es":"¿Es el cambio climático una cuestión relevante para su sistema de gestión de la IA?","en":"Is climate change a relevant issue for your AI management system?"},"ayuda":{"es":"La cláusula 4.1 lo pregunta expresamente y un auditor lo buscara. Si entrena modelos grandes o contrata cómputo intensivo, probablemente si. Si responde que no, diga por que en la justificación.","en":"Clause 4.1 asks this expressly and an auditor will look for it. If you train large models or buy intensive compute, probably yes. If you answer no, say why in the justification."},"formato":"si_no","vigencia_dias":365,"exige":{"exige_justificacion":true},"opciones":[],"sirve_a":["ISO-4.1"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-4.1","marco":"iso42001","referencia":{"es":"cláusula 4.1","en":"clause 4.1"},"titulo":{"es":"Comprensión de la organización y de su contexto","en":"Understanding the organization and its context"}}]},{"id":"F-CTX-3","paquete":"iso-contexto","destinatario":"direccion","texto":{"es":"¿Qué papel desempeña su organización respecto de cada sistema de IA: proveedor, responsable del despliegue, importador, distribuidor, o varios a la vez?","en":"What role does your organization play for each AI system: provider, deployer, importer, distributor, or several at once?"},"ayuda":{"es":"Esta respuesta decide la mitad del expediente. El Reglamento ata cosas distintas al proveedor (artículo 16) y al responsable del despliegue (artículo 26), y el artículo 25 convierte al segundo en el primero si pone su marca en el sistema, lo modifica sustancialmente o le cambia la finalidad prevista. Una línea por sistema.","en":"This answer decides half the file. The Regulation binds different things to the provider (Article 16) and to the deployer (Article 26), and Article 25 turns the second into the first if they put their name on the system, substantially modify it, or change its intended purpose. One line per system."},"formato":"lista","vigencia_dias":180,"exige":{"minimo_elementos":1},"opciones":[],"sirve_a":["ISO-4.1","AIA-016","AIA-025"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-4.1","marco":"iso42001","referencia":{"es":"cláusula 4.1","en":"clause 4.1"},"titulo":{"es":"Comprensión de la organización y de su contexto","en":"Understanding the organization and its context"}},{"id":"AIA-016","marco":"ai-act","referencia":{"es":"artículo 16","en":"Article 16"},"titulo":{"es":"Obligaciones de los proveedores de sistemas de IA de alto riesgo","en":"Obligations of providers of high-risk AI systems"}},{"id":"AIA-025","marco":"ai-act","referencia":{"es":"artículo 25","en":"Article 25"},"titulo":{"es":"Responsabilidades a lo largo de la cadena de valor de la IA","en":"Responsibilities along the AI value chain"}}]},{"id":"F-CTX-4","paquete":"iso-contexto","destinatario":"responsable","texto":{"es":"¿Quiénes son las partes interesadas de su sistema de gestión de la IA y qué exige cada una?","en":"Who are the interested parties of your AI management system and what does each of them require?"},"ayuda":{"es":"Clientes, personas afectadas por las decisiones del sistema, empleados, el regulador, sus proveedores de modelos. Por cada una, el requisito concreto: no vale 'cumplir la ley'. La cláusula 4.2 pide además decir cuáles de esos requisitos va a atender el sistema de gestión y cuáles no.","en":"Customers, people affected by the system's decisions, employees, the regulator, your model suppliers. For each one, the concrete requirement: 'comply with the law' does not count. Clause 4.2 also asks which of those requirements the management system will address and which it will not."},"formato":"lista","vigencia_dias":365,"exige":{"minimo_elementos":3},"opciones":[],"sirve_a":["ISO-4.2"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-4.2","marco":"iso42001","referencia":{"es":"cláusula 4.2","en":"clause 4.2"},"titulo":{"es":"Comprensión de las necesidades y expectativas de las partes interesadas","en":"Understanding the needs and expectations of interested parties"}}]},{"id":"F-CTX-5","paquete":"iso-contexto","destinatario":"direccion","texto":{"es":"¿Cuál es el alcance de su sistema de gestión de la IA: qué sistemas, qué unidades, qué ubicaciones, y qué queda fuera?","en":"What is the scope of your AI management system: which systems, which units, which locations, and what is left out?"},"ayuda":{"es":"Es información documentada obligatoria y el primer folio que pide un auditor. Lo que más se juega aquí es lo que queda FUERA: un alcance que excluye algo tiene que decir por que, y esa exclusión tiene que aguantar la pregunta de por que ese sistema no estaba dentro.","en":"This is mandatory documented information and the first page an auditor asks for. What matters most is what is left OUT: a scope that excludes something must say why, and that exclusion must survive the question of why that system was not inside."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["ISO-4.3"],"salta_si_cubre":[],"si":null,"produce":"alcance-sgia","por_que":[{"id":"ISO-4.3","marco":"iso42001","referencia":{"es":"cláusula 4.3","en":"clause 4.3"},"titulo":{"es":"Determinación del alcance del sistema de gestión de la IA","en":"Determining the scope of the AI management system"}}]},{"id":"F-CTX-6","paquete":"iso-contexto","destinatario":"responsable","texto":{"es":"¿Qué procesos componen su sistema de gestión de la IA y cómo se relacionan entre si?","en":"Which processes make up your AI management system and how do they interact?"},"ayuda":{"es":"Un diagrama en prosa vale. Lo que se comprueba es que el riesgo entra por algún sitio, se trata en otro, se mide en un tercero y se revisa en un cuarto, y que cada paso tiene dueno.","en":"A diagram in prose is fine. What gets checked is that risk enters somewhere, is treated somewhere else, is measured in a third place and reviewed in a fourth, and that each step has an owner."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":150},"opciones":[],"sirve_a":["ISO-4.4"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-4.4","marco":"iso42001","referencia":{"es":"cláusula 4.4","en":"clause 4.4"},"titulo":{"es":"Sistema de gestión de la IA","en":"AI management system"}}]},{"id":"F-DES-1","paquete":"iso-desempeno","destinatario":"responsable","texto":{"es":"¿Qué se mide de sus sistemas de IA, con qué método, cada cuánto, y quién analiza el resultado?","en":"What is measured on your AI systems, with which method, how often, and who analyses the result?"},"ayuda":{"es":"La cláusula 9.1 pide las cuatro cosas por separado y además que haya evidencia documentada de los resultados. Si tiene métricas de exactitud o de deriva calculadas en su repositorio, Actaira las encuentra y no le pregunta por ellas; lo que si le va a pedir siempre es quién mira el número cuando salta, porque eso no está en el código.","en":"Clause 9.1 asks for all four separately and additionally requires documented evidence of the results. If you have accuracy or drift metrics computed in your repository, Actaira finds them and does not ask; what it will always ask is who looks at the number when it fires, because that is not in the code."},"formato":"texto_largo","vigencia_dias":180,"exige":{"minimo_caracteres":150},"opciones":[],"sirve_a":["ISO-9.1","A.6.2.6"],"salta_si_cubre":["ACT-15-EVALS","ACT-72-DRIFT"],"si":null,"produce":null,"por_que":[{"id":"ISO-9.1","marco":"iso42001","referencia":{"es":"cláusula 9.1","en":"clause 9.1"},"titulo":{"es":"Seguimiento, medición, análisis y evaluación","en":"Monitoring, measurement, analysis and evaluation"}},{"id":"A.6.2.6","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.6","en":"Annex A, A.6.2.6"},"titulo":{"es":"Operación y seguimiento del sistema de IA","en":"AI system operation and monitoring"}}]},{"id":"F-DES-2","paquete":"iso-desempeno","destinatario":"direccion","texto":{"es":"Aporte su programa de auditoría interna: frecuencia, métodos, responsables y cómo se garantiza la imparcialidad del auditor.","en":"Provide your internal audit programme: frequency, methods, responsibilities and how the auditor's impartiality is ensured."},"ayuda":{"es":"La imparcialidad es la parte que más se suspende: quien audita no puede auditar su propio trabajo. En una organización pequeña eso suele significar auditoría cruzada entre áreas o un externo. La cláusula 9.2.2 exige además que los resultados se comuniquen a los directivos pertinentes y que haya evidencia documentada de la ejecución del programa.","en":"Impartiality is the part most often failed: an auditor cannot audit their own work. In a small organization that usually means cross-area audits or an external auditor. Clause 9.2.2 further requires results to be reported to relevant managers and documented evidence of the programme's implementation."},"formato":"artefacto","vigencia_dias":365,"exige":{},"opciones":[],"sirve_a":["ISO-9.2.1","ISO-9.2.2"],"salta_si_cubre":[],"si":null,"produce":"programa-de-auditoria","por_que":[{"id":"ISO-9.2.1","marco":"iso42001","referencia":{"es":"cláusula 9.2.1","en":"clause 9.2.1"},"titulo":{"es":"Auditoría interna. Generalidades","en":"Internal audit. General"}},{"id":"ISO-9.2.2","marco":"iso42001","referencia":{"es":"cláusula 9.2.2","en":"clause 9.2.2"},"titulo":{"es":"Programa de auditoría interna","en":"Internal audit programme"}}]},{"id":"F-DES-3","paquete":"iso-desempeno","destinatario":"direccion","texto":{"es":"¿Cuándo fue la última revisión por la dirección y qué se decidió en ella?","en":"When was the last management review and what was decided in it?"},"ayuda":{"es":"La cláusula 9.3.2 fija las entradas obligatorias: estado de las acciones de la revisión anterior, cambios en el contexto y en las partes interesadas, desempeño del sistema con tendencias en no conformidades, resultados de seguimiento y de auditoría, y oportunidades de mejora. La 9.3.3 exige que los resultados incluyan decisiones. Un acta sin decisiones no cierra esta cláusula.","en":"Clause 9.3.2 fixes the mandatory inputs: status of actions from the previous review, changes in context and interested parties, system performance with trends in nonconformities, monitoring and audit results, and improvement opportunities. Clause 9.3.3 requires the results to include decisions. Minutes without decisions do not close this clause."},"formato":"fecha","vigencia_dias":365,"exige":{"exige_intervalo":true},"opciones":[],"sirve_a":["ISO-9.3.1","ISO-9.3.2","ISO-9.3.3"],"salta_si_cubre":[],"si":null,"produce":"revision-por-la-direccion","por_que":[{"id":"ISO-9.3.1","marco":"iso42001","referencia":{"es":"cláusula 9.3.1","en":"clause 9.3.1"},"titulo":{"es":"Revisión por la dirección. Generalidades","en":"Management review. General"}},{"id":"ISO-9.3.2","marco":"iso42001","referencia":{"es":"cláusula 9.3.2","en":"clause 9.3.2"},"titulo":{"es":"Entradas de la revisión por la dirección","en":"Management review inputs"}},{"id":"ISO-9.3.3","marco":"iso42001","referencia":{"es":"cláusula 9.3.3","en":"clause 9.3.3"},"titulo":{"es":"Resultados de la revisión por la dirección","en":"Management review results"}}]},{"id":"F-DES-L1","paquete":"iso-desempeno","destinatario":"tecnico","texto":{"es":"¿Qué registra el sistema de cada decisión que toma, cuánto tiempo se conserva, y quién puede consultarlo?","en":"What does the system record of each decision it makes, how long is it kept, and who can consult it?"},"ayuda":{"es":"Control A.6.2.8, y es hermano del artículo 12 del Reglamento. Actaira puede ver en el código si hay una llamada de registro junto a la llamada al modelo; lo que no puede ver es si lo que se registra basta para reconstruir una decisión seis meses después, que es para lo que sirve.\n\nDiga qué campos se guardan (entrada, versión del modelo, salida, umbral aplicado, identificador de la persona afectada si procede), cuánto se conservan y quién los puede leer. El período de conservación importa en las dos direcciones: demasiado corto y no se puede investigar un incidente, demasiado largo y se está guardando de más sobre personas.","en":"Control A.6.2.8, sibling of Article 12 of the Regulation. Actaira can see in the code whether there is a logging call next to the model call; what it cannot see is whether what is logged suffices to reconstruct a decision six months later, which is what it is for.\n\nSay which fields are stored (input, model version, output, threshold applied, identifier of the affected person where relevant), how long they are kept and who can read them. The retention period matters in both directions: too short and an incident cannot be investigated, too long and you are keeping too much about people."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["A.6.2.8"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"A.6.2.8","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.8","en":"Annex A, A.6.2.8"},"titulo":{"es":"Registro de acontecimientos del sistema de IA","en":"AI system record keeping"}}]},{"id":"F-LID-1","paquete":"iso-liderazgo","destinatario":"direccion","texto":{"es":"Aporte la política de IA aprobada por la alta dirección.","en":"Provide the AI policy approved by top management."},"ayuda":{"es":"La cláusula 5.2 exige cuatro cosas de ella: que sea apropiada al propósito de la organización, que sirva de marco para fijar los objetivos de IA, que incluya el compromiso de cumplir los requisitos aplicables y que incluya el compromiso de mejora continua. Además tiene que estar como información documentada, comunicada dentro y disponible fuera cuando proceda. Si no la tiene, Actaira le genera el borrador desde sus respuestas y usted lo aprueba.","en":"Clause 5.2 requires four things of it: that it be appropriate to the organization's purpose, that it frame the setting of AI objectives, that it include a commitment to meet applicable requirements, and that it include a commitment to continual improvement. It must also exist as documented information, be communicated internally and be available externally as appropriate. If you do not have one, Actaira drafts it from your answers and you approve it."},"formato":"artefacto","vigencia_dias":365,"exige":{},"opciones":[],"sirve_a":["ISO-5.2","A.2.2"],"salta_si_cubre":[],"si":null,"produce":"politica-de-ia","por_que":[{"id":"ISO-5.2","marco":"iso42001","referencia":{"es":"cláusula 5.2","en":"clause 5.2"},"titulo":{"es":"Política de IA","en":"AI policy"}},{"id":"A.2.2","marco":"iso42001","referencia":{"es":"Anexo A, A.2.2","en":"Annex A, A.2.2"},"titulo":{"es":"Política de IA","en":"AI policy"}}]},{"id":"F-LID-2","paquete":"iso-liderazgo","destinatario":"direccion","texto":{"es":"¿Cada cuánto se revisa la política de IA y cuándo se revisó por última vez?","en":"How often is the AI policy reviewed and when was it last reviewed?"},"ayuda":{"es":"Una política de IA firmada hace tres años y no tocada desde entonces es un hallazgo, no una evidencia. La fecha que ponga aquí arranca el reloj: Actaira la marcará RANCIA cuando pase el intervalo que usted mismo declare.","en":"An AI policy signed three years ago and untouched since is a finding, not evidence. The date you enter here starts the clock: Actaira will mark it STALE once the interval you declare has passed."},"formato":"fecha","vigencia_dias":365,"exige":{"exige_intervalo":true},"opciones":[],"sirve_a":["A.2.4","A.2.4"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"A.2.4","marco":"iso42001","referencia":{"es":"Anexo A, A.2.4","en":"Annex A, A.2.4"},"titulo":{"es":"Revisión de la política de IA","en":"Review of the AI policy"}},{"id":"A.2.4","marco":"iso42001","referencia":{"es":"Anexo A, A.2.4","en":"Annex A, A.2.4"},"titulo":{"es":"Revisión de la política de IA","en":"Review of the AI policy"}}]},{"id":"F-LID-3","paquete":"iso-liderazgo","destinatario":"direccion","texto":{"es":"¿Quién tiene asignada la responsabilidad de qué el sistema de gestión de la IA cumpla, y quién informa de su desempeño a la alta dirección?","en":"Who is assigned responsibility for the AI management system's conformity, and who reports its performance to top management?"},"ayuda":{"es":"La cláusula 5.3 pide esas dos asignaciones con nombre y autoridad, no un departamento. Pueden recaer en la misma persona. Si nadie tiene la segunda, la revisión por la dirección de la cláusula 9.3 no tiene de dónde salir.","en":"Clause 5.3 requires those two assignments by name and authority, not a department. They may be the same person. If nobody holds the second, the management review of clause 9.3 has nothing to feed on."},"formato":"persona","vigencia_dias":180,"exige":{"minimo_elementos":1},"opciones":[],"sirve_a":["ISO-5.3","A.3.2","AIA-016","AIA-017"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-5.3","marco":"iso42001","referencia":{"es":"cláusula 5.3","en":"clause 5.3"},"titulo":{"es":"Funciones, responsabilidades y autoridades","en":"Roles, responsibilities and authorities"}},{"id":"A.3.2","marco":"iso42001","referencia":{"es":"Anexo A, A.3.2","en":"Annex A, A.3.2"},"titulo":{"es":"Funciones y responsabilidades de IA","en":"AI roles and responsibilities"}},{"id":"AIA-016","marco":"ai-act","referencia":{"es":"artículo 16","en":"Article 16"},"titulo":{"es":"Obligaciones de los proveedores de sistemas de IA de alto riesgo","en":"Obligations of providers of high-risk AI systems"}},{"id":"AIA-017","marco":"ai-act","referencia":{"es":"artículo 17","en":"Article 17"},"titulo":{"es":"Sistema de gestión de la calidad","en":"Quality management system"}}]},{"id":"F-LID-4","paquete":"iso-liderazgo","destinatario":"direccion","texto":{"es":"¿Cómo demuestra la alta dirección su compromiso: qué recursos ha aprobado, en qué procesos de negocio se ha integrado el sistema de gestión, y dónde consta?","en":"How does top management demonstrate commitment: which resources has it approved, into which business processes is the management system integrated, and where is it recorded?"},"ayuda":{"es":"Esta es la cláusula que más actas de reunión consume. Lo que convence a un auditor es una decisión con fecha: un presupuesto aprobado, una contratación, un punto del orden del día de un comite.","en":"This is the clause that consumes the most meeting minutes. What convinces an auditor is a dated decision: an approved budget, a hire, an item on a committee agenda."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":150},"opciones":[],"sirve_a":["ISO-5.1","ISO-7.1"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-5.1","marco":"iso42001","referencia":{"es":"cláusula 5.1","en":"clause 5.1"},"titulo":{"es":"Liderazgo y compromiso","en":"Leadership and commitment"}},{"id":"ISO-7.1","marco":"iso42001","referencia":{"es":"cláusula 7.1","en":"clause 7.1"},"titulo":{"es":"Recursos","en":"Resources"}}]},{"id":"F-LID-5","paquete":"iso-liderazgo","destinatario":"direccion","texto":{"es":"¿Cuáles son sus objetivos de IA, cómo se miden y quién responde de cada uno?","en":"What are your AI objectives, how are they measured and who is accountable for each?"},"ayuda":{"es":"La cláusula 6.2 pide que sean coherentes con la política, medibles si es practicable, que tengan en cuenta los requisitos aplicables, que se sigan, se comuniquen, se actualicen y estén documentados. Por cada objetivo: qué se hará, con qué recursos, quién responde, cuándo estará y cómo se evaluará el resultado.","en":"Clause 6.2 requires them to be consistent with the policy, measurable where practicable, to take applicable requirements into account, and to be monitored, communicated, updated and documented. For each objective: what will be done, with which resources, who is accountable, when it will be complete and how the result will be evaluated."},"formato":"lista","vigencia_dias":365,"exige":{"minimo_elementos":2},"opciones":[],"sirve_a":["ISO-6.2","A.6.1.2","A.9.3"],"salta_si_cubre":[],"si":null,"produce":"objetivos-de-ia","por_que":[{"id":"ISO-6.2","marco":"iso42001","referencia":{"es":"cláusula 6.2","en":"clause 6.2"},"titulo":{"es":"Objetivos de IA y planificación para lograrlos","en":"AI objectives and planning to achieve them"}},{"id":"A.6.1.2","marco":"iso42001","referencia":{"es":"Anexo A, A.6.1.2","en":"Annex A, A.6.1.2"},"titulo":{"es":"Objetivos para el desarrollo responsable","en":"Objectives for responsible development"}},{"id":"A.9.3","marco":"iso42001","referencia":{"es":"Anexo A, A.9.3","en":"Annex A, A.9.3"},"titulo":{"es":"Objetivos para el uso responsable del sistema de IA","en":"Objectives for responsible use of AI system"}}]},{"id":"F-LID-6","paquete":"iso-liderazgo","destinatario":"responsable","texto":{"es":"¿Por qué canal puede una persona de la organización plantear una preocupación sobre un sistema de IA, y qué pasa después?","en":"Through which channel can someone in the organization raise a concern about an AI system, and what happens next?"},"ayuda":{"es":"El control A.3.3 existe porque quien primero ve que un modelo se está portando mal suele ser quien lo opera, no quien lo gobierna. Diga el canal, si admite anonimato, quién lo recibe y en cuánto tiempo se responde.","en":"Control A.3.3 exists because the first person to see a model misbehaving is usually the one operating it, not the one governing it. State the channel, whether it allows anonymity, who receives it and within what time it is answered."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":120},"opciones":[],"sirve_a":["A.3.3","A.3.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"A.3.3","marco":"iso42001","referencia":{"es":"Anexo A, A.3.3","en":"Annex A, A.3.3"},"titulo":{"es":"Comunicación de preocupaciones","en":"Reporting of concerns"}},{"id":"A.3.3","marco":"iso42001","referencia":{"es":"Anexo A, A.3.3","en":"Annex A, A.3.3"},"titulo":{"es":"Comunicación de preocupaciones","en":"Reporting of concerns"}}]},{"id":"F-MEJ-1","paquete":"iso-mejora","destinatario":"responsable","texto":{"es":"¿Qué no conformidades ha registrado y qué acción correctiva tomo en cada una?","en":"Which nonconformities have you recorded and what corrective action did you take for each?"},"ayuda":{"es":"La cláusula 10.2 pide reaccionar, evaluar si hace falta eliminar la causa, comprobar si existen no conformidades similares en otro sitio, implantar la acción, revisar su eficacia y cambiar el sistema de gestión si hace falta. Un registro vacio no es una buena noticia: casi siempre significa que no se registran, no que no ocurren. Si un incidente además entra en el artículo 73 del Reglamento, el plazo de notificación es distinto y mucho más corto.","en":"Clause 10.2 requires reacting, evaluating whether the cause must be eliminated, checking whether similar nonconformities exist elsewhere, implementing the action, reviewing its effectiveness and changing the management system if needed. An empty register is not good news: it almost always means they are not recorded, not that they do not happen. If an incident also falls under Article 73 of the Regulation, the reporting deadline is different and much shorter."},"formato":"lista","vigencia_dias":90,"exige":{"minimo_elementos":0},"opciones":[],"sirve_a":["ISO-10.2","A.8.4","AIA-073"],"salta_si_cubre":[],"si":null,"produce":"registro-de-no-conformidades","por_que":[{"id":"ISO-10.2","marco":"iso42001","referencia":{"es":"cláusula 10.2","en":"clause 10.2"},"titulo":{"es":"No conformidad y acción correctiva","en":"Nonconformity and corrective action"}},{"id":"A.8.4","marco":"iso42001","referencia":{"es":"Anexo A, A.8.4","en":"Annex A, A.8.4"},"titulo":{"es":"Comunicación de incidentes","en":"Communication of incidents"}},{"id":"AIA-073","marco":"ai-act","referencia":{"es":"artículo 73","en":"Article 73"},"titulo":{"es":"Notificación de incidentes graves","en":"Reporting of serious incidents"}}]},{"id":"F-MEJ-2","paquete":"iso-mejora","destinatario":"direccion","texto":{"es":"¿Qué ha mejorado de su sistema de gestión de la IA en el último ciclo y de dónde salió esa mejora?","en":"What have you improved in your AI management system in the last cycle and where did that improvement come from?"},"ayuda":{"es":"La mejora continua de la 10.1 se demuestra con una traza: hallazgo de auditoría, incidente o revisión por la dirección, y el cambio que provocó. Sin origen, una lista de mejoras parece un folleto.","en":"Continual improvement under 10.1 is demonstrated with a trace: an audit finding, an incident or a management review, and the change it caused. Without an origin, a list of improvements reads like a brochure."},"formato":"texto_corto","vigencia_dias":365,"exige":{"minimo_caracteres":100},"opciones":[],"sirve_a":["ISO-10.1"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-10.1","marco":"iso42001","referencia":{"es":"cláusula 10.1","en":"clause 10.1"},"titulo":{"es":"Mejora continua","en":"Continual improvement"}}]},{"id":"F-OPE-1","paquete":"iso-operacion","destinatario":"responsable","texto":{"es":"¿Qué criterios tiene establecidos para los procesos de desarrollo y uso de sus sistemas de IA, y cómo controla que se siguen?","en":"Which criteria have you established for the processes of developing and using your AI systems, and how do you control that they are followed?"},"ayuda":{"es":"La cláusula 8.1 es donde el plan se convierte en práctica: criterios para los procesos, control de los procesos contra esos criterios, y seguimiento de si los controles funcionan con acción correctiva si no. Una puerta de integración continua que bloquea el despliegue cuando falta algo es exactamente esto, y Actaira la lee sin preguntarle.","en":"Clause 8.1 is where the plan becomes practice: criteria for the processes, control of the processes against those criteria, and monitoring of whether the controls work with corrective action if they do not. A CI gate that blocks deployment when something is missing is exactly this, and Actaira reads it without asking you."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":150},"opciones":[],"sirve_a":["ISO-8.1"],"salta_si_cubre":["ACT-09-GATE","ACT-15-CI"],"si":null,"produce":null,"por_que":[{"id":"ISO-8.1","marco":"iso42001","referencia":{"es":"cláusula 8.1","en":"clause 8.1"},"titulo":{"es":"Planificación y control operacional","en":"Operational planning and control"}}]},{"id":"F-OPE-2","paquete":"iso-operacion","destinatario":"responsable","texto":{"es":"¿Qué procesos, productos o servicios relevantes para sus sistemas de IA le presta un tercero, y cómo los controla?","en":"Which processes, products or services relevant to your AI systems are provided externally, and how do you control them?"},"ayuda":{"es":"La cláusula 8.1 exige controlar lo provisto externamente y el control A.10.3 lo desarrolla. En la práctica esto es su proveedor de modelo fundacional, su nube, su etiquetador de datos y su API de terceros. El artículo 25 del Reglamento añade que si usted pone su marca sobre un sistema de alto riesgo de otro, o lo modifica sustancialmente, pasa a ser usted el proveedor con todo lo que eso arrastra.","en":"Clause 8.1 requires control of externally provided items and control A.10.3 develops it. In practice this is your foundation model supplier, your cloud, your data labeller and your third-party APIs. Article 25 of the Regulation adds that if you put your name on someone else's high-risk system, or substantially modify it, you become the provider with everything that entails."},"formato":"lista","vigencia_dias":180,"exige":{"minimo_elementos":1},"opciones":[],"sirve_a":["ISO-8.1","A.10.3","AIA-025"],"salta_si_cubre":["ACT-25-CAMBIO"],"si":null,"produce":null,"por_que":[{"id":"ISO-8.1","marco":"iso42001","referencia":{"es":"cláusula 8.1","en":"clause 8.1"},"titulo":{"es":"Planificación y control operacional","en":"Operational planning and control"}},{"id":"A.10.3","marco":"iso42001","referencia":{"es":"Anexo A, A.10.3","en":"Annex A, A.10.3"},"titulo":{"es":"Proveedores","en":"Suppliers"}},{"id":"AIA-025","marco":"ai-act","referencia":{"es":"artículo 25","en":"Article 25"},"titulo":{"es":"Responsabilidades a lo largo de la cadena de valor de la IA","en":"Responsibilities along the AI value chain"}}]},{"id":"F-OPE-3","paquete":"iso-operacion","destinatario":"responsable","texto":{"es":"¿A qué intervalos se repiten la evaluación de riesgos y la evaluación de impacto, y qué cambio se considera lo bastante significativo como para adelantarlas?","en":"At what intervals are the risk assessment and the impact assessment repeated, and which change is significant enough to trigger them early?"},"ayuda":{"es":"Las cláusulas 8.2 y 8.4 piden 'a intervalos planificados o cuando se propongan o produzcan cambios significativos'. La trampa está en la segunda mitad: si no ha definido que es un cambio significativo, no puede demostrar que no lo hubo. Defina el umbral: cambio de modelo base, de datos de entrenamiento, de finalidad prevista, de población afectada.","en":"Clauses 8.2 and 8.4 require 'at planned intervals or when significant changes are proposed or occur'. The trap is the second half: if you have not defined what a significant change is, you cannot show there was none. Define the threshold: change of base model, of training data, of intended purpose, of affected population."},"formato":"texto_corto","vigencia_dias":365,"exige":{"minimo_caracteres":100,"exige_intervalo":true},"opciones":[],"sirve_a":["ISO-8.2","ISO-8.4"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-8.2","marco":"iso42001","referencia":{"es":"cláusula 8.2","en":"clause 8.2"},"titulo":{"es":"Evaluación de riesgos de la IA (operación)","en":"AI risk assessment (operation)"}},{"id":"ISO-8.4","marco":"iso42001","referencia":{"es":"cláusula 8.4","en":"clause 8.4"},"titulo":{"es":"Evaluación del impacto del sistema de IA (operación)","en":"AI system impact assessment (operation)"}}]},{"id":"F-OPE-4","paquete":"iso-operacion","destinatario":"responsable","texto":{"es":"¿Cómo comprueba que una medida de tratamiento de riesgo funcionó, y qué hace cuando no funciona?","en":"How do you verify that a risk treatment measure worked, and what do you do when it does not?"},"ayuda":{"es":"La cláusula 8.3 no se conforma con implantar el plan: exige verificar su eficacia, y cuando una opción de tratamiento no es eficaz, revisarla y revalidarla por el proceso de la 6.1.3 y actualizar el plan. Es el bucle que separa un sistema de gestión vivo de una carpeta. Diga con que evidencia comprueba la eficacia: una métrica, un muestreo, una auditoría.","en":"Clause 8.3 is not satisfied by implementing the plan: it requires verifying its effectiveness, and when a treatment option is not effective, reviewing and revalidating it through the 6.1.3 process and updating the plan. This is the loop that separates a living management system from a folder. Say with what evidence you verify effectiveness: a metric, a sample, an audit."},"formato":"texto_largo","vigencia_dias":180,"exige":{"minimo_caracteres":150},"opciones":[],"sirve_a":["ISO-8.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-8.3","marco":"iso42001","referencia":{"es":"cláusula 8.3","en":"clause 8.3"},"titulo":{"es":"Tratamiento de riesgos de la IA (operación)","en":"AI risk treatment (operation)"}}]},{"id":"F-OPE-D1","paquete":"iso-operacion","destinatario":"responsable","texto":{"es":"¿Dónde está la evaluación de impacto de este sistema sobre las personas, quién la firmó y cuándo se revisó por última vez?","en":"Where is this system's impact assessment on people, who signed it and when was it last reviewed?"},"ayuda":{"es":"Control A.5.3. La norma separa el riesgo PARA la organización del impacto SOBRE las personas, y pide documentar el segundo. No es el registro de riesgos: es quién puede salir perjudicado, cómo, y qué se decidió al respecto.\n\nTres datos comprobables: dónde está el documento, quién lo aprobó con su cargo, y la fecha de la última revisión. Si nunca se ha revisado desde que se escribió, dígalo: una evaluación de impacto de hace tres años sobre un sistema que se reentrena cada mes describe otro sistema.","en":"Control A.5.3. The standard separates risk TO the organisation from impact ON people, and requires documenting the second. It is not the risk register: it is who can be harmed, how, and what was decided about it.\n\nThree checkable facts: where the document is, who approved it and in what role, and the date of the last review. If it has never been reviewed since it was written, say so: a three-year-old impact assessment on a system retrained monthly describes a different system."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["A.5.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"A.5.3","marco":"iso42001","referencia":{"es":"Anexo A, A.5.3","en":"Annex A, A.5.3"},"titulo":{"es":"Documentación de las evaluaciones de impacto","en":"Documentation of AI system impact assessments"}}]},{"id":"F-OPE-D2","paquete":"iso-operacion","destinatario":"tecnico","texto":{"es":"¿Qué queda escrito de las decisiones de diseño de este sistema, y dónde puede leerlas alguien que llegue nuevo?","en":"What is written down about this system's design decisions, and where can somebody new read them?"},"ayuda":{"es":"Controles A.6.1.3 y A.6.2.3. Lo que se busca no es documentación de uso: es el rastro de POR QUÉ el sistema es como es. Qué alternativas se descartaron y con qué argumento, qué umbrales se eligieron y contra qué se calibraron, qué se decidió no hacer.\n\nLa prueba práctica: si la persona que tomó esas decisiones se marcha mañana, ¿queda algo que permita a otra entender el sistema sin reconstruirlo? Si la respuesta es que está en la cabeza de alguien o en un hilo de chat, es una respuesta y hay que darla: es exactamente el hallazgo que este control existe para encontrar.","en":"Controls A.6.1.3 and A.6.2.3. What is sought is not user documentation: it is the trail of WHY the system is the way it is. Which alternatives were discarded and on what argument, which thresholds were chosen and against what they were calibrated, what was decided not to do.\n\nThe practical test: if the person who made those decisions leaves tomorrow, is there anything letting somebody else understand the system without rebuilding it? If the answer is that it lives in somebody's head or a chat thread, that is an answer and it must be given: it is exactly the finding this control exists to surface."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":250},"opciones":[],"sirve_a":["A.6.2.3","A.6.1.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"A.6.2.3","marco":"iso42001","referencia":{"es":"Anexo A, A.6.2.3","en":"Annex A, A.6.2.3"},"titulo":{"es":"Documentación del diseño y desarrollo","en":"Documentation of AI system design and development"}},{"id":"A.6.1.3","marco":"iso42001","referencia":{"es":"Anexo A, A.6.1.3","en":"Annex A, A.6.1.3"},"titulo":{"es":"Procesos de diseño y desarrollo responsables","en":"Processes for responsible design and development"}}]},{"id":"F-RSK-1","paquete":"iso-riesgo","destinatario":"responsable","texto":{"es":"¿Cuáles son sus criterios de riesgo de IA: qué separa un riesgo aceptable de uno que no lo es?","en":"What are your AI risk criteria: what separates an acceptable risk from an unacceptable one?"},"ayuda":{"es":"Es la cláusula que más sistemas de gestión suspende, porque casi nadie la escribe y sin ella la evaluación de riesgos no es repetible. Necesita una escala, un umbral y quien decide cuando algo está en el límite. Si su criterio es cualitativo, dígalo: cualitativo y explícito vale, implícito no.","en":"This is the clause that fails the most management systems, because almost nobody writes it and without it the risk assessment is not repeatable. You need a scale, a threshold and who decides when something is borderline. If your criterion is qualitative, say so: qualitative and explicit is fine, implicit is not."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["AIA-009","ISO-6.1.1"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-009","marco":"ai-act","referencia":{"es":"artículo 9","en":"Article 9"},"titulo":{"es":"Sistema de gestión de riesgos","en":"Risk management system"}},{"id":"ISO-6.1.1","marco":"iso42001","referencia":{"es":"cláusula 6.1.1","en":"clause 6.1.1"},"titulo":{"es":"Acciones para abordar riesgos y oportunidades. Generalidades","en":"Actions to address risks and opportunities. General"}}]},{"id":"F-RSK-2","paquete":"iso-riesgo","destinatario":"responsable","texto":{"es":"Describa su proceso de evaluación de riesgos: quién lo ejecuta, cada cuánto, y cómo asegura que dos personas distintas lleguen al mismo resultado.","en":"Describe your risk assessment process: who runs it, how often, and how you ensure two different people reach the same result."},"ayuda":{"es":"La cláusula 6.1.2.b pide resultados consistentes, válidos y comparables entre evaluaciones repetidas. Eso, en la práctica, significa que el proceso esté escrito con suficiente detalle como para que no dependa de quien lo hace. El artículo 9 del Reglamento pide además que el sistema de gestión de riesgos sea iterativo y continuo a lo largo de todo el ciclo de vida, no una foto anual.","en":"Clause 6.1.2 b) requires consistent, valid and comparable results across repeated assessments. In practice that means the process is written in enough detail that it does not depend on who runs it. Article 9 of the Regulation further requires the risk management system to be iterative and continuous across the whole lifecycle, not an annual snapshot."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["ISO-6.1.2","AIA-009"],"salta_si_cubre":[],"si":null,"produce":"proceso-de-riesgo","por_que":[{"id":"ISO-6.1.2","marco":"iso42001","referencia":{"es":"cláusula 6.1.2","en":"clause 6.1.2"},"titulo":{"es":"Evaluación de riesgos de la IA","en":"AI risk assessment"}},{"id":"AIA-009","marco":"ai-act","referencia":{"es":"artículo 9","en":"Article 9"},"titulo":{"es":"Sistema de gestión de riesgos","en":"Risk management system"}}]},{"id":"F-RSK-3","paquete":"iso-riesgo","destinatario":"responsable","texto":{"es":"¿Quién aprueba el plan de tratamiento de riesgos y quién acepta formalmente el riesgo residual?","en":"Who approves the risk treatment plan and who formally accepts the residual risk?"},"ayuda":{"es":"La cláusula 6.1.3 exige aprobación de la dirección designada para las dos cosas por separado. Aceptar riesgo residual es una decisión de negocio con nombre y fecha, y es la que un auditor busca cuando algo ha salido mal.","en":"Clause 6.1.3 requires approval by designated management for both, separately. Accepting residual risk is a business decision with a name and a date, and it is the one an auditor looks for when something has gone wrong."},"formato":"persona","vigencia_dias":180,"exige":{"minimo_elementos":1},"opciones":[],"sirve_a":["ISO-6.1.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-6.1.3","marco":"iso42001","referencia":{"es":"cláusula 6.1.3","en":"clause 6.1.3"},"titulo":{"es":"Tratamiento de riesgos de la IA","en":"AI risk treatment"}}]},{"id":"F-RSK-4","paquete":"iso-riesgo","destinatario":"responsable","texto":{"es":"Describa su proceso de evaluación del impacto del sistema de IA sobre personas, grupos y sociedades.","en":"Describe your process for assessing the AI system's impact on individuals, groups and societies."},"ayuda":{"es":"No es la evaluación de riesgos: la 6.1.2 mira el riesgo para la organización y sus objetivos, la 6.1.4 mira las consecuencias para las personas, incluido el uso indebido previsible. Tiene que tener en cuenta el contexto técnico y social concreto donde se despliega y las jurisdicciones aplicables. Si su sistema entra en el artículo 27 del Reglamento, esta evaluación y la de derechos fundamentales comparten casi toda la evidencia: se pregunta una vez.","en":"It is not the risk assessment: 6.1.2 looks at risk to the organization and its objectives, 6.1.4 looks at consequences for people, including foreseeable misuse. It must take into account the specific technical and societal context of deployment and the applicable jurisdictions. If your system falls under Article 27 of the Regulation, this assessment and the fundamental rights one share nearly all their evidence: it is asked once."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["ISO-6.1.4","AIA-027","A.5.2"],"salta_si_cubre":[],"si":null,"produce":"evaluacion-de-impacto","por_que":[{"id":"ISO-6.1.4","marco":"iso42001","referencia":{"es":"cláusula 6.1.4","en":"clause 6.1.4"},"titulo":{"es":"Evaluación del impacto del sistema de IA","en":"AI system impact assessment"}},{"id":"AIA-027","marco":"ai-act","referencia":{"es":"artículo 27","en":"Article 27"},"titulo":{"es":"Evaluación de impacto relativa a los derechos fundamentales","en":"Fundamental rights impact assessment"}},{"id":"A.5.2","marco":"iso42001","referencia":{"es":"Anexo A, A.5.2","en":"Annex A, A.5.2"},"titulo":{"es":"Proceso de evaluación de impacto del sistema de IA","en":"AI system impact assessment process"}}]},{"id":"F-RSK-5","paquete":"iso-riesgo","destinatario":"responsable","texto":{"es":"¿Qué personas o grupos pueden verse perjudicados por este sistema, y cómo lo ha comprobado?","en":"Which individuals or groups can be harmed by this system, and how have you checked?"},"ayuda":{"es":"Nombre los grupos concretos y el perjuicio concreto. 'Los usuarios' no es un grupo. Si ha medido diferencias de comportamiento del modelo entre grupos, diga con que métrica y con que datos; si no lo ha medido, dígalo también: una evaluación de impacto que declara lo que no ha mirado vale más que una que insinúa que lo ha mirado todo.","en":"Name the specific groups and the specific harm. 'Users' is not a group. If you have measured differences in model behaviour across groups, say with which metric and which data; if you have not measured it, say that too: an impact assessment that declares what it did not look at is worth more than one implying it looked at everything."},"formato":"texto_largo","vigencia_dias":180,"exige":{"minimo_caracteres":200},"opciones":[],"sirve_a":["ISO-6.1.4","A.5.4","AIA-027"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-6.1.4","marco":"iso42001","referencia":{"es":"cláusula 6.1.4","en":"clause 6.1.4"},"titulo":{"es":"Evaluación del impacto del sistema de IA","en":"AI system impact assessment"}},{"id":"A.5.4","marco":"iso42001","referencia":{"es":"Anexo A, A.5.4","en":"Annex A, A.5.4"},"titulo":{"es":"Evaluación del impacto sobre personas o grupos","en":"Assessing AI system impact on individuals or groups"}},{"id":"AIA-027","marco":"ai-act","referencia":{"es":"artículo 27","en":"Article 27"},"titulo":{"es":"Evaluación de impacto relativa a los derechos fundamentales","en":"Fundamental rights impact assessment"}}]},{"id":"F-RSK-6","paquete":"iso-riesgo","destinatario":"responsable","texto":{"es":"¿Ha valorado los impactos sociales más amplios de este sistema más allá de sus usuarios directos?","en":"Have you assessed this system's broader societal impacts beyond its direct users?"},"ayuda":{"es":"El control A.5.5 separa el impacto sobre individuos del impacto sobre la sociedad: efectos sobre el empleo del sector, sobre el acceso a un servicio, sobre la concentración de un mercado, sobre el medio ambiente. Si concluye que no hay impacto social relevante, esa conclusión también se firma.","en":"Control A.5.5 separates impact on individuals from impact on society: effects on sector employment, on access to a service, on market concentration, on the environment. If you conclude there is no relevant societal impact, that conclusion is signed too."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":150},"opciones":[],"sirve_a":["ISO-6.1.4","A.5.5"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-6.1.4","marco":"iso42001","referencia":{"es":"cláusula 6.1.4","en":"clause 6.1.4"},"titulo":{"es":"Evaluación del impacto del sistema de IA","en":"AI system impact assessment"}},{"id":"A.5.5","marco":"iso42001","referencia":{"es":"Anexo A, A.5.5","en":"Annex A, A.5.5"},"titulo":{"es":"Evaluación de los impactos sociales","en":"Assessing societal impacts of AI systems"}}]},{"id":"F-RSK-7","paquete":"iso-riesgo","destinatario":"responsable","texto":{"es":"¿Cómo se planifican los cambios en el sistema de gestión de la IA?","en":"How are changes to the AI management system planned?"},"ayuda":{"es":"La cláusula 6.3 es corta y se pasa por alto: pide que los cambios se hagan de manera planificada. Basta con decir quién los propone, quién los aprueba y dónde se registran.","en":"Clause 6.3 is short and gets overlooked: it requires changes to be carried out in a planned manner. It is enough to say who proposes them, who approves them and where they are recorded."},"formato":"texto_corto","vigencia_dias":365,"exige":{"minimo_caracteres":80},"opciones":[],"sirve_a":["ISO-6.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-6.3","marco":"iso42001","referencia":{"es":"cláusula 6.3","en":"clause 6.3"},"titulo":{"es":"Planificación de los cambios","en":"Planning of changes"}}]},{"id":"F-SOP-1","paquete":"iso-soporte","destinatario":"responsable","texto":{"es":"¿Qué competencia necesitan las personas que trabajan con sus sistemas de IA, y qué evidencia tiene de que la tienen?","en":"What competence do the people working with your AI systems need, and what evidence do you have that they have it?"},"ayuda":{"es":"La cláusula 7.2 exige información documentada como evidencia de competencia: títulos, formación con fecha y asistentes, o experiencia acreditada. Ojo con la diferencia: el artículo 4 del Reglamento pide alfabetización en IA para todo el que opere o se vea afectado, y la 7.2 pide competencia técnica del que hace el trabajo. Se responden juntas pero no son lo mismo.","en":"Clause 7.2 requires documented information as evidence of competence: qualifications, dated training with attendees, or demonstrated experience. Note the difference: Article 4 of the Regulation requires AI literacy for everyone who operates or is affected by the system, while 7.2 requires technical competence of whoever does the work. They are answered together but they are not the same."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":150},"opciones":[],"sirve_a":["ISO-7.2","A.4.6","AIA-004"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-7.2","marco":"iso42001","referencia":{"es":"cláusula 7.2","en":"clause 7.2"},"titulo":{"es":"Competencia","en":"Competence"}},{"id":"A.4.6","marco":"iso42001","referencia":{"es":"Anexo A, A.4.6","en":"Annex A, A.4.6"},"titulo":{"es":"Recursos humanos","en":"Human resources"}},{"id":"AIA-004","marco":"ai-act","referencia":{"es":"artículo 4","en":"Article 4"},"titulo":{"es":"Alfabetización en materia de IA","en":"AI literacy"}}]},{"id":"F-SOP-2","paquete":"iso-soporte","destinatario":"responsable","texto":{"es":"¿Qué formación en IA ha impartido, a quién y cuándo?","en":"What AI training have you delivered, to whom and when?"},"ayuda":{"es":"El artículo 4 del Reglamento obliga a proveedores y responsables del despliegue a garantizar un nivel suficiente de alfabetización en IA de su personal y de quien opere los sistemas en su nombre, teniendo en cuenta sus conocimientos, el contexto de uso y las personas sobre las que se usa. Está en vigor desde el 2 de febrero de 2025. Una lista con fecha, contenido y asistentes es la evidencia; un curso comprado y no hecho no lo es.","en":"Article 4 of the Regulation requires providers and deployers to ensure a sufficient level of AI literacy among their staff and anyone operating the systems on their behalf, taking into account their knowledge, the context of use and the persons the systems are used on. It has applied since 2 February 2025. A list with date, content and attendees is the evidence; a purchased course nobody took is not."},"formato":"lista","vigencia_dias":365,"exige":{"minimo_elementos":1},"opciones":[],"sirve_a":["AIA-004"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"AIA-004","marco":"ai-act","referencia":{"es":"artículo 4","en":"Article 4"},"titulo":{"es":"Alfabetización en materia de IA","en":"AI literacy"}}]},{"id":"F-SOP-3","paquete":"iso-soporte","destinatario":"responsable","texto":{"es":"¿Cómo sabe una persona de su organización cuál es la política de IA y qué pasa si no la cumple?","en":"How does someone in your organization learn the AI policy and what happens if they do not follow it?"},"ayuda":{"es":"La toma de conciencia de la 7.3 no es formación: es que la gente sepa que existe la política, en que contribuye su trabajo y que implica no cumplirla. Un correo de alta y un apartado en el manual de acogida suelen bastar si se demuestra que llegaron.","en":"Awareness under 7.3 is not training: it is that people know the policy exists, how their work contributes, and what not conforming implies. An onboarding email and a section in the handbook usually suffice if you can show they arrived."},"formato":"texto_corto","vigencia_dias":365,"exige":{"minimo_caracteres":80},"opciones":[],"sirve_a":["ISO-7.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-7.3","marco":"iso42001","referencia":{"es":"cláusula 7.3","en":"clause 7.3"},"titulo":{"es":"Toma de conciencia","en":"Awareness"}}]},{"id":"F-SOP-4","paquete":"iso-soporte","destinatario":"responsable","texto":{"es":"¿Qué comunica sobre sus sistemas de IA, cuándo, a quién y por qué medio?","en":"What do you communicate about your AI systems, when, to whom and by which means?"},"ayuda":{"es":"La 7.4 pide las cuatro cosas explicitamente. Incluya la comunicación externa: si publica una nota cuando el modelo cambia, si avisa a los clientes de un incidente, si tiene un punto de contacto publicado. El artículo 73 del Reglamento le pone plazos duros a algunas de esas comunicaciones.","en":"Clause 7.4 asks for all four explicitly. Include external communication: whether you publish a note when the model changes, whether you notify customers of an incident, whether you have a published point of contact. Article 73 of the Regulation puts hard deadlines on some of those communications."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":150},"opciones":[],"sirve_a":["ISO-7.4","A.8.3","A.8.5"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-7.4","marco":"iso42001","referencia":{"es":"cláusula 7.4","en":"clause 7.4"},"titulo":{"es":"Comunicación","en":"Communication"}},{"id":"A.8.3","marco":"iso42001","referencia":{"es":"Anexo A, A.8.3","en":"Annex A, A.8.3"},"titulo":{"es":"Información externa","en":"External reporting"}},{"id":"A.8.5","marco":"iso42001","referencia":{"es":"Anexo A, A.8.5","en":"Annex A, A.8.5"},"titulo":{"es":"Información para las partes interesadas","en":"Information for interested parties"}}]},{"id":"F-SOP-5","paquete":"iso-soporte","destinatario":"responsable","texto":{"es":"¿Dónde vive la información documentada de su sistema de gestión y quién controla su versión?","en":"Where does your management system's documented information live and who controls its version?"},"ayuda":{"es":"Si la respuesta es una carpeta compartida sin control de versiones, la cláusula 7.5.3 no se cumple: pide control de cambios, retención, disposición y protección frente a perdida de integridad. Actaira sella cada evidencia que recibe y guarda su huella, lo que cubre la parte de integridad; el resto es suyo.","en":"If the answer is a shared folder with no version control, clause 7.5.3 is not met: it requires change control, retention, disposition and protection against loss of integrity. Actaira seals every piece of evidence it receives and keeps its digest, which covers the integrity part; the rest is yours."},"formato":"texto_corto","vigencia_dias":365,"exige":{"minimo_caracteres":80},"opciones":[],"sirve_a":["ISO-7.5.1","ISO-7.5.2","ISO-7.5.3"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"ISO-7.5.1","marco":"iso42001","referencia":{"es":"cláusula 7.5.1","en":"clause 7.5.1"},"titulo":{"es":"Información documentada. Generalidades","en":"Documented information. General"}},{"id":"ISO-7.5.2","marco":"iso42001","referencia":{"es":"cláusula 7.5.2","en":"clause 7.5.2"},"titulo":{"es":"Creación y actualización de la información documentada","en":"Creating and updating documented information"}},{"id":"ISO-7.5.3","marco":"iso42001","referencia":{"es":"cláusula 7.5.3","en":"clause 7.5.3"},"titulo":{"es":"Control de la información documentada","en":"Control of documented information"}}]},{"id":"F-SOP-R1","paquete":"iso-soporte","destinatario":"tecnico","texto":{"es":"Para cada conjunto de datos que usa el sistema: de dónde salió, con qué permiso lo usan, y quién responde de él.","en":"For each dataset the system uses: where it came from, under what permission you use it, and who is accountable for it."},"ayuda":{"es":"Controles A.4.3 y A.7.2. No pide un inventario bonito: pide que por cada conjunto se pueda contestar la cadena entera. Origen (comprado, recogido, público, generado, cedido por el cliente), base que les permite usarlo para ESTO —un contrato, un consentimiento, una licencia, una base legal—, quién es su propietario dentro de la organización y desde cuándo no se revisa.\n\nActaira puede ver si existe una ficha de datos en el repositorio; lo que no puede ver es nada de lo anterior, y esa diferencia es justo la que separa «hay un fichero» de «los datos se pueden usar». Si un conjunto lo aportó un cliente, dígalo: suele ser el que peor documentado está y el que más problemas da después.","en":"Controls A.4.3 and A.7.2. It does not ask for a pretty inventory: it asks that for each dataset the whole chain can be answered. Origin (bought, collected, public, generated, supplied by the customer), the basis that lets you use it for THIS —a contract, consent, a licence, a legal basis—, who owns it inside the organisation and how long since it was last reviewed.\n\nActaira can see whether a dataset card exists in the repository; what it cannot see is any of the above, and that difference is exactly what separates «there is a file» from «the data can be used». If a dataset was supplied by a customer, say so: it is usually the worst documented and the one that causes the most trouble later."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":250},"opciones":[],"sirve_a":["A.4.3","A.7.2"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"A.4.3","marco":"iso42001","referencia":{"es":"Anexo A, A.4.3","en":"Annex A, A.4.3"},"titulo":{"es":"Recursos de datos","en":"Data resources"}},{"id":"A.7.2","marco":"iso42001","referencia":{"es":"Anexo A, A.7.2","en":"Annex A, A.7.2"},"titulo":{"es":"Datos para el desarrollo y la mejora","en":"Data for development and enhancement"}}]},{"id":"F-SOP-R2","paquete":"iso-soporte","destinatario":"tecnico","texto":{"es":"¿Qué herramientas y qué recursos de cómputo sostienen este sistema, y qué pasa el día que uno de ellos deje de estar disponible?","en":"Which tools and which compute resources hold this system up, and what happens the day one of them stops being available?"},"ayuda":{"es":"Controles A.4.4 y A.4.5. Dos listas y una pregunta. Las herramientas: marcos, bibliotecas, servicios de terceros y modelos de los que depende, con su versión. El cómputo: dónde se entrena y dónde se sirve, con qué capacidad y bajo qué contrato.\n\nLa pregunta es la que de verdad mide el control, y es la que casi nadie tiene contestada: si mañana un proveedor de modelo cambia los términos, sube el precio, retira una versión o cierra, ¿qué hacen? Un sistema entero apoyado en un punto único del que no se puede salir es un riesgo de continuidad, y la norma lo pide como recurso porque de ahí vienen los incidentes que no se ven venir.","en":"Controls A.4.4 and A.4.5. Two lists and one question. Tools: frameworks, libraries, third-party services and models it depends on, with versions. Compute: where it trains and where it serves, at what capacity and under what contract.\n\nThe question is what really measures the control, and it is the one almost nobody has answered: if tomorrow a model provider changes terms, raises the price, retires a version or shuts down, what do you do? A whole system resting on a single point you cannot leave is a continuity risk, and the standard asks for it as a resource because that is where the incidents nobody saw coming come from."},"formato":"texto_largo","vigencia_dias":365,"exige":{"minimo_caracteres":250},"opciones":[],"sirve_a":["A.4.4","A.4.5"],"salta_si_cubre":[],"si":null,"produce":null,"por_que":[{"id":"A.4.4","marco":"iso42001","referencia":{"es":"Anexo A, A.4.4","en":"Annex A, A.4.4"},"titulo":{"es":"Recursos de herramientas","en":"Tooling resources"}},{"id":"A.4.5","marco":"iso42001","referencia":{"es":"Anexo A, A.4.5","en":"Annex A, A.4.5"},"titulo":{"es":"Recursos de sistema y de cómputo","en":"System and computing resources"}}]},{"id":"F-USO-1","paquete":"iso-uso","destinatario":"responsable","texto":{"es":"¿Qué reglas tienen escritas sobre cómo se puede y cómo no se puede usar este sistema, y cómo se enteran de que alguien se las salta?","en":"What rules do you have written about how this system may and may not be used, and how do you find out when somebody breaks them?"},"ayuda":{"es":"Control A.9.2. La primera mitad la tiene casi todo el mundo: una política de uso aceptable. La segunda c
