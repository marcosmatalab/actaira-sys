<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Actaira</title>
<style>
__ESTILO__
</style>


<header>
  <div class="wrap bar">
    <div class="logo" role="img" aria-label="Actaira"></div>
    <div class="controles">
      <div class="seg" id="idioma" role="group" aria-label="Idioma">
        <!-- Un boton por idioma de `textos.json`, generado al construir.
             Escribirlos aqui a mano es la lista que se queda corta el dia
             que se anade el septimo, y este arbol ya tiene dos cicatrices
             de esa clase de lista. -->
        __IDIOMAS__
      </div>
      <div class="seg" id="tema" role="group" aria-label="Tema">
        <button data-t="light" aria-pressed="false">☼</button><button data-t="dark" aria-pressed="false">☾</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap hero">
  <p class="eyebrow">Reglamento (UE) 2024/1689 · ISO/IEC 42001:2023</p>
  <h1 id="titular"></h1>
  <p id="entradilla"></p>
</div>

<div class="ciclo wrap" id="ciclo"></div>

<nav class="wrap vistas" id="vistas" role="tablist">
  <!-- Cada boton con su `id`. Nacen vacios a proposito -- el texto lo pone el
       idioma -- y un boton vacio sin id ni `aria-label` es un boton que un
       lector de pantalla no puede anunciar: quien no ve la pantalla oye
       «boton» tres veces y no sabe cual es cual. El id lo ata a su texto.

       EL PANEL QUE ABRE CADA PESTANA SE LLAMA `p-...` Y NO `v-...`.
       ------------------------------------------------------------------
       Los tres `<main>` de abajo llevaban EL MISMO id que su boton. Un id
       repetido no falla: `getElementById` devuelve el primero en el
       documento, que es el boton, asi que `cambiarVista` escondia y ensenaba
       las PESTANAS en vez de los paneles. Efecto: al cargar quedaba una sola
       pestana visible y las otras dos vistas -- el cuestionario entero y la
       declaracion de aplicabilidad -- no se podian alcanzar nunca.

       Es el mismo defecto que la quinta pasada encontro en el panel (siete de
       once vistas sin poder pulsarse) reaparecido aqui, y por el mismo
       motivo: la fase `navegador` abre el panel y no abre esta pagina. La
       causa la sujeta ahora `revisar_estructura`, que rechaza cualquier id
       repetido en las tres paginas. -->
  <button id="v-aplica" data-v="aplica" role="tab" aria-selected="true"
          aria-controls="p-aplica"></button>
  <button id="v-pregunta" data-v="pregunta" role="tab" aria-selected="false"
          aria-controls="p-pregunta"></button>
  <button id="v-soa" data-v="soa" role="tab" aria-selected="false"
          aria-controls="p-soa"></button>
</nav>

<main class="wrap" id="p-aplica" role="tabpanel" aria-labelledby="v-aplica">
  <div class="panel">
    <aside class="tarjeta">
      <h2><span id="lb-perfil"></span><span id="lb-fecha-corta"></span></h2>
      <div class="cuerpo">
        <div class="campo">
          <span class="pregunta" id="lb-roles"></span>
          <div class="roles" id="roles"></div>
        </div>
        <div id="exclusiones" style="border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:17px"></div>
        <div id="preguntas"></div>
        <div class="campo">
          <span class="pregunta" id="lb-fecha"></span>
          <div class="seg" id="fecha" style="width:100%">
            <!-- Sin `data-f` escrito: lo pone la logica con la fecha de HOY. Estaba
                 clavado al dia en que se construyo la pagina, asi que el boton que
                 dice «Hoy» llevaba a un dia del pasado, y se alejaba uno mas cada
                 dia. No se inyecta al construir porque esta pagina tiene que salir
                 byte a byte igual en cualquier maquina. -->
            <button id="f-hoy" aria-pressed="true" style="flex:1"></button>
            <button id="f-2027" data-f="2027-12-02" aria-pressed="false" style="flex:1"></button>
          </div>
        </div>
      </div>
    </aside>

    <section>
      <div class="recuento" id="recuento"></div>
      <div id="aviso"></div>
      <div class="lista" id="lista"></div>
    </section>
  </div>

  <section class="seccion">
    <h2 id="cat-t"></h2>
    <p id="cat-p"></p>
    <div class="tablawrap"><table><thead><tr>
      <th id="th-id"></th><th id="th-tit"></th><th id="th-niv"></th><th id="th-cruce"></th>
    </tr></thead><tbody id="tbody-iso"></tbody></table></div>
  </section>

  <p class="pie" id="pie"></p>
</main>

<main class="wrap oculto" id="p-pregunta" role="tabpanel" aria-labelledby="v-pregunta">
  <section class="seccion">
    <h2 id="q-t"></h2>
    <p id="q-p"></p>
    <div class="firmante">
      <label><span id="lb-q-nombre"></span><input id="q-nombre" autocomplete="off"></label>
      <label><span id="lb-q-cargo"></span><input id="q-cargo" autocomplete="off"></label>
      <button class="accion" id="q-descargar"></button>
    </div>
    <p class="pie" id="q-descarga-p"></p>
    <div class="recuento" id="q-recuento"></div>
    <div class="seg filtro" id="q-filtro" role="group"></div>
    <div id="q-lista"></div>
  </section>
</main>

<main class="wrap oculto" id="p-soa" role="tabpanel" aria-labelledby="v-soa">
  <section class="seccion">
    <h2 id="soa-t"></h2>
    <p id="soa-p"></p>
    <div class="aviso" id="soa-notas"></div>
    <div class="recuento" id="soa-recuento"></div>
    <div class="tablawrap"><table><thead><tr>
      <th id="soa-th-ctrl"></th><th id="soa-th-entra"></th>
      <th id="soa-th-proc"></th><th id="soa-th-just"></th>
    </tr></thead><tbody id="tbody-soa"></tbody></table></div>
  </section>

  <section class="seccion">
    <h2 id="cl-t"></h2>
    <p id="cl-p"></p>
    <div class="tablawrap"><table><thead><tr>
      <th id="cl-th-id"></th><th id="cl-th-tit"></th>
      <th id="cl-th-doc"></th><th id="cl-th-prod"></th>
    </tr></thead><tbody id="tbody-cl"></tbody></table></div>
  </section>
</main>

<div id="detalle"></div>

<script>
__LOGICA__
</script>
